      return `<section class="team-block" style="--tc:${t.color}"><header>
        <input type="color" data-f="tcolor" data-id="${t.id}" data-focus="tc-${t.id}" value="${esc(t.color)}" aria-label="${L('Barva týmu','Team colour')}">
        <input class="tname" data-f="tname" data-id="${t.id}" data-focus="tn-${t.id}" value="${esc(t.name)}" aria-label="${L('Název týmu','Team name')}">
        <label class="chk" title="${L('Tvůj tým, zvýrazní se v tabulkách','Your team, highlighted in the tables')}"><input type="checkbox" data-f="tplayer" data-id="${t.id}" data-focus="tp-${t.id}"${t.player?' checked':''}> ${L('Můj tým','My team')}</label>
        <button class="btn sm ghost danger" data-act="deleteTeam" data-id="${t.id}" aria-label="${L('Smazat tým','Delete team')} ${esc(t.name)}">${L('Smazat','Delete')}</button></header>
        <ul>${ds.map(d=>driverRow(s,d)).join('') || `<li class="none">${L('Tým nemá žádné jezdce.','No drivers in this team.')}</li>`}</ul></section>`; }).join('')}
    <section class="team-block free"><header><b>${L('Bez angažmá','Free agents')}</b><span class="muted">${free.length} ${P(free.length,'jezdec','jezdci','jezdců','driver','drivers')}</span></header>
      ${free.length ? ['other','real','f2','game','legend','hist'].map(g=>{ const ds = free.filter(d=>(d.fa||'other')===g).sort((a,b)=>a.name.localeCompare(b.name,'cs'));
        if(!ds.length) return '';
        return `<details class="fa-group"${g==='other' || ui.faOpen===g ? ' open' : ''} data-g="${g}"><summary>${esc(FA_LABEL()[g])} <span class="muted">${ds.length}</span></summary><ul>${ds.map(d=>driverRow(s,d)).join('')}</ul></details>`; }).join('')
        : `<ul><li class="none">${L('Všichni jezdci mají tým.','Every driver has a team.')}</li></ul>`}</section>
  </div>`;
}

/* ---------- statistiky ---------- */
function viewStats(s){
  if(!s.rounds.length) return noRounds();
  const st = compute(s);
  const rr = s.rounds.map((r,i)=>{
    const t = trackById(r.trackId), S = r.s.race;
    const w = Object.entries(S.res).find(([,e])=>e.pos===1 && !e.status);
    const wd = w ? drvOf(s, w[0]) : null, pd = S.pole ? drvOf(s, S.pole) : null, fd = S.fl ? drvOf(s, S.fl) : null;
    let sp = '';
    if(r.sprint){ const sw = Object.entries(r.s.sprint.res).find(([,e])=>e.pos===1 && !e.status); const sd = sw ? drvOf(s, sw[0]) : null; sp = sd ? esc(sd.name) : ''; }
    const pt = S.pole && r.q && r.q.quali && r.q.quali.res[S.pole] ? qBest(r.q.quali.res[S.pole]) : '';
    return `<tr><td class="num">${i+1}</td><td title="${esc(circuitName(t))}">${esc(t?gpName(t):'—')}</td><td class="num">${lapsFor(s, r, 'race') ?? ''}${r.sprint && lapsFor(s, r, 'sprint') ? ` <span class="muted">/ ${lapsFor(s, r, 'sprint')}</span>` : ''}</td><td>${pd?esc(pd.name):''}${pt?` <span class="muted">${esc(pt)}</span>`:''}</td><td>${wd?`<b>${esc(wd.name)}</b>`:''}</td><td>${sp}</td>
      <td>${fd?esc(fd.name):''}${S.flTime?` <span class="muted">${esc(S.flTime)}</span>`:''}</td><td>${w?stratHTML(w[1]):''}</td></tr>`;
  }).join('');
  const f1 = s.series!=='F2';
  const qs = new Map();
  s.rounds.forEach(r=>{ const Q = r.q && r.q.quali; if(!Q) return;
    for(const [id,e] of Object.entries(Q.res)){ if(!e.pos) continue; const x = qs.get(id) || {n:0, sum:0, q3:0, best:null};
      x.n++; x.sum += e.pos; if(e.pos<=10) x.q3++; if(x.best===null || e.pos<x.best) x.best = e.pos; qs.set(id, x); } });
  const hasQS = qs.size > 0;
  const ds = st.drivers.filter(d=>d.has || qs.has(d.id));
  const dr = ds.map((d,i)=>{ const t = teamOf(s, d.teamId); const q = qs.get(d.id);
    return `<tr class="${d.player?'is-player':''}"><td class="num">${i+1}</td><td class="name"><span class="ts" style="--tc:${t?t.color:'transparent'}"></span>${esc(d.name)}</td>
      <td class="num">${d.starts}</td><td class="num">${d.wins}</td><td class="num">${d.podiums}</td><td class="num">${d.poles}</td><td class="num">${d.fls}</td><td class="num">${d.dnfs}</td>
      <td class="num">${d.best??'–'}</td><td class="num">${d.finN ? dec(d.finSum/d.finN) : '–'}</td>
      ${hasQS ? `<td class="num">${q ? q.best : '–'}</td><td class="num">${q ? dec(q.sum/q.n) : '–'}</td>${f1?`<td class="num">${q ? q.q3 : 0}</td>`:''}` : ''}
      <td class="num"><b>${d.pts}</b></td></tr>`; }).join('');
  const qt = s.rounds.map((r,i)=>{
    const t = trackById(r.trackId);
    return ['squali','quali'].map(kind=>{
      const Q = r.q && r.q[kind]; if(!Q) return '';
      const segs = qSegs(s, kind, r);
      const list = Object.entries(Q.res).filter(([,e])=>(e.t1||[]).length || (e.t2||[]).length || (e.t3||[]).length)
        .map(([id,e])=>({d:drvOf(s,id), e})).filter(x=>x.d).sort((a,b)=>(a.e.pos||99)-(b.e.pos||99));
      if(!list.length) return '';
      return `<tr><th colspan="${2+segs.length}" style="padding-top:12px;color:var(--ink)">${i+1}. ${esc(t?gpName(t):'—')}, ${sessLabel(s,kind).toLowerCase()}</th></tr>` + list.map(x=>
        `<tr><td class="num">${x.e.pos||''}</td><td>${esc(x.d.name)}</td>${segs.map(([k,label],si)=>{ const ty = x.e['t'+(si+1)]||[];
          return `<td>${ty.length ? `<span class="tyres"><span class="muted" style="margin-right:4px">${label}</span>${ty.map(c=>tyreChip(c)).join('')}${x.e[k]?`<span class="muted" style="margin-left:6px">${esc(x.e[k])}</span>`:''}</span>` : ''}</td>`; }).join('')}</tr>`).join('');
    }).join('');
  }).join('');
  const strat = s.rounds.map((r,i)=>{
    const t = trackById(r.trackId);
    const list = Object.entries(r.s.race.res).filter(([,e])=>(e.tyres||[]).length || (e.pits!=='' && e.pits!=null))
      .map(([id,e])=>({d:drvOf(s,id), e})).filter(x=>x.d)
      .sort((a,b)=>((a.e.pos||99)+(a.e.status?100:0)) - ((b.e.pos||99)+(b.e.status?100:0)));
    if(!list.length) return '';
    return `<tr><th colspan="3" style="padding-top:12px;color:var(--ink)">${i+1}. ${esc(t?gpName(t):'—')}${+r.s.race.mand ? ` <span class="muted">${L('povinné pit stopy','mandatory pit stops')}: ${r.s.race.mand}</span>` : ''}</th></tr>` + list.map(x=>
      `<tr><td class="num">${x.e.status ? esc(x.e.status) : (x.e.pos||'')}</td><td>${esc(x.d.name)}</td><td>${stratHTML(x.e)}</td></tr>`).join('');
  }).join('');
  return `<div class="panel"><h2>${L('Závod po závodu','Race by race')}</h2><div class="scroll"><table><thead><tr><th class="num">${L('Závod','Rd')}</th><th>${L('Velká cena','Grand Prix')}</th><th class="num">${L('Kola','Laps')}</th><th>Pole</th><th>${L('Vítěz','Winner')}</th><th>${L('Vítěz sprintu','Sprint winner')}</th><th>${L('Nejrychlejší kolo','Fastest lap')}</th><th>${L('Strategie vítěze','Winner’s strategy')}</th></tr></thead><tbody>${rr}</tbody></table></div></div>
  <div class="panel"><h2>${L('Jezdci v sezóně','Drivers this season')}</h2>${ds.length ? `<div class="scroll"><table><thead><tr><th class="num">${L('Poz.','Pos')}</th><th>${L('Jezdec','Driver')}</th><th class="num">${L('Starty','Starts')}</th><th class="num">${L('Výhry','Wins')}</th><th class="num">${L('Pódia','Podiums')}</th><th class="num">Pole</th><th class="num">${L('NK','FL')}</th><th class="num">DNF</th><th class="num">${L('Nejlepší','Best')}</th><th class="num">${L('Ø dojezd','Avg finish')}</th>${hasQS ? `<th class="num">${L('Nejlepší kvali','Best quali')}</th><th class="num">${L('Ø kvali','Avg quali')}</th>${f1?'<th class="num" title="'+L('Počet postupů do Q3','Q3 appearances')+'">Q3</th>':''}` : ''}<th class="num">${L('Body','Points')}</th></tr></thead><tbody>${dr}</tbody></table></div>` : `<p class="muted">${L('Zatím bez výsledků.','No results yet.')}</p>`}</div>
  <div class="panel"><h2>${L('Strategie','Strategy')}</h2>${strat ? `<div class="scroll"><table><tbody>${strat}</tbody></table></div>` : `<p class="muted">${L('Zatím nejsou zapsané žádné zastávky ani pneumatiky. Zapisují se u výsledků závodu a jsou nepovinné.','No pit stops or tyres entered yet. They are optional and entered alongside race results.')}</p>`}</div>
  ${incPanel(s)}
  ${penPanel(s)}
  ${qt ? `<div class="panel"><h2>${L('Pneumatiky v kvalifikaci','Qualifying tyres')}</h2><div class="scroll"><table><tbody>${qt}</tbody></table></div></div>` : ''}`;
}

function penPanel(s){
  const rows = [];
  s.rounds.forEach((r,i)=>{
    const t = trackById(r.trackId);
    const gp = `${i+1}. ${esc(t?gpName(t):'—')}`;
    sessionsFor(s, r).forEach(k=>{
      if(isQ(k)){
        const Q = r.q && r.q[k]; if(!Q) return;
        for(const [id,e] of Object.entries(Q.res)) (e.gpens||[]).forEach(p=>{ const d = drvOf(s,id); if(d) rows.push(`<tr><td>${gp}</td><td>${L('Rošt','Grid')}: ${esc(sessLabel(s, k==='squali' ? 'sprint' : 'race').toLowerCase())}</td><td>${esc(d.name)}</td><td><span class="pen">${esc(penShort(p))}</span></td><td>${esc(reasonText(p, GRID_REASONS))}</td></tr>`); });
      } else {
        const S = r.s[k];
        for(const [id,e] of Object.entries(S.res)) (e.pens||[]).forEach(p=>{ const d = drvOf(s,id); if(d) rows.push(`<tr><td>${gp}</td><td>${esc(sessLabel(s,k))}</td><td>${esc(d.name)}</td><td><span class="pen">${esc(penShort(p))}</span>${e.roadPos && e.pos && e.roadPos!==e.pos ? ` <span class="muted">P${e.roadPos}→P${e.pos}</span>` : ''}</td><td>${esc(reasonText(p, RACE_REASONS))}</td></tr>`); });
      }
    });
  });
  if(!rows.length) return '';
  return `<div class="panel"><h2>${L('Penalizace','Penalties')}</h2><div class="scroll"><table><thead><tr><th>${L('Závod','Round')}</th><th>${L('Část','Session')}</th><th>${L('Jezdec','Driver')}</th><th>${L('Penalizace','Penalty')}</th><th>${L('Důvod','Reason')}</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
}

/* ---------- nastavení ---------- */
function scoringPanel(s){
  const sc = scoringOf(s);
  const pre = scoringPreset(sc);
  const n = Math.max(10, s.drivers.filter(d=>d.teamId).length, sc.race.length, sc.sprint.length);
  const grid = (key, arr) => `<div class="pts-grid">${Array.from({length:n}, (_,i)=>`<label>${i+1}. ${L('místo','place')}<input type="number" min="0" max="999" data-f="sc-${key}" data-i="${i}" data-focus="sc-${key}-${i}" value="${+arr[i]||0}"></label>`).join('')}</div>`;
  return `<div class="panel"><h2>${L('Bodování','Points system')}</h2>
    <div class="sc-head">
      <label>${L('Předvolba','Preset')} <select data-f="scPreset" data-focus="scPreset">${SC_NAMES().map(([k,l])=>`<option value="${k}"${pre===k?' selected':''}>${esc(l)}</option>`).join('')}</select></label>
      <label>${L('Bonus za pole position','Pole position bonus')} <input type="number" min="0" max="99" data-f="sc-pole" data-focus="sc-pole" value="${+sc.pole||0}" style="width:90px"></label>
      <label>${L('Bonus za nejrychlejší kolo','Fastest lap bonus')} <input type="number" min="0" max="99" data-f="sc-fl" data-focus="sc-fl" value="${+sc.fl||0}" style="width:90px"></label>
      <label class="chk"><input type="checkbox" data-f="sc-flTop" data-focus="sc-flTop"${sc.flTop?' checked':''}> ${L('Bonus za NK jen pro první desítku','FL bonus only for a top-10 finish')}</label>
      <label class="chk"><input type="checkbox" data-f="sc-flSprint" data-focus="sc-flSprint"${sc.flSprint?' checked':''}> ${L('Bonus za NK i ve sprintu','FL bonus in the sprint too')}</label>
    </div>
    <h4>${s.series==='F2' ? L('Hlavní závod','Feature race') : L('Závod','Race')}</h4>${grid('race', sc.race)}
    <h4>Sprint</h4>${grid('sprint', sc.sprint)}
    <p class="hint">${L('Změna bodování hned přepočítá celou sezónu. Jakmile změníš jakékoli číslo, předvolba se přepne na Vlastní bodování. Jednotlivým jezdcům můžeš body upravit v závodě přes Penalizace → Úprava bodů.',
      'Changing the points system recalculates the whole season right away. Edit any number and the preset switches to Custom points. To change points for a single driver, use Penalties → Points adjustment in the race.')}</p>
  </div>`;
}
function viewSettings(s){
  return `<div class="panel"><h2>${L('Sezóna','Season')}</h2><div class="form-grid">
    <label>${L('Rok','Year')} <input type="number" data-f="syear" data-focus="syear" value="${s.year}" min="1950" max="2100"></label>
    <label>${L('Série','Series')} <select data-f="sseries" data-focus="sseries"><option value="F1"${s.series==='F1'?' selected':''}>${seriesName('F1')}</option><option value="F2"${s.series==='F2'?' selected':''}>${seriesName('F2')}</option></select></label>
    <label>${L('Formát kvalifikace','Qualifying format')} <select data-f="sqfmt" data-focus="sqfmt">${QFMTS().filter(([k])=>s.series!=='F2' || k!=='full').map(([k,l])=>`<option value="${k}"${seasonQFmt(s)===k?' selected':''}>${esc(l)}</option>`).join('')}</select></label>
    <label>${L('Délka závodu','Race distance')} <select data-f="sdist" data-focus="sdist">${DIST().map(([k,l])=>`<option value="${k}"${(s.dist||'25')===k?' selected':''}>${esc(l)}</option>`).join('')}</select></label>
    ${(s.dist||'25')==='custom' ? `<label>${L('Počet kol závodu','Laps per race')} <input type="number" min="1" max="200" data-f="sdistlaps" data-focus="sdistlaps" value="${esc(s.distLaps??'')}"></label>` : ''}
    <label class="chk"><input type="checkbox" data-f="sstrat" data-focus="sstrat"${s.showStrategy!==false?' checked':''}> ${L('Zapisovat zastávky a pneumatiky','Track pit stops and tyres')}</label>
  </div>
  <p class="hint" style="margin-top:10px">${L('Počet kol se u každé tratě dopočítá podle skutečné délky závodu F1 stejně jako ve hře (sprint je zhruba třetina). U konkrétního závodu ho můžeš přepsat v záložce Závody a výsledky.',
    'Laps are calculated for every track from the real F1 race length, like in the game (a sprint is about a third). You can overwrite them for a single round in Races & results.')}</p></div>

  <div class="panel"><h2>${L('Vlastní tratě','Custom tracks')}</h2>
    ${state.customTracks.length ? `<ul class="track-list">${state.customTracks.map(t=>`<li>${esc(t.name)} <span class="muted">${esc(t.code)}</span><button class="btn sm ghost danger" data-act="deleteTrack" data-id="${t.id}" aria-label="${L('Smazat trať','Delete track')} ${esc(t.name)}">${L('Smazat','Delete')}</button></li>`).join('')}</ul>`
      : `<p class="muted">${L('Kromě tratí z F1 25 a starších her si můžeš přidat jakoukoli další, třeba fiktivní nebo z modu.','Besides the tracks from F1 25 and older games, you can add any other one, fictional or from a mod.')}</p>`}
    <button class="btn" data-act="addTrack">${L('Přidat vlastní trať','Add custom track')}</button></div>
  <div class="panel"><h2>${L('O aplikaci','About')}</h2><p class="muted">F1 Season Tracker ${APP_VERSION} © 2026 Josef Štěpnek. ${L('Mapy tratí: data časování F1 (FastF1, TracingInsights) a přispěvatelé OpenStreetMap (ODbL). Vlajky: flag-icons (MIT).','Track maps: F1 timing data (FastF1, TracingInsights) and OpenStreetMap contributors (ODbL). Flags: flag-icons (MIT).')}</p><button class="btn" data-act="checkUpd" style="margin-top:10px">${L('Zkontrolovat aktualizace','Check for updates')}</button></div>
  <div class="panel"><h2>${L('Smazání','Delete')}</h2><p class="muted">${L(`Smaže sezónu ${s.year} včetně všech výsledků. Nejde vrátit.`, `Deletes the ${s.year} season with all its results. This can’t be undone.`)}</p>
    <button class="btn danger" data-act="deleteSeason">${L(`Smazat sezónu ${s.year}`, `Delete ${s.year} season`)}</button></div>`;
}

/* ---------- přehled kariéry ---------- */
function viewOverview(c){
  const seasons = [...c.seasons].sort((a,b)=>a.year-b.year);
  if(!seasons.length) return `<div class="panel"><h3>${L('Kariéra nemá žádnou sezónu','This career has no seasons')}</h3><button class="btn primary" data-act="newSeason">${L('Přidat sezónu','Add season')}</button></div>`;
  const hof = new Map();
  const place = (i, pts) => L(`${i}. místo, ${ptsTxt(pts)}`, `P${i}, ${ptsTxt(pts)}`);
  const rows = seasons.map(s=>{
    const st = compute(s);
    const done = s.rounds.filter(roundHasData).length, total = s.rounds.length, fin = total && done===total;
    const ch = st.drivers[0], tc = st.teams[0];
    st.drivers.filter(d=>d.has).forEach((d,i)=>{
      const h = hof.get(d.id) || {name:d.name, seasons:0, starts:0, wins:0, podiums:0, poles:0, fls:0, pts:0, titles:0, player:false};
      h.name = d.name; h.seasons++; h.starts += d.starts; h.wins += d.wins; h.podiums += d.podiums; h.poles += d.poles; h.fls += d.fls; h.pts += d.pts;
      if(d.player) h.player = true;
      if(i===0 && fin && d.pts) h.titles++;
      hof.set(d.id, h);
    });
    const me = [...st.drivers.map((d,i)=>d.player && d.has ? `${esc(d.name)}: ${place(i+1, d.pts)}` : null),
                ...st.teams.map((t,i)=>t.player && t.has ? `${esc(t.name)}: ${place(i+1, t.pts)}` : null)].filter(Boolean).join('<br>');
    return `<tr><td><button class="link" data-act="openSeason" data-id="${s.id}">${s.year}</button></td><td>${s.series}</td><td class="num">${done} / ${total}</td>
      <td>${ch && ch.pts ? esc(ch.name) + ` <span class="muted">${ptsTxt(ch.pts)}${fin?'':L(', vede',', leading')}</span>` : '—'}</td>
      <td>${tc && tc.pts ? `<span class="ts" style="--tc:${tc.color}"></span>${esc(tc.name)} <span class="muted">${ptsTxt(tc.pts)}</span>` : '—'}</td>
      <td>${me || '<span class="muted">—</span>'}</td></tr>`;
  }).join('');
  const hl = [...hof.values()].sort((a,b)=>b.titles-a.titles || b.wins-a.wins || b.pts-a.pts).slice(0, 30);
  return `<div class="panel"><h2>${L('Sezóny','Seasons')}</h2><div class="scroll"><table><thead><tr><th>${L('Rok','Year')}</th><th>${L('Série','Series')}</th><th class="num">${L('Závody','Races')}</th><th>${L('Mistr světa','Champion')}</th><th>${L('Pohár konstruktérů','Constructors’ title')}</th><th>${L('Já / můj tým','Me / my team')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="panel"><h2>${L('Síň slávy kariéry','Career hall of fame')}</h2>${hl.length ? `<div class="scroll"><table><thead><tr><th>${L('Jezdec','Driver')}</th><th class="num">${L('Tituly','Titles')}</th><th class="num">${L('Sezóny','Seasons')}</th><th class="num">${L('Starty','Starts')}</th><th class="num">${L('Výhry','Wins')}</th><th class="num">${L('Pódia','Podiums')}</th><th class="num">Pole</th><th class="num">${L('NK','FL')}</th><th class="num">${L('Body celkem','Total points')}</th></tr></thead>
    <tbody>${hl.map(h=>`<tr class="${h.player?'is-player':''}"><td class="name">${esc(h.name)}</td><td class="num"><b>${h.titles}</b></td><td class="num">${h.seasons}</td><td class="num">${h.starts}</td><td class="num">${h.wins}</td><td class="num">${h.podiums}</td><td class="num">${h.poles}</td><td class="num">${h.fls}</td><td class="num">${h.pts}</td></tr>`).join('')}</tbody></table></div>`
      : `<p class="muted">${L('Statistiky se objeví po prvních zadaných závodech.','Stats appear once the first races are entered.')}</p>`}</div>`;
}

/* ---------- dialogy ---------- */
const dlg = $('#dlg'), dlgForm = $('#dlgForm');
let dlgHandler = null;
function openDialog(title, body, onOk, okLabel, extra=''){
  if(okLabel === undefined) okLabel = L('Uložit','Save');
  dlgForm.innerHTML = `<h2>${esc(title)}</h2><div class="dlg-body">${body}</div><p class="err" id="dlgErr" hidden></p>
    <div class="dlg-actions"><button type="button" class="btn ghost" data-dlg="cancel">${L('Zrušit','Cancel')}</button>${okLabel?`<button type="submit" class="btn primary" value="ok">${esc(okLabel)}</button>`:''}${extra}</div>`;
  dlgHandler = onOk; dlgForm.onchange = null;
  dlg.showModal();
  const f = dlgForm.querySelector('.dlg-body input:not([type=radio]):not([type=checkbox]), .dlg-body select, .dlg-body textarea'); if(f) f.focus();
}
function dlgError(msg){ const e = $('#dlgErr'); e.textContent = msg; e.hidden = false; return false; }
dlgForm.addEventListener('submit', e=>{
  e.preventDefault();
  const fd = new FormData(dlgForm);
  const r = dlgHandler ? dlgHandler(fd, e.submitter ? e.submitter.value : 'ok') : undefined;
  if(r !== false){ dlg.close(); persist(); render(); }
});
dlgForm.addEventListener('click', e=>{ if(e.target.closest('[data-dlg="cancel"]')) dlg.close(); const pb = e.target.closest('[data-pact]'); if(pb) penAction(pb); });

function raceCountFields(def){
  return `<fieldset><legend>${L('Počet závodů','Number of races')}</legend>
    ${[10,16,24].map(n=>`<label class="chk"><input type="radio" name="n" value="${n}"${n===def?' checked':''}> ${n}</label>`).join('')}
    <label class="chk">${L('jiný počet','other')} <input type="number" name="nCustom" min="1" max="40" style="width:70px"></label></fieldset>`;
}
function readCount(fd){ const c = parseInt(fd.get('nCustom'), 10); return c > 0 ? Math.min(c, 40) : parseInt(fd.get('n'), 10) || 24; }
function slotOptions(series){
  return GRID[series].map(([k,n,c,ds])=>`<optgroup label="${esc(n)}">${ds.map(dn=>`<option value="t-${k}|d-${slug(dn)}">${esc(n)}, ${L('místo','replacing')}: ${esc(dn)}</option>`).join('')}<option value="t-${k}|">${esc(n)}, ${L('jako další jezdec','as an extra driver')}</option></optgroup>`).join('');
}

function curSession(){ const s = getSeason(); const r = s && s.rounds.find(x=>x.id===ui.roundId); if(!r) return null; return r.s[ui.session==='sprint' && r.sprint ? 'sprint' : 'race']; }
function entry(did, create=true){
  const S = curSession(); if(!S) return null;
  let e = S.res[did];
  if(!e && create){ const d = drvOf(getSeason(), did); e = S.res[did] = {pos:null, status:'', pits:'', tyres:[], teamId: d ? d.teamId : null}; }
  if(e){ e.tyres = e.tyres || []; if(!e.teamId){ const d = drvOf(getSeason(), did); if(d) e.teamId = d.teamId; } }
  return e;
}
function cleanEntry(did){ const S = curSession(); const e = S && S.res[did]; if(e && !e.pos && !e.status && (e.pits==='' || e.pits==null) && !(e.tyres||[]).length && !(e.pens||[]).length && !e.roadPos) delete S.res[did]; }
function qEntry(did){
  const r = curRound(); if(!r || !isQ(ui.session)) return null;
  const Q = getQ(r, ui.session);
  let e = Q.res[did];
  if(!e){ const d = drvOf(getSeason(), did); e = Q.res[did] = {pos:null, q1:'', q2:'', q3:'', t1:[], t2:[], t3:[], grid:'', teamId: d ? d.teamId : null}; }
  ['t1','t2','t3'].forEach(k=>{ e[k] = e[k] || []; });
  return e;
}
function qClean(did){ const r = curRound(); const Q = r && r.q && r.q[ui.session]; if(Q && Q.res[did] && !qHas(Q.res[did])) delete Q.res[did]; }
function autoPits(e){ if(e.pitsManual) return; e.pits = e.tyres.length > 1 ? String(e.tyres.length-1) : ''; }

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled || dlg.contains(el)) return;
  const fn = ACTIONS[el.dataset.act]; if(!fn) return;
  const r = fn(el, e);
  if(r !== 'skip'){ persist(); render(); }
});

document.addEventListener('change', e=>{ if(e.target.id!=='incT') return; const red = e.target.value==='red';
  $('#incAL').textContent = red ? L('zastaveno v kole','stopped on lap') : L('od kola','from lap');
  $('#incBL').textContent = red ? L('restart v kole','restart on lap') : L('do kola','to lap'); });
document.addEventListener('toggle', e=>{ const d = e.target; if(d.classList && d.classList.contains('fa-group')){ if(d.open) ui.faOpen = d.dataset.g; else if(ui.faOpen===d.dataset.g) ui.faOpen = null; } }, true);
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-f]');
  if(!el || dlg.contains(el)) return;
  const f = el.dataset.f, s = getSeason();
  const val = el.type==='checkbox' ? el.checked : el.value;
  switch(f){
    case 'lang': ui.lang = val==='en' ? 'en' : 'cs'; break;
    case 'pos': { const S = curSession(); if(S) confirmPrefill(S); const e2 = entry(el.dataset.d); e2.pos = val ? parseInt(val,10) : null; cleanEntry(el.dataset.d); break; }
    case 'status': { const S = curSession(); if(S) confirmPrefill(S); const e2 = entry(el.dataset.d); e2.status = val; cleanEntry(el.dataset.d); break; }
    case 'weather': { const r = curRound(); if(!r) break; const T = isQ(ui.session) ? getQ(r, ui.session) : curSession(); if(T){ if(val==='dry') delete T.weather; else T.weather = val; } break; }
    case 'pits': { const e2 = entry(el.dataset.d); const n = val==='' ? '' : String(Math.max(0, Math.min(9, parseInt(val,10)||0))); e2.pits = n; e2.pitsManual = n !== ''; cleanEntry(el.dataset.d); break; }
    case 'qpos': { const r = curRound(); const e2 = qEntry(el.dataset.d); if(!e2) break; const old = e2.pos; e2.pos = val ? parseInt(val,10) : null;
      if(ui.session==='quali'){ const R = r.s.race; if(e2.pos===1) R.pole = el.dataset.d; else if(old===1 && R.pole===el.dataset.d) R.pole = null; }
      qClean(el.dataset.d); qSync(s, r, ui.session); break; }
    case 'qtime': { const e2 = qEntry(el.dataset.d); if(!e2) break; e2[el.dataset.seg] = String(val).trim(); qClean(el.dataset.d); qAutoFill(s, curRound(), ui.session); break; }
    case 'qtyre': { if(!val) return; const e2 = qEntry(el.dataset.d); if(!e2) break; if(qFmt(s, curRound())==='oneshot'){ e2[el.dataset.seg] = [val]; break; } if(e2[el.dataset.seg].length >= 6){ toast(L('Maximálně 6 sad','6 sets at most')); break; } e2[el.dataset.seg].push(val); break; }
    case 'qgrid': { const e2 = qEntry(el.dataset.d); if(!e2) break; e2.grid = val; qClean(el.dataset.d); qSync(s, curRound(), ui.session); break; }
    case 'sdist': s.dist = val; break;
    case 'sqfmt': s.qFormat = val; break;
    case 'rqfmt': { const r = curRound(); if(!r) break; if(val) r.qFormat = val; else delete r.qFormat; ['quali','squali'].forEach(k=>{ if(r.q && r.q[k]) qAutoFill(s, r, k); }); break; }
    case 'sdistlaps': { const n = parseInt(val,10); s.distLaps = n > 0 ? Math.min(200, n) : ''; break; }
    case 'rlaps': { const r = s.rounds.find(x=>x.id===ui.roundId); if(!r) break; const n = parseInt(val,10); const k = ui.session==='sprint' ? 'sLaps' : 'laps'; if(n > 0) r[k] = Math.min(200, n); else delete r[k]; break; }
    case 'mand': { const S = curSession(); if(S){ const n = parseInt(val,10); S.mand = val==='' || isNaN(n) ? '' : String(Math.max(0, Math.min(5, n))); } break; }
    case 'flTime': { const S = curSession(); if(S) S.flTime = String(val).trim(); break; }
    case 'rtrack': { const r = s.rounds.find(x=>x.id===ui.roundId); if(r) r.trackId = val || null; break; }
    case 'rsprint': { const r = s.rounds.find(x=>x.id===ui.roundId); if(r){ r.sprint = val; if(!val) ui.session = 'race'; } break; }
    case 'uisort': ui.sortByPos = val; break;
    case 'dname': { const d = drvOf(s, el.dataset.id); if(d && String(val).trim()) d.name = String(val).trim(); break; }
    case 'dteam': { const d = drvOf(s, el.dataset.id); if(d && teamFull(s, val, d.id)){ toast(fullMsg(s, val)); break; } if(d){ d.teamId = val || null;
      toast(val ? L(`${d.name} jede za ${teamOf(s,val).name}`, `${d.name} now drives for ${teamOf(s,val).name}`) : L(`${d.name} je bez angažmá`, `${d.name} is now a free agent`)); } break; }
    case 'dplayer': { const d = drvOf(s, el.dataset.id); if(d) d.player = val; break; }
    case 'tname': { const t = teamOf(s, el.dataset.id); if(t && String(val).trim()) t.name = String(val).trim(); break; }
    case 'tcolor': { const t = teamOf(s, el.dataset.id); if(t) t.color = val; break; }
    case 'tplayer': { const t = teamOf(s, el.dataset.id); if(t) t.player = val; break; }
    case 'syear': { const y = parseInt(val,10); const c = getCareer();
      if(!y) break; if(c.seasons.some(x=>x.id!==s.id && x.year===y)){ toast(L(`Sezóna ${y} už existuje`, `Season ${y} already exists`)); break; } s.year = y; break; }
    case 'sseries': s.series = val; break;
    case 'scPreset': if(val !== 'custom') s.scoring = presetScoring(val); break;
    case 'sc-race': case 'sc-sprint': { const sc = scoringOf(s); const k = f==='sc-race' ? 'race' : 'sprint'; const i = parseInt(el.dataset.i,10);
      sc[k] = [...sc[k]]; while(sc[k].length <= i) sc[k].push(0); sc[k][i] = Math.max(0, parseInt(val,10)||0);
      while(sc[k].length && !sc[k][sc[k].length-1]) sc[k].pop(); break; }
    case 'sc-pole': scoringOf(s).pole = Math.max(0, parseInt(val,10)||0); break;
    case 'sc-fl': scoringOf(s).fl = Math.max(0, parseInt(val,10)||0); break;
    case 'sc-flTop': scoringOf(s).flTop = val ? 10 : 0; break;
    case 'sc-flSprint': scoringOf(s).flSprint = val; break;
    case 'sstrat': s.showStrategy = val; break;
    default: return;
  }
  persist(); render();
});

/* ---------- záloha ---------- */
function exportData(){
  flush();
  const json = JSON.stringify(state, null, 2);
  const name = `f1-season-tracker-${L('zaloha','backup')}-${new Date().toISOString().slice(0,10)}.json`;
  if(window.desktop && window.desktop.saveBackup){
    window.desktop.saveBackup(json, name, L('Uložit zálohu','Save backup')).then(ok=>{ if(ok) toast(L('Záloha uložena','Backup saved')); });
    return;
  }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast(L('Záloha uložena do stažených souborů','Backup saved to Downloads'));
  }catch(err){
    openDialog(L('Záloha','Backup'), `<p class="hint">${L('Zkopíruj celý text a ulož si ho do souboru .json.','Copy all the text and save it as a .json file.')}</p><textarea readonly>${esc(json)}</textarea>`, null, '');
  }
}
$('#importFile').addEventListener('change', async e=>{
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  let data;
  try{ data = migrate(JSON.parse(await file.text())); if(!Array.isArray(data.careers)) throw new Error(); }
  catch{ toast(L('Soubor není platná záloha F1 Season Tracker','This file isn’t a valid F1 Season Tracker backup')); return; }
  const n = data.careers.length;
  openDialog(L('Načíst zálohu','Load backup'), `<p>${L(
      `Záloha obsahuje ${n} ${P(n,'kariéru','kariéry','kariér','','')}. Chceš je přidat k současným, nebo všechno nahradit?`,
      `The backup contains ${n} ${P(n,'','','','career','careers')}. Add them to your current ones, or replace everything?`)}</p>`,
    (fd, v)=>{
      if(v==='replace'){ const lang = ui.lang; state = data; ui.careerId = null; ui.seasonId = null; ui.lang = lang; }
      else {
        const ids = new Set(state.careers.map(c=>c.id));
        data.careers.forEach(c=>{ if(ids.has(c.id)) c.id = uid(); state.careers.push(c); });
        const tids = new Set(state.customTracks.map(t=>t.id));
        data.customTracks.forEach(t=>{ if(!tids.has(t.id)) state.customTracks.push(t); });
      }
      upgradeFreeAgents(state);
      toast(L('Záloha načtena','Backup loaded'));
    }, L('Přidat kariéry','Add careers'), `<button type="submit" class="btn danger" value="replace">${L('Nahradit vše','Replace everything')}</button>`);
});

if(upgradeFreeAgents(state)) persist();
render();
/* ---------- aktualizace ---------- */
function updBar(r){
  let bar = document.getElementById('updbar'); if(bar) bar.remove();
  if(!r || (r.type!=='content' && r.type!=='installer')) return;
  const notes = (r.notes && (r.notes[ui.lang] || r.notes.en || r.notes.cs)) || '';
  bar = document.createElement('div'); bar.id = 'updbar'; bar.className = 'updbar'; bar.setAttribute('role','status');
  bar.innerHTML = `<div class="ub-text"><b>${r.type==='content' ? L(`Nová verze ${esc(r.version)} je připravená`, `Version ${esc(r.version)} is ready`) : L(`Vyšla nová verze ${esc(r.version)}`, `Version ${esc(r.version)} is out`)}</b>
      <span>${r.type==='content' ? L('Aktualizace trvá pár sekund, tvoje kariéry zůstanou.','It only takes a few seconds, your careers stay as they are.') : L('Tahle verze potřebuje novou instalaci. Stáhni ji a nainstaluj přes tu současnou.','This version needs a new install. Download it and install it over this one.')}</span>
      ${notes ? `<small>${esc(notes)}</small>` : ''}</div>
    <div class="ub-btns"><button class="btn primary" id="ubGo">${r.type==='content' ? L('Aktualizovat','Update now') : L('Stáhnout','Download')}</button><button class="btn ghost" id="ubLater">${L('Později','Later')}</button></div>`;
  document.body.appendChild(bar);
  bar.querySelector('#ubLater').onclick = ()=>{ ui.updSkip = r.version; persist(); bar.remove(); };
  bar.querySelector('#ubGo').onclick = async ()=>{
    if(r.type==='installer'){ window.desktop.openDownload(r.url); bar.remove(); return; }
    const b = bar.querySelector('#ubGo'); b.disabled = true; b.textContent = L('Stahuji…','Downloading…');
    const res = await window.desktop.applyUpdate();
    if(!res || !res.ok){ b.disabled = false; b.textContent = L('Aktualizovat','Update now'); toast(L('Aktualizace se nepovedla, zkus to později','The update failed, try again later')); }
  };
}
async function checkUpdates(manual){
  if(!window.desktop || !window.desktop.checkUpdate){ if(manual) toast(L('Aktualizace fungují jen v nainstalované aplikaci','Updates only work in the installed app')); return; }
  const r = await window.desktop.checkUpdate();
  if(r.type==='error'){ if(manual) toast(L('Nepodařilo se zjistit, jestli je nová verze. Jsi připojený k internetu?','Couldn’t check for updates. Are you online?')); return; }
  if(r.type==='none'){ if(manual) toast(L(`Máš nejnovější verzi (${r.version})`, `You have the latest version (${r.version})`)); return; }
  if(!manual && ui.updSkip===r.version) return;
  updBar(r);
}
setTimeout(()=>checkUpdates(false), 2500);
</script>
