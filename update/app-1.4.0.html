/* ---------- barvy: světlý vzhled ---------- */
:root{
  --bg:#EDEFF3; --side:#FFFFFF; --surface:#FFFFFF; --surface2:#F4F5F8; --surface3:#E6E9EF;
  --ink:#101217; --muted:#5F6878; --line:#E3E6EC; --line-strong:#CBD0D9;
  --accent:#E10600; --accent-ink:#FFFFFF; --accent-soft:rgba(225,6,0,.09);
  --focus:#2563EB; --player:#FFF3C4; --ok:#13843A; --bad:#D92D20;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
  --p1:#FFF1A8; --p2:#E3E6EB; --p3:#FFD6A3; --pts:#D5F3DD; --nop:#DCDDFA; --ret:#EED7F8; --cell-ink:#101217;
  --gold:#F2C230; --silver:#C3C9D2; --bronze:#D58A47;
  --r-lg:14px; --r-md:10px; --r-sm:7px;
  color-scheme:light;
}
/* ---------- barvy: tmavý vzhled ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0C10; --side:#0F1217; --surface:#14171D; --surface2:#1B1F27; --surface3:#252A34;
    --ink:#ECEEF2; --muted:#8C95A5; --line:#232831; --line-strong:#333A47;
    --accent-soft:rgba(225,6,0,.16); --focus:#6EA8FE; --player:#2D2609; --ok:#3FCF73; --bad:#FF6B5E;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset;
    --p1:#665510; --p2:#454A55; --p3:#6B4219; --pts:#1C4729; --nop:#2B2E5A; --ret:#4B295C; --cell-ink:#F2F3F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0C10; --side:#0F1217; --surface:#14171D; --surface2:#1B1F27; --surface3:#252A34;
  --ink:#ECEEF2; --muted:#8C95A5; --line:#232831; --line-strong:#333A47;
  --accent-soft:rgba(225,6,0,.16); --focus:#6EA8FE; --player:#2D2609; --ok:#3FCF73; --bad:#FF6B5E;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --p1:#665510; --p2:#454A55; --p3:#6B4219; --pts:#1C4729; --nop:#2B2E5A; --ret:#4B295C; --cell-ink:#F2F3F5;
  color-scheme:dark;
}

/* ---------- základ ---------- */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Titillium Web","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--accent);color:#fff}
.kerb{height:3px;background:var(--accent)}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:calc(100vh - 3px)}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.84rem;margin:0}
.hint code{font-size:.76rem;word-break:break-all;background:var(--surface2);padding:1px 4px;border-radius:4px}
.spacer{flex:1}
[hidden]{display:none !important}

/* ---------- postranní panel ---------- */
.side{background:var(--side);border-right:1px solid var(--line);padding:20px 14px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:calc(100vh - 3px);overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px 6px}
.logo{flex:none;width:38px;height:38px;border-radius:10px}
.brand strong{display:block;font-size:1.12rem;line-height:1.05;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.8rem}
.side h2{font-size:.82rem;color:var(--muted);font-weight:600;margin:4px 8px 0}
.careers{display:flex;flex-direction:column;gap:3px}
.career-btn{position:relative;display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-radius:var(--r-md);cursor:pointer}
.career-btn:hover{background:var(--surface2)}
.career-btn[aria-current="true"]{background:var(--accent-soft)}
.career-btn[aria-current="true"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.career-btn b{display:block;font-weight:600;line-height:1.2}
.career-btn small{color:var(--muted);font-size:.8rem}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.lang{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:.88rem;padding:0 4px}
.lang select{min-width:120px}
.theme{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.88rem;padding:0 4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:.3rem .2rem;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.foot-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* ---------- tlačítka a pole ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:.42rem .9rem;border-radius:var(--r-sm);cursor:pointer;font-weight:600;line-height:1.2;white-space:nowrap;transition:background-color .12s,border-color .12s}
.btn:hover{background:var(--surface2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(225,6,0,.25)}
.btn.primary:hover{background:#C80500;border-color:#C80500}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:.24rem .6rem;font-size:.86rem}
.btn.x{padding:.24rem .5rem}
.link{background:none;border:0;padding:0;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer}
select,input[type=text],input[type=number],input:not([type]){background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:.32rem .5rem;max-width:100%;transition:border-color .12s,background-color .12s}
select:hover,input[type=text]:hover,input[type=number]:hover,input:not([type]):hover{border-color:var(--line-strong)}
select:focus,input:focus{border-color:var(--focus);background:var(--surface);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface2);cursor:pointer}
label.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
label.field{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:.9rem}

/* ---------- hlavní část ---------- */
main{padding:26px 30px 80px;min-width:0}
.career-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin-bottom:16px}
.career-head h1{position:relative;margin:0;padding-left:18px;font-size:2.2rem;line-height:1;font-weight:900;letter-spacing:-.02em}
.career-head h1::before{content:"";position:absolute;left:0;top:.08em;bottom:.08em;width:8px;background:var(--accent);transform:skewX(-14deg)}
.career-head .meta{color:var(--muted);margin:4px 0 0 18px}
.career-head .actions{margin-left:auto;display:flex;gap:4px}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:18px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.32rem .95rem;cursor:pointer;font-weight:600;transition:background-color .12s}
.pill:hover{background:var(--surface2)}
.pill[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill .tag{font-weight:400;font-size:.78rem;opacity:.7;margin-left:5px}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:4px;margin-bottom:16px;overflow-x:auto;box-shadow:var(--shadow);width:max-content;max-width:100%}
.tab{background:none;border:0;padding:.45rem 1rem;border-radius:var(--r-md);cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;transition:background-color .12s,color .12s}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab[aria-selected="true"]{color:#fff;background:var(--accent)}
.season-line{margin:0 0 16px;color:var(--muted)}
.season-line b{color:var(--ink);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h2,.panel h3{margin:0 0 12px;font-size:1.12rem;font-weight:700}
.panel .scroll{box-shadow:none}
.empty{max-width:580px;padding:70px 0}
.empty h1{position:relative;font-size:2.8rem;line-height:1;font-weight:900;letter-spacing:-.02em;margin:0 0 14px;padding-left:22px}
.empty h1::before{content:"";position:absolute;left:0;top:.06em;bottom:.06em;width:10px;background:var(--accent);transform:skewX(-14deg)}
.empty p{color:var(--muted);font-size:1.08rem;margin:0 0 22px}

/* ---------- tabulky ---------- */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
thead th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--surface);padding-top:10px;padding-bottom:8px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
tbody tr:hover td.res{filter:brightness(.97)}
td.num,th.num{text-align:right}
.stick{position:sticky;left:0;z-index:2;background:var(--surface)}
.stick2{position:sticky;left:52px;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
td.pos,th.pos{width:52px;min-width:52px;text-align:center;font-weight:700}
.pnum{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;background:var(--surface3);color:var(--ink);font-weight:700;font-size:.9rem;clip-path:polygon(16% 0,100% 0,84% 100%,0 100%)}
.pnum.t1{background:var(--gold);color:#2A2000}
.pnum.t2{background:var(--silver);color:#1C2028}
.pnum.t3{background:var(--bronze);color:#2A1504}
td.name{min-width:200px}
td.name small{display:block;color:var(--muted);font-size:.76rem;line-height:1.15;margin-left:13px}
.ts{display:inline-block;width:4px;height:1.1em;border-radius:2px;background:var(--tc);margin-right:9px;vertical-align:-3px}
tr.is-player td{background:var(--player)}
tr.is-player td.name{box-shadow:inset 3px 0 0 var(--accent),1px 0 0 var(--line);font-weight:700}
tr.is-player:hover td{background:var(--player)}
th.rh{text-align:center;padding:8px 2px 6px;min-width:44px;font-size:.76rem;line-height:1.1;color:var(--ink)}
th.rh .rn{display:block;font-size:.68rem;font-weight:400;color:var(--muted)}
th.rh.sp{box-shadow:inset 0 -3px 0 #9B30FF}
td.res{position:relative;text-align:center;padding:0 2px;min-width:44px;height:34px;color:var(--cell-ink);border-left:1px solid var(--line);font-weight:600}
td.res sup{font-size:.62em;margin-left:1px;font-weight:600;opacity:.85}
td.res.r1{background:var(--p1)} td.res.r2{background:var(--p2)} td.res.r3{background:var(--p3)}
td.res.rpts{background:var(--pts)} td.res.rnop{background:var(--nop)} td.res.rret{background:var(--ret)}
td.res.rdsq{background:#0A0C10;color:#fff} td.res.rdns{background:#FFFFFF;color:#101217}
td.res.sonly{background:var(--surface2);color:var(--ink)}
td.res.pole{font-weight:900}
td.res.fl{font-style:italic}
.flm{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:#9B30FF}
td.tot{font-weight:900;text-align:right;border-left:1px solid var(--line);min-width:62px;font-size:1.02rem}
td.tc{text-align:center;border-left:1px solid var(--line);min-width:44px}
td.tc.zero{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 4px 0;color:var(--muted);font-size:.82rem;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px}

/* ---------- závody ---------- */
.races{display:grid;grid-template-columns:240px minmax(0,1fr) 260px;grid-template-areas:"cal ed live";gap:16px;align-items:start}
.cal{grid-area:cal} .editor{grid-area:ed} .live{grid-area:live}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px;max-height:calc(100vh - 250px);overflow:auto;box-shadow:var(--shadow)}
@media (max-width:1640px){
  .races{grid-template-columns:250px minmax(0,1fr);grid-template-areas:"cal ed" "live ed"}
  .cal{max-height:44vh}
}
@media (max-width:860px){.races{grid-template-columns:1fr;grid-template-areas:"cal" "ed" "live"}}
.rd{display:flex;gap:10px;width:100%;text-align:left;align-items:center;background:none;border:0;border-radius:var(--r-md);padding:7px 9px;cursor:pointer}
.rd:hover{background:var(--surface2)}
.rd[aria-current="true"]{background:var(--ink);color:var(--bg)}
.rd[aria-current="true"] small{color:inherit;opacity:.7}
.rd-n{flex:none;width:24px;text-align:right;font-weight:900;font-size:1.05rem;color:var(--muted)}
.rd[aria-current="true"] .rd-n{color:var(--accent)}
.rd b{display:block;font-weight:600;line-height:1.2}
.rd small{display:block;color:var(--muted);font-size:.76rem;line-height:1.25}
.rd small+small{margin-top:1px}
.rd .done{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.cal-foot{padding:8px 4px 4px;border-top:1px solid var(--line);margin-top:6px}
.editor{min-width:0}
.ed-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.ed-head h2{margin:0;font-size:1.5rem;font-weight:900;letter-spacing:-.01em}
.sess{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;width:max-content;max-width:100%}
.sess .pill{border:0;border-radius:8px;padding:.32rem .9rem;background:transparent;color:var(--muted)}
.sess .pill:hover{color:var(--ink);background:var(--surface2)}
.sess .pill[aria-current="true"]{background:var(--ink);color:var(--bg)}
.ed-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
.check-ok{color:var(--ok);font-weight:600}
.check-bad{color:var(--bad);font-weight:600}
table.entry td{padding:5px 8px}
table.entry select{min-width:62px}
table.entry tr.dup td.posc select{border-color:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 30%,transparent)}
table.entry input.pits{width:58px}
.tog{min-width:36px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--r-sm);padding:.22rem .45rem;cursor:pointer;font-weight:700;font-size:.8rem;color:var(--muted)}
.tog:hover{border-color:var(--line-strong);color:var(--ink)}
.tog[aria-pressed="true"].fl{background:#9B30FF;border-color:#9B30FF;color:#fff}
.tog[aria-pressed="true"].pole{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tyres{display:flex;align-items:center;gap:3px}
.tyre{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:4px solid var(--c);background:#1A1D23;color:#fff;font-size:.68rem;font-weight:700;padding:0;cursor:pointer;line-height:1}
.tyre.static{cursor:default;width:20px;height:20px;border-width:3px;font-size:.6rem}
.tyre.add{opacity:.35;width:20px;height:20px;border-width:3px;font-size:.6rem;transition:opacity .12s}
.tyre.add:hover,.tyre.add:focus-visible{opacity:1}
.tyre-add{display:inline-flex;gap:3px;margin-left:6px;padding-left:7px;border-left:1px solid var(--line)}
.arr{color:var(--muted);font-size:.8rem}
.qseg{display:flex;align-items:center;gap:4px}
input.qt{width:96px}
input.qt::placeholder{color:var(--muted);opacity:.55}
select.tadd{width:42px;padding:.22rem .1rem;color:var(--muted)}
th.segc,td.segc{border-left:1px solid var(--line)}
td.segc.out{opacity:.32}
:root{--s1:#E8002D;--s2:#00A0E8;--s3:#FFC906}
.updbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.35);max-width:min(720px,calc(100vw - 32px))}
.updbar .ub-text{display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.updbar .ub-text small{color:var(--muted)}
.updbar .ub-btns{display:flex;gap:8px;flex:none}
img.flag{width:20px;height:15px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.28);vertical-align:-2px;margin-right:6px}
img.flag.big{width:44px;height:33px;border-radius:4px;margin:0;flex:none}
.rside{grid-area:live;display:flex;flex-direction:column;gap:16px;min-width:0}
.rside .live{grid-area:auto}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg,10px);padding:14px;box-shadow:var(--shadow,none)}
.tc-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.tc-head b{display:block;font-size:1rem;line-height:1.2}
.tc-head small{display:block;color:var(--muted);font-size:.78rem;line-height:1.25}
svg.tmap{display:block;width:100%;height:auto;max-height:250px;margin:4px 0 2px}
svg.tmap polyline{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
svg.tmap polyline.tm-bg{stroke:var(--line);stroke-width:7.5}
svg.tmap .tm-sf{fill:var(--ink)} svg.tmap .tm-dir{fill:var(--ink)}
svg.tmap .tm-c{font-size:4.2px;font-weight:800;fill:var(--muted);text-anchor:middle;dominant-baseline:central;font-family:inherit}
.tm-leg{display:flex;gap:10px;align-items:center;font-size:.74rem;font-weight:700;margin-bottom:6px;flex-wrap:wrap}
.tm-leg span[style]::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;background:var(--c);margin-right:4px;vertical-align:middle}
.tm-leg .muted{font-weight:400}
.tm-none{font-size:.84rem;margin:6px 0 8px}
.tc-facts{margin:0;display:grid;gap:6px}
.tc-facts div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.tc-facts dt{color:var(--muted);font-size:.8rem}
.tc-facts dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tc-facts dd small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.inc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.inc-list{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.inc-title{font-weight:800;margin-right:4px}
.inc-add{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.86rem}
.incchip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 4px 2px 10px;font-size:.82rem;background:var(--surface2);border:1px solid var(--line)}
.incchip.sm{padding:1px 8px;font-size:.76rem;margin:1px 0}
.incchip.sc b{color:#B88600} .incchip.vsc b{color:#B88600}
.incchip.sc{border-color:#FFC906} .incchip.vsc{border-style:dashed;border-color:#FFC906} .incchip.red{border-color:var(--bad)} .incchip.red b{color:var(--bad)}
.incchip .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 4px;font-size:.8rem}
.incsum{font-weight:700;color:#B88600}
tr.tot td{border-top:2px solid var(--line)}
@media (min-width:1641px){ .rside{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto} .rside .live{position:static;max-height:none;overflow:visible} }
td.tyc.warn .tyres{outline:2px solid var(--bad);outline-offset:3px;border-radius:6px}
.tyre-warn{color:var(--bad);font-size:.74rem;font-weight:700;display:block;margin-top:3px}
input.qt:disabled,select.tadd:disabled{opacity:.35;cursor:not-allowed}
.prefill{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:.88rem}
.prefill b{color:var(--ink)}
tr.pre select[data-f=pos]{font-style:italic;color:var(--muted)}
td.startc{color:var(--muted);font-weight:600}
.gain{font-size:.78rem}
.gain.up{color:var(--ok)} .gain.down{color:var(--bad)}
.pen{display:inline-block;background:#FFD54A;color:#3A2A00;border-radius:5px;padding:0 6px;margin-right:4px;font-size:.78rem;font-weight:700;white-space:nowrap}
td.penc{white-space:nowrap}
td.penc .muted{font-size:.8rem;margin-right:4px}
.pbtn{padding:.16rem .55rem}
input.pits.warn{border-color:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 30%,transparent)}
.pen-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pen-list li{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:var(--r-sm);padding:5px 5px 5px 9px}
.pen-list .pr{flex:1;color:var(--ink)}

/* ---------- časovací sloupec (průběžné pořadí, rošt) ---------- */
.live{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow)}
.live h3{margin:0 0 8px;font-size:1rem;font-weight:700}
.live h3+p{margin:-2px 0 8px}
.mini{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:2px}
.mini li{display:grid;grid-template-columns:34px 30px 1fr auto;gap:4px;align-items:center;padding:3px 8px 3px 0;border-radius:6px;background:var(--surface2);font-size:.88rem}
.mini .p{display:flex;justify-content:center}
.mini .p .pnum{min-width:26px;height:22px;font-size:.8rem}
.mini .d{font-size:.72rem;text-align:center}
.mini .up{color:var(--ok)} .mini .down{color:var(--bad)}
.mini .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .b{font-weight:900}
.mini li.is-player{background:var(--player)}
.mini li.is-player .n{font-weight:700}
.gridviz{list-style:none;margin:4px 0 14px;padding:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:19px;column-gap:10px}
.gridviz li{display:flex;align-items:center;gap:6px;min-width:0;margin:2px 0;padding:0 7px;border-radius:6px;border-left:4px solid var(--tc);background:var(--surface2);font-size:.84rem}
.gridviz li.is-player{background:var(--player);font-weight:700}
.gridviz .gp{flex:none;min-width:18px;text-align:right;font-weight:900}
.gridviz .gn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- soupiska ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .hint{flex-basis:100%}
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.team-block{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 12px;box-shadow:var(--shadow);overflow:hidden}
.team-block::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--tc)}
.team-block header{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.team-block header .tname{flex:1;min-width:120px;font-weight:700}
.team-block ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.team-block li{display:flex;gap:6px;align-items:center}
.team-block li .dname{flex:1;min-width:0}
.team-block li select{width:140px;flex:none}
.team-block .none{color:var(--muted);font-size:.88rem}
.team-block.free{grid-column:1 / -1}
.team-block.free::before{background:var(--line-strong)}
.badge{font-size:.75rem;font-weight:700;background:var(--accent);color:#fff;border-radius:4px;padding:1px 6px}

/* ---------- nastavení ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 18px;align-items:end}
.form-grid label:not(.chk){display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.88rem}
.form-grid label:not(.chk) input,.form-grid label:not(.chk) select{color:var(--ink)}
.track-list{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px}
.track-list li{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:var(--r-sm);padding:3px 4px 3px 10px}

/* ---------- dialogy ---------- */
.pts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:6px 0 16px}
.pts-grid label{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:.76rem;text-align:center}
.pts-grid input{width:100%;text-align:center;font-weight:700}
.sc-head{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;margin-bottom:14px}
.sc-head label:not(.chk){display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.88rem}
.panel h4{margin:6px 0 2px;font-size:.95rem;font-weight:700}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(6,8,12,.55);backdrop-filter:blur(3px)}
dialog form{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
dialog h2{margin:0;font-size:1.35rem;font-weight:700}
.dlg-body{display:flex;flex-direction:column;gap:12px}
.dlg-body label:not(.chk){display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.88rem}
.dlg-body label:not(.chk) input,.dlg-body label:not(.chk) select,.dlg-body textarea{color:var(--ink)}
.dlg-body fieldset{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px 14px;margin:0;display:flex;flex-wrap:wrap;gap:10px 16px}
.dlg-body legend{color:var(--muted);font-size:.88rem;padding:0 4px}
.dlg-body .row{display:flex;gap:10px;flex-wrap:wrap}
.dlg-body .row>label{flex:1;min-width:140px}
.dlg-body textarea{width:100%;min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.err{color:var(--bad);margin:0;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast,.btn,.tab,.pill,.tyre.add{transition:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:18px 14px 60px}
  .career-head h1{font-size:1.8rem}
}

/* ---------- vylepšení moderního vzhledu ---------- */
.career-head h1,.empty h1,.ed-head h2{font-style:italic}
.panel h2{display:flex;align-items:center;gap:10px}
.panel h2::before{content:"";flex:none;width:5px;height:.95em;background:var(--accent);transform:skewX(-14deg)}
.tabs{position:sticky;top:10px;z-index:6}
/* karta sezóny s průběhem */
.season-line{display:flex;align-items:center;gap:12px 22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 18px;box-shadow:var(--shadow)}
.season-line p{margin:0;flex:1 1 420px}
.prog{flex:0 1 280px;height:8px;border-radius:99px;background:var(--surface3);overflow:hidden}
.prog i{display:block;height:100%;min-width:8px;border-radius:inherit;background:repeating-linear-gradient(-45deg,var(--accent) 0 7px,#FF4136 7px 14px)}
/* výsledky jako dlaždice */
td.res{border-left:0;padding:3px;background-clip:content-box;border-radius:11px;height:40px;min-width:46px}
td.res{border-bottom-color:transparent;background-color:var(--surface2)}
td.res.rdsq{background:#0A0C10;background-clip:content-box}
td.res.rdns{box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px var(--line-strong)}
.flm{top:7px;right:7px}
th.rh.sp{box-shadow:none;position:relative}
th.rh.sp::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:3px;border-radius:3px;background:#9B30FF}
td.tc{border-left:0}
td.tot{border-left:1px solid var(--line);font-size:1.08rem}
td.gap{color:var(--muted);font-size:.86rem;min-width:58px;font-weight:600}
tbody tr:hover td.res{filter:none}
/* časovací sloupec s barvou týmu */
.mini li{border-left:3px solid var(--tc);border-radius:4px 7px 7px 4px}
.mini li .n .ts{display:none}
/* kariéry s iniciálami */
.career-btn{display:grid;grid-template-columns:36px 1fr;column-gap:10px;align-items:center}
.career-btn .av{grid-row:1 / span 2;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--surface3);font-weight:900;font-style:italic;font-size:.86rem;letter-spacing:.02em}
.career-btn b,.career-btn small{grid-column:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.career-btn[aria-current="true"] .av{background:var(--accent);color:#fff}
.career-btn[aria-current="true"]::before{display:none}
/* kalendář a průběžné pořadí zůstávají na očích při posouvání */
@media (min-width:1641px){
  .cal,.live{position:sticky;top:76px}
  .live{max-height:calc(100vh - 96px);overflow:auto}
}
/* dialogy */
dialog h2{position:relative;padding-left:16px;font-style:italic}
dialog h2::before{content:"";position:absolute;left:0;top:.12em;bottom:.12em;width:5px;background:var(--accent);transform:skewX(-14deg)}
.penbtn{display:inline-flex;align-items:center;gap:2px;border:1px dashed var(--line);background:transparent;border-radius:7px;padding:2px 4px 2px 3px;cursor:pointer;min-height:28px}
.penbtn:hover{border-color:var(--muted);background:var(--surface2)}
.penbtn .pen{margin-right:2px}
.penbtn .plus{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-weight:700;color:var(--muted)}
.penbtn:hover .plus{color:var(--ink)}
.pen-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 8px;font-size:1rem;font-weight:700}
.pen-head .muted{font-weight:600;font-size:.86rem}
.pen-addrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- karty první trojky a graf týmů ---------- */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.hcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:1px;min-height:118px;padding:14px 16px 12px 18px;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 26%,var(--surface)) 0%,var(--surface) 62%)}
.hcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc)}
.hcard .hp{font-size:2.5rem;line-height:.9;font-weight:900;font-style:italic;letter-spacing:-.03em;margin-bottom:6px}
.hcard.t1 .hp{color:var(--gold)} .hcard.t2 .hp{color:color-mix(in srgb,var(--silver) 70%,var(--muted))} .hcard.t3 .hp{color:var(--bronze)}
.hcard .hpts{position:absolute;right:16px;top:12px;font-size:1.7rem;font-weight:900;font-style:italic;line-height:1}
.hcard .hpts small{font-size:.8rem;font-weight:600;font-style:normal;color:var(--muted);margin-left:3px}
.hcard .hn{font-size:1.12rem;font-weight:700;line-height:1.15;display:flex;align-items:center;gap:8px}
.hcard .ht{color:var(--muted);font-size:.84rem}
.hcard .hst{margin-top:auto;padding-top:6px;color:var(--muted);font-size:.82rem;display:flex;justify-content:space-between;gap:8px}
.hcard .hst b{color:var(--ink);font-weight:700}
.hcard .you{font-size:.7rem;font-weight:700;background:var(--accent);color:#fff;border-radius:99px;padding:1px 8px}
.hcard.me{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.bars-panel{padding:14px 18px}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.bars li{display:grid;grid-template-columns:minmax(150px,220px) 1fr 52px;align-items:center;gap:12px}
.bars .bn{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bars .bn .pnum{min-width:26px;height:22px;font-size:.78rem}
.bars .bar{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.bars .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 70%,transparent),var(--tc))}
.bars b{text-align:right;font-weight:900;font-style:italic}
.bars li.is-player .bn{color:var(--accent)}
@media (max-width:640px){.bars li{grid-template-columns:1fr 52px}.bars .bar{grid-column:1 / -1;grid-row:2}}
.mandh{display:block;font-size:.72rem;font-weight:700;color:var(--accent)}
.fa-group{border-top:1px solid var(--line);padding:6px 0}
.fa-group:first-of-type{border-top:0}
.fa-group summary{cursor:pointer;font-weight:600;padding:4px 2px}
.fa-group summary .muted{font-weight:400;margin-left:4px}
.fa-group ul{margin-top:6px !important}
.team-block.free .fa-group ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:6px 14px}
</style>

</head>

function scoringOf(s){
  if(!s.scoring) s.scoring = presetScoring(s.points==='f2' ? 'f2' : (s.flPoint ? 'f1fl' : 'f1'));
  return s.scoring;
}
function scoringPreset(sc){
  const same = (a,b) => { const n = Math.max(a.length,b.length); for(let i=0;i<n;i++) if((+a[i]||0)!==(+b[i]||0)) return false; return true; };
  for(const [k,p] of Object.entries(SC_PRESETS))
    if(same(sc.race,p.race) && same(sc.sprint,p.sprint) && (+sc.pole||0)===p.pole && (+sc.fl||0)===p.fl && (!!sc.flTop)===(!!p.flTop) && (!!sc.flSprint)===p.flSprint) return k;
  return 'custom';
}

function trackInfo(t){
  if(!t) return null;
  if(TRACK_INFO[t.id]) return TRACK_INFO[t.id];
  const base = TRACK_INFO[t.id.replace(/-[rs]$/,'')];
  if(!base) return t.cc ? {cc:t.cc} : null;
  if(t.v==='rev') return {cc:base.cc, shape:base.shape, len:base.len, rev:true};
  return {cc:base.cc};
}
function flagImg(t, cls){
  const i = trackInfo(t), svg = i && FLAGS[i.cc];
  return svg ? `<img class="flag${cls?' '+cls:''}" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}" alt="" aria-hidden="true">` : '';
}
const kmTxt = m => (m/1000).toLocaleString(isEN() ? 'en-GB' : 'cs-CZ', {minimumFractionDigits:3, maximumFractionDigits:3}) + ' km';
function trackSVG(i){
  const sh = i && i.shape && TRACK_SHAPES[i.shape]; if(!sh) return '';
  let pts = sh.p.split(' ');
  const rev = !!i.rev;
  let sp = sh.s;
  if(rev){ pts = [pts[0], ...pts.slice(1).reverse()]; sp = [Math.round(pts.length/3), Math.round(pts.length*2/3)]; }
  const sec = sp && sp[0]!=null;
  const closed = [...pts, pts[0]];
  const segs = sec ? [closed.slice(0, sp[0]+1), closed.slice(sp[0], sp[1]+1), closed.slice(sp[1])] : [closed];
  const cols = sec ? ['var(--s1)','var(--s2)','var(--s3)'] : ['var(--accent)'];
  let mark = '';
  if(sh.sf){
    const st = pts[0].split(',').map(Number), nx = pts[Math.min(3, pts.length-1)].split(',').map(Number);
    const ang = Math.atan2(nx[1]-st[1], nx[0]-st[0]) * 180 / Math.PI;
    mark = `<g transform="translate(${st[0]} ${st[1]}) rotate(${ang})"><rect x="-1.3" y="-5.2" width="2.6" height="10.4" class="tm-sf"/><path d="M4 -1.9 L8 0 L4 1.9z" class="tm-dir"/></g>`;
  }
  const labels = !rev && sh.c ? sh.c.map(([x,y,l])=>`<text x="${x}" y="${y}" class="tm-c">${l}</text>`).join('') : '';
  return `<svg class="tmap" viewBox="-9 -9 ${sh.w+18} ${sh.h+18}" role="img" aria-label="${L('Obrys tratě','Track outline')}">
    <polyline points="${closed.join(' ')}" class="tm-bg"/>
    ${segs.map((g,k)=>`<polyline points="${g.join(' ')}" style="stroke:${cols[k]}"/>`).join('')}${labels}${mark}</svg>`;
}
function trackLegend(i){
  const sh = i && i.shape && TRACK_SHAPES[i.shape]; if(!sh) return '';
  return `<div class="tm-leg"><span style="--c:var(--s1)">S1</span><span style="--c:var(--s2)">S2</span><span style="--c:var(--s3)">S3</span></div>`;
}
/* nejrychlejší kolo zadané u této tratě ve všech kariérách */
function careerRecord(trackId){
  let best = null;
  for(const c of state.careers) for(const se of c.seasons) for(const r of se.rounds){
    if(r.trackId!==trackId) continue;
    const S = r.s.race; const t = parseLap(S.flTime);
    if(t==null || !isFinite(t)) continue;
    if(!best || t < best.t){ const d = S.fl ? drvOf(se, S.fl) : null; best = {t, time:S.flTime, who:d ? d.name : '', c:c.name, y:se.year}; }
  }
  return best;
}
function trackCardHTML(s, r){
  const t = trackById(r.trackId); if(!t) return '';

  const svg = trackSVG(i);

  const circ = circuitName(t);
  const rows = [
    i.len ? [L('Délka okruhu','Circuit length'), kmTxt(i.len)] : null,
    full ? [L('Celý závod','Full race distance'), lapsTxt(full)] : null,
    [L('Rekord tratě','Lap record'), i.rec ? `${esc(i.rec[0])}<small>${esc(i.rec[1])}, ${i.rec[2]}</small>` : `<span class="muted">${t.v ? L('jen pro hlavní variantu tratě','only for the main layout') : L('F1 tu nezávodila','F1 never raced here')}</span>`],
    cr ? [L('Rekord v tvých kariérách','Record in your careers'), `${esc(cr.time)}<small>${cr.who ? esc(cr.who)+', ' : ''}${esc(cr.c)} ${cr.y}</small>`] : null

  legend:L('Legendy z F1 25','F1 25 icons'), hist:L('Historičtí jezdci','Former F1 drivers'), other:L('Ostatní','Others')});
const FA_VER = 2;
function regroupFreeAgents(s){
  const map = new Map(); for(const [g, list] of Object.entries(FREE_AGENTS)) for(const n of list) map.set(slug(n), g);
  s.drivers.forEach(d=>{ if(d.player) return; const g = map.get(slug(d.name)); if(g && d.fa !== g && (d.fa || !d.teamId)) d.fa = g; });
}
/* starší kariéry F1: doplní nové volné jezdce a přeřadí stávající do správných skupin */
function upgradeFreeAgents(st){
  let changed = false;
  st.careers.forEach(c=>c.seasons.forEach(se=>{
    if(se.series==='F1' && (se.faV||0) < FA_VER){ addFreeAgents(se); regroupFreeAgents(se); se.faV = FA_VER; changed = true; }
  }));
  return changed;
}
function addFreeAgents(s){
  let n = 0; const have = new Set(s.drivers.map(d=>d.id)), names = new Set(s.drivers.map(d=>slug(d.name)));
  for(const [g, list] of Object.entries(FREE_AGENTS)) for(const name of list){
    const id = 'd-'+slug(name); if(have.has(id) || names.has(slug(name))) continue;
    s.drivers.push({id, name, teamId:null, player:false, fa:g}); have.add(id); n++; }
  return n;
}
function baseLineup(series){
  const teams = [], drivers = [];
  GRID[series].forEach(([k,n,c,ds])=>{
    const tid = 't-' + k;
    teams.push({id:tid, name:n, color:c, player:false});
    ds.forEach(dn => drivers.push({id:'d-'+slug(dn), name:dn, teamId:tid, player:false}));
  });
  if(series === 'F1') addFreeAgents({drivers});
  return {teams, drivers};
}
function newRound(trackId, sprint){

    s:{race:{res:{}, fl:null, flTime:'', pole:null}, sprint:{res:{}, fl:null, flTime:''}}};
}
function sample(arr, n){
  if(n <= 0) return [];
  if(n >= arr.length) return [...arr.map(x=>({...x})), ...Array.from({length:n-arr.length}, ()=>({trackId:null, sprint:false}))];
  if(n === 1) return [{...arr[0]}];
  const out = [];
  for(let i=0;i<n;i++) out.push({...arr[Math.round(i*(arr.length-1)/(n-1))]});
  return out;
}
function lastSeason(c){ return [...c.seasons].sort((a,b)=>a.year-b.year).pop() || null; }
function createSeason(c, o){
  const prev = lastSeason(c);
  const series = o.series || (prev ? prev.series : c.series);
  let teams, drivers;
  if(o.lineup === 'copy' && prev && prev.series === series){
    teams = clone(prev.teams); drivers = clone(prev.drivers);
  } else {
    ({teams, drivers} = baseLineup(series));
    if(prev && prev.series === series){
      prev.teams.filter(t=>t.player).forEach(t=>{ if(!teams.some(x=>x.id===t.id)) teams.push(clone(t)); });
      const pTeams = new Set(prev.teams.filter(t=>t.player).map(t=>t.id));
      prev.drivers.filter(d=>d.player || pTeams.has(d.teamId)).forEach(d=>{
        const ex = drivers.find(x=>x.id===d.id);
        if(ex) ex.teamId = d.teamId; else drivers.push(clone(d));
      });
    }
  }
  let cal;
  if(o.calendar === 'copy' && prev && prev.rounds.length) cal = sample(prev.rounds.map(r=>({trackId:r.trackId, sprint:r.sprint})), o.n);
  else if(o.calendar === 'empty') cal = Array.from({length:o.n}, ()=>({trackId:null, sprint:false}));
  else cal = sample(CAL2026.map(t=>({trackId:t, sprint:SPRINT2026.has(t)})), o.n);
  if(series === 'F2') cal.forEach(x=>x.sprint = true);
  if(series === 'F1'){ const tmp = {drivers}; addFreeAgents(tmp); regroupFreeAgents(tmp); }
  const s = {id:uid(), year:o.year, series, points: series==='F2' ? 'f2' : 'f1', flPoint:false,
    scoring: prev && prev.series===series ? clone(scoringOf(prev)) : presetScoring(series==='F2' ? 'f2' : 'f1'),
    dist: prev ? (prev.dist || '25') : '25', distLaps: prev ? (prev.distLaps || '') : '',
    showStrategy: prev ? prev.showStrategy !== false : true, teams, drivers, rounds: cal.map(x=>newRound(x.trackId, x.sprint)), faV: FA_VER};
  c.seasons.push(s);

}

/* ---------- body a pořadí ---------- */
function sessPts(season, type, e, isFL, isPole){
  const sc = scoringOf(season);
  let p = 0;
  if(e && e.pos && !e.status){
    const tbl = type==='race' ? sc.race : sc.sprint;
    p += +tbl[e.pos-1] || 0;
    if(isFL && +sc.fl && (type==='race' || sc.flSprint) && (!sc.flTop || e.pos <= sc.flTop)) p += +sc.fl;
  }
  if(isPole && type==='race' && +sc.pole) p += +sc.pole;
  return p;
}
function cbCmp(a,b){ for(let k=1;k<a.length;k++){ if(a[k]!==b[k]) return b[k]-a[k]; } return 0; }
function compute(season, upto=Infinity){
  const D = new Map(), T = new Map();
  const tIdx = new Map(season.teams.map((t,i)=>[t.id,i]));
  season.drivers.forEach(d=>D.set(d.id, {id:d.id, name:d.name, teamId:d.teamId, player:!!d.player, pts:0, cells:[], cb:new Array(41).fill(0),
    wins:0, podiums:0, poles:0, fls:0, dnfs:0, starts:0, finSum:0, finN:0, best:null, has:false}));
  season.teams.forEach(t=>T.set(t.id, {id:t.id, name:t.name, color:t.color, player:!!t.player, pts:0, cells:[], cb:new Array(41).fill(0), has:false}));
  season.rounds.forEach((r,i)=>{
    if(i > upto) return;
    for(const type of ['race','sprint']){
      if(type==='sprint' && !r.sprint) continue;
      const S = r.s[type];
      for(const [did, e] of Object.entries(S.res)){
        if(!hasRes(e)) continue;
        const d = D.get(did); if(!d) continue;
        const isFL = S.fl === did, isPole = type==='race' && S.pole === did;
        const p = sessPts(season, type, e, isFL, isPole) + penPts(e);
        const c = d.cells[i] || (d.cells[i] = {pts:0});
        c.pts += p; d.pts += p; d.has = true;
        if(type==='race'){
          c.pos = e.pos; c.status = e.status; c.fl = isFL; c.pole = isPole;
          if(e.status !== 'DNS') d.starts++;
          if(!e.status && e.pos){
            d.finSum += e.pos; d.finN++; if(e.pos <= 40) d.cb[e.pos]++;
            if(e.pos===1) d.wins++; if(e.pos<=3) d.podiums++;
            if(d.best===null || e.pos < d.best) d.best = e.pos;
          }
          if(e.status==='DNF') d.dnfs++;
          if(isFL) d.fls++; if(isPole) d.poles++;
        } else { c.spos = e.pos; c.sstatus = e.status; }
        const t = T.get(e.teamId) || T.get(d.teamId);
        if(t){
          t.pts += p; t.has = true;
          const tc = t.cells[i] || (t.cells[i] = {pts:0});
          tc.pts += p;
          if(type==='race' && !e.status && e.pos && e.pos <= 40) t.cb[e.pos]++;
        }
      }
    }
  });
  const drivers = [...D.values()].filter(d=>d.teamId || d.has)
    .sort((a,b)=>b.pts-a.pts || cbCmp(a.cb,b.cb) || a.name.localeCompare(b.name,'cs'));
  const teams = [...T.values()].sort((a,b)=>b.pts-a.pts || cbCmp(a.cb,b.cb) || tIdx.get(a.id)-tIdx.get(b.id));
  return {drivers, teams};
}

function seasonLine(s){
  const done = s.rounds.filter(roundHasData).length, n = s.rounds.length;
  let txt = L(`Sezóna <b>${s.year}</b> (${s.series}), zadáno <b>${done} z ${n}</b> ${P(n,'závodu','závodů','závodů','','')}.`,
              `Season <b>${s.year}</b> (${s.series}), <b>${done} of ${n}</b> ${P(n,'','','','race','races')} entered.`);
  if(done){
    const st = compute(s); const a = st.drivers[0], b = st.drivers[1];
    const fin = done === n;
    if(a && a.pts){
      const gap = b ? a.pts - b.pts : 0;
      if(fin) txt += L(` Mistr: <b>${esc(a.name)}</b> (${ptsTxt(a.pts)})`, ` Champion: <b>${esc(a.name)}</b> (${ptsTxt(a.pts)})`);
      else txt += L(` Vede <b>${esc(a.name)}</b> (${ptsTxt(a.pts)})`, ` Leader: <b>${esc(a.name)}</b> (${ptsTxt(a.pts)})`);
      if(b) txt += fin ? L(`, druhý ${esc(b.name)} o ${ptsTxt(gap)} méně.`, `, runner-up ${esc(b.name)} ${ptsTxt(gap)} behind.`)
                       : L(`, druhý ${esc(b.name)} ztrácí ${ptsTxt(gap)}`, `, ${esc(b.name)} is ${ptsTxt(gap)} behind.`);
      else txt += '.';
    }
  }
  const pct = n ? Math.round(done/n*100) : 0;
  return `<div class="season-line"><p>${txt}</p><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${done}" aria-label="${L('Odjeté závody','Races completed')}"><i style="width:${pct}%"></i></div></div>`;
}

function headCells(s){
  return s.rounds.map((r,i)=>{ const t = trackById(r.trackId);
    const title = `${L(`${i+1}. závod`, `Round ${i+1}`)}: ${t ? fullTrackName(t) : L('trať nevybrána','no track')}${r.sprint ? L(' (se sprintem)',' (sprint weekend)') : ''}`;
    return `<th class="rh${r.sprint?' sp':''}" title="${esc(title)}"><span class="rn">${i+1}</span>${esc(t?t.code:'—')}</th>`; }).join('');

function cellHTML(c){
  if(!c || (!c.pos && !c.status && !c.spos && !c.sstatus)) return '<td class="res"></td>';
  let cls = 'res', txt = '';
  if(c.status==='DNF'){ cls += ' rret'; txt = 'Ret'; }
  else if(c.status==='DSQ'){ cls += ' rdsq'; txt = 'DSQ'; }
  else if(c.status==='DNS'){ cls += ' rdns'; txt = 'DNS'; }
  else if(c.pos){ txt = c.pos; cls += c.pos===1?' r1':c.pos===2?' r2':c.pos===3?' r3':c.pos<=10?' rpts':' rnop'; }
  else cls += ' sonly';
  if(c.fl) cls += ' fl';
  if(c.pole) cls += ' pole';
  const sup = c.spos && !c.sstatus ? `<sup>${c.spos}</sup>` : (c.sstatus ? `<sup>${c.sstatus==='DNF'?'Ret':c.sstatus}</sup>` : '');
  return `<td class="${cls}" title="${c.pts} ${P(c.pts,'bod','body','bodů','point','points')}">${txt}${sup}${c.fl?'<i class="flm"></i>':''}</td>`;
}
function noRounds(){

function driversHero(s, st){
  const ds = st.drivers.filter(d=>d.has);
  if(!ds.length || !ds[0].pts) return '';
  const card = (d, i, me) => { const t = teamOf(s, d.teamId);
    const stats = [d.wins ? `${d.wins} ${P(d.wins,'výhra','výhry','výher','win','wins')}` : '', d.podiums ? `${d.podiums} ${P(d.podiums,'pódium','pódia','pódií','podium','podiums')}` : '', d.poles ? `${d.poles} pole` : ''].filter(Boolean).join(', ');
    const gap = i ? ds[0].pts - d.pts : 0;
    return `<div class="hcard${i<3?' top t'+(i+1):''}${d.player?' me':''}" style="--tc:${t?t.color:'var(--line-strong)'}">
      <span class="hp">${i+1}</span>
      <span class="hpts">${d.pts}<small>${L('b.','pts')}</small></span>
      <span class="hn">${esc(d.name)}${me ? `<span class="you">${L('ty','you')}</span>` : ''}</span>
      <span class="ht">${esc(t?t.name:L('bez angažmá','free agent'))}</span>
      <span class="hst">${stats || '&nbsp;'}${gap ? `<b>−${gap}</b>` : ''}</span></div>`; };
  let html = ds.slice(0,3).map((d,i)=>card(d,i,d.player)).join('');
  const mi = ds.findIndex(d=>d.player);
  if(mi > 2) html += card(ds[mi], mi, true);
  return `<div class="hero">${html}</div>`;
}
function teamsBars(st){

function entryDrivers(s, S){
  const ids = new Set(Object.keys(S.res).filter(id=>hasRes(S.res[id]) || (S.res[id].tyres||[]).length || S.res[id].pits!==''));
  const list = s.drivers.filter(d=>d.teamId || ids.has(d.id));
  const ti = new Map(s.teams.map((t,i)=>[t.id,i]));
  return list.map((d,i)=>({d, i})).sort((a,b)=>{
    const ta = ti.has(a.d.teamId) ? ti.get(a.d.teamId) : 999, tb = ti.has(b.d.teamId) ? ti.get(b.d.teamId) : 999;
    return ta-tb || a.i-b.i;
  }).map(x=>x.d);
}
function tyreChip(c){ const t = TYRES[c]; return t ? `<span class="tyre static" style="--c:${t.color}" title="${esc(tyreName(c))}">${c}</span>` : ''; }
function stratHTML(e){

function viewRaces(s){

    const t = trackById(r.trackId); const done = roundHasData(r);

    else sub = roundHasQ(r) ? L('kvalifikace zadána','qualifying entered') : L('nezadáno','not entered');

  ['adv','Získání výhody mimo trať','Leaving the track and gaining an advantage'],

  ['yellow','Předjíždění pod žlutou vlajkou','Overtaking under yellow flags'],
  ['start','Chybné postavení na startu / předčasný start','Wrong grid position / false start'],

  ['impede','Blokování v kvalifikaci','Impeding in qualifying'],

  ['red','Nerespektování červené vlajky','Red flag infringement'],

  ['parc','Úprava vozu v parc fermé','Parc fermé infringement'],
  ['speed','Překročení rychlosti v boxech','Speeding in the pit lane'],
  ['limits','Překročení limitů trati','Track limits']
];
const RACE_PTYPES = () => [['time',L('Časová penalizace','Time penalty')],['dt',L('Průjezd boxovou uličkou','Drive-through')],['sg',L('Stop & Go','Stop & Go')],
  ['points',L('Úprava bodů','Points adjustment')],['warn',L('Napomenutí','Reprimand')]];
const GRID_PTYPES = () => [['places',L('Posun o místa dozadu','Grid places drop')],['back',L('Start z konce roštu','Back of the grid')],
  ['pitlane',L('Start z boxové uličky','Pit lane start')],['time',L('Časová penalizace do závodu','Time penalty for the race')]];

function reasonText(p, list){
  if(p.reason==='other') return p.text || '';
  const x = list.find(r=>r[0]===p.reason); return x ? L(x[1], x[2]) : (p.text || '');
}
function penShort(p){
  switch(p.type){
    case 'time': return `+${p.sec||0} s`;
    case 'dt': return L('průjezd','drive-through');
    case 'sg': return `Stop & Go${p.sec ? ' '+p.sec+' s' : ''}`;
    case 'points': { const n = +p.pts||0; return `${n>0?'+':'−'}${Math.abs(n)} ${L('b.','pts')}`; }
    case 'warn': return L('napomenutí','reprimand');
    case 'places': { const n = +p.places||0; return `+${n} ${P(n,'místo','místa','míst','place','places')}`; }
    case 'back': return L('konec roštu','back of grid');
    case 'pitlane': return L('z boxů','pit lane');
  }
  return '';
}
const penPts = e => (e && e.pens || []).filter(p=>p.type==='points').reduce((a,p)=>a+(+p.pts||0), 0);
function penChips(list, reasons){
  return (list||[]).map(p=>`<span class="pen" title="${esc(reasonText(p, reasons))}">${esc(penShort(p))}</span>`).join('');
}

let penDraft = null;
function penListHTML(isGrid){
  const reasons = isGrid ? GRID_REASONS : RACE_REASONS;
  if(!penDraft.length) return `<p class="muted" style="margin:0">${L('Zatím bez penalizace. Přidej jich níž kolik potřebuješ.','No penalties yet. Add as many as you need below.')}</p>`;

  const pts = penDraft.filter(p=>p.type==='points').reduce((a,p)=>a+(+p.pts||0),0);
  const places = penDraft.filter(p=>p.type==='places').reduce((a,p)=>a+(+p.places||0),0);
  const tot = [sec ? `+${sec} s` : '', places ? penShort({type:'places', places}) : '', pts ? penShort({type:'points', pts}) : ''].filter(Boolean).join(', ');
  return `<h3 class="pen-head">${L('Udělené penalizace','Penalties given')} (${penDraft.length})${tot && penDraft.length>1 ? `<span class="muted">${L('celkem','total')} ${esc(tot)}</span>` : ''}</h3><ul class="pen-list">${penDraft.map((p,k)=>`<li><span class="pen">${esc(penShort(p))}</span><span class="pr">${esc(reasonText(p, reasons)) || '<span class="muted">'+L('bez důvodu','no reason')+'</span>'}</span>
    <button type="button" class="btn sm ghost danger x" data-pact="del" data-k="${k}" aria-label="${L('Odebrat penalizaci','Remove penalty')}">✕</button></li>`).join('')}</ul>`;
}
function penDialog(did, isGrid){
  const s = getSeason(), r = curRound(); const d = drvOf(s, did); if(!r || !d) return;
  const e = isGrid ? qEntry(did) : entry(did); if(!e) return;
  penDraft = clone(isGrid ? (e.gpens||[]) : (e.pens||[]));

/* ---------- části víkendu ---------- */
function sessionsFor(s, r){
  if(s.series==='F2') return r.sprint ? ['quali','sprint','race'] : ['quali','race'];
  return r.sprint ? ['squali','sprint','quali','race'] : ['quali','race'];
}
function sessLabel(s, k){
  return {squali:L('Sprintová kvalifikace','Sprint Qualifying'), sprint:'Sprint', quali:L('Kvalifikace','Qualifying'),
    race: s.series==='F2' ? L('Hlavní závod','Feature race') : L('Závod','Race')}[k];
}
function curType(s, r){ if(!sessionsFor(s, r).includes(ui.session)) ui.session = 'race'; return ui.session; }
const isQ = k => k==='quali' || k==='squali';
const curRound = () => { const s = getSeason(); return s ? s.rounds.find(x=>x.id===ui.roundId) || null : null; };
/* formát kvalifikace: full = Q1/Q2/Q3, short = jedna část, oneshot = jedno kolo */
const QFMTS = () => [['full',L('Plná (Q1, Q2, Q3)','Full (Q1, Q2, Q3)')],['short',L('Krátká (jedna část)','Short (one session)')],['oneshot',L('One-shot (jedno kolo)','One-shot (one lap)')]];
const qFmtName = f => (QFMTS().find(x=>x[0]===f)||[])[1] || '';
function seasonQFmt(s){ const f = s.qFormat || (s.series==='F2' ? 'short' : 'full'); return s.series==='F2' && f==='full' ? 'short' : f; }
function qFmt(s, r){ const f = (r && r.qFormat) || seasonQFmt(s); return s.series==='F2' && f==='full' ? 'short' : f; }
function qSegs(s, kind, r){
  const f = qFmt(s, r), p = kind==='squali' ? 'SQ' : 'Q';
  if(f==='oneshot') return [['q1', L('Jedno kolo','One lap')]];
  if(f==='short') return [['q1', kind==='squali' ? L('Sprintová kvalifikace','Sprint qualifying') : L('Kvalifikace','Qualifying')]];
  return [['q1',p+'1'],['q2',p+'2'],['q3',p+'3']];
}
function getQ(r, kind){ r.q = r.q || {}; return r.q[kind] || (r.q[kind] = {res:{}}); }
const qBest = e => e ? (e.q3 || e.q2 || e.q1 || '') : '';
/* čas kola "1:29.456" / "89.456" / "1:29,456" -> sekundy; prázdné -> null; jiný text (bez času, DNF…) -> Infinity */
function parseLap(v){
  v = String(v||'').trim(); if(!v) return null;
  const m = v.replace(',', '.').match(/^(?:(\d+):)?(\d{1,2}(?:\.\d+)?)$/);
  return m ? (+(m[1]||0))*60 + (+m[2]) : Infinity;
}
const WEATHER = () => [['dry',L('☀️ Sucho','☀️ Dry')],['mixed',L('🌦️ Proměnlivé','🌦️ Mixed')],['wet',L('🌧️ Déšť','🌧️ Wet')]];
function weatherSel(cur){ return `<label class="field">${L('Počasí','Weather')} <select data-f="weather" data-focus="weather">${WEATHER().map(([v,t])=>`<option value="${v}"${(cur||'dry')===v?' selected':''}>${t}</option>`).join('')}</select></label>`; }
/* vyřazení v Q1/Q2 a pořadí podle zadaných časů */
function qAnalysis(s, Q, list, multi){
  const res = Q.res || {}, N = list.length, f1 = !!multi;
  const n2 = f1 ? (N > 10 ? 10 + Math.ceil((N-10)/2) : N) : N, n3 = Math.min(10, n2);
  const t = (id, k) => parseLap((res[id]||{})[k]);
  const has = (id, k) => t(id, k) !== null;
  const rank = (ids, k) => [...ids].sort((a,b)=>t(a,k)-t(b,k));
  const out = {out2:new Set(), out3:new Set(), pos:new Map(), prov:new Map(), done1:false, done2:false, done3:false, n2, n3};
  const ids = list.map(d=>d.id);
  if(!N || !ids.every(id=>has(id,'q1'))) return out;
  out.done1 = true;
  const r1 = rank(ids, 'q1');
  if(!f1){ r1.forEach((id,i)=>out.pos.set(id, i+1)); return out; }
  r1.slice(n2).forEach((id,i)=>{ out.out2.add(id); out.out3.add(id); out.pos.set(id, n2+1+i); });
  const in2 = r1.slice(0, n2);
  in2.forEach((id,i)=>out.prov.set(id, i+1));
  if(!in2.every(id=>has(id,'q2'))) return out;
  out.done2 = true;
  const r2 = rank(in2, 'q2');
  r2.slice(n3).forEach((id,i)=>{ out.out3.add(id); out.pos.set(id, n3+1+i); });
  const in3 = r2.slice(0, n3);
  in3.forEach((id,i)=>out.prov.set(id, i+1));
  if(!in3.every(id=>has(id,'q3'))) return out;
  out.done3 = true;
  rank(in3, 'q3').forEach((id,i)=>out.pos.set(id, i+1));
  return out;
}
/* po zadání času: doplní pozice z časů, pole position a předvyplní závod podle roštu */
function qAutoFill(s, r, kind){
  const Q = r.q && r.q[kind]; if(!Q) return;
  const list = entryDrivers(s, Q);
  const a = qAnalysis(s, Q, list, qSegs(s, kind, r).length > 1);
  for(const [id,pos] of a.pos){
    let e = Q.res[id];
    if(!e){ const d = drvOf(s, id); e = Q.res[id] = {pos:null, q1:'', q2:'', q3:'', t1:[], t2:[], t3:[], grid:'', teamId: d ? d.teamId : null}; }
    e.pos = pos;
  }
  qSync(s, r, kind);
}
function qSync(s, r, kind){
  const Q = r.q && r.q[kind]; if(!Q) return;
  if(kind==='quali'){ const p1 = Object.entries(Q.res).find(([,e])=>e.pos===1); if(p1) r.s.race.pole = p1[0]; }
  const types = s.series==='F2' ? ['race', ...(r.sprint ? ['sprint'] : [])] : [kind==='squali' ? 'sprint' : 'race'];
  types.forEach(type=>prefillRace(s, r, type, Q));
}
/* předvyplní pořadí závodu podle startovního roštu, dokud závod není zadaný */
function prefillRace(s, r, type, Q){
  if(type==='sprint' && !r.sprint) return;
  const S = r.s[type];
  if(Object.values(S.res).some(hasRes)) return;
  const list = entryDrivers(s, Q);
  if(!list.length || !list.every(d=>(Q.res[d.id]||{}).pos)) return;
  const gm = gridFor(s, r, type);
  const order = list.map(d=>({id:d.id, g:gm.get(d.id), q:Q.res[d.id].pos}))
    .sort((a,b)=>((a.g==='PL'||a.g==null) ? 500 + a.q : a.g) - ((b.g==='PL'||b.g==null) ? 500 + b.q : b.g));
  order.forEach((o,i)=>{
    const d = drvOf(s, o.id);
    const e = S.res[o.id] || (S.res[o.id] = {pos:null, status:'', pits:'', tyres:[], teamId: d ? d.teamId : null});
    e.pos = i+1; e.pre = true;
  });
}
function confirmPrefill(S){ Object.values(S.res).forEach(e=>{ delete e.pre; }); }
const isPre = S => Object.values(S.res).some(e=>e.pre);
function compoundIssue(s, type, S, e){
  if(type!=='race' || (S.weather||'dry')==='wet') return false;
  if(!e || !e.pos || e.status || !(e.tyres||[]).length) return false;
  if(e.tyres.some(c=>c==='I' || c==='W')) return false;
  return new Set(e.tyres.filter(c=>'SMH'.includes(c))).size < 2;
}
const qHas = e => !!(e && (e.pos || e.q1 || e.q2 || e.q3 || (e.gpens||[]).length || (e.t1||[]).length || (e.t2||[]).length || (e.t3||[]).length || (e.grid!=null && e.grid!=='')));
const roundHasQ = r => !!(r.q && Object.values(r.q).some(Q=>Object.values(Q.res||{}).some(qHas)));
/* startovní rošt závodu (type 'race') nebo sprintu (type 'sprint'): Map jezdec -> pozice nebo 'PL' */
function gridFor(s, r, type){
  const m = new Map();
  const f2 = s.series==='F2';
  const kind = type==='sprint' && !f2 ? 'squali' : 'quali';
  const Q = r.q && r.q[kind]; if(!Q) return m;
  const rev = type==='sprint' && f2;
  const fixed = new Set(), auto = [];
  const allPos = rev || entryDrivers(s, Q).every(d=>(Q.res[d.id]||{}).pos);
  for(const [id,e] of Object.entries(Q.res)){
    if(rev){ if(e.pos) m.set(id, e.pos<=10 ? 11-e.pos : e.pos); continue; }
    if(e.grid==='PL'){ m.set(id,'PL'); continue; }
    if(e.grid!=null && e.grid!==''){ m.set(id, +e.grid); fixed.add(+e.grid); continue; }
    if(!e.pos) continue;
    const gp = e.gpens || [];
    if(gp.some(p=>p.type==='pitlane')){ m.set(id,'PL'); continue; }
    const places = gp.filter(p=>p.type==='places').reduce((a,p)=>a+(+p.places||0), 0);
    let key = e.pos;
    if(gp.some(p=>p.type==='back')) key = 1000 + e.pos;
    else if(places) key = e.pos + places + 0.5;
    auto.push({id, key});
  }
  if(!allPos){ auto.forEach(a=>m.set(a.id, Q.res[a.id].pos)); return m; }
  auto.sort((a,b)=>a.key-b.key);
  let slot = 1;
  for(const a of auto){ while(fixed.has(slot)) slot++; m.set(a.id, slot); slot++; }
  return m;
}
const shortName = n => { const p = String(n).split(' '); return p.length>1 && /^jr\.?$/i.test(p[p.length-1]) ? p.slice(-2).join(' ') : p[p.length-1]; };

function dupCheck(list, getE, has){
  const counts = {}; list.forEach(d=>{ const e = getE(d.id); if(e && e.pos) counts[e.pos] = (counts[e.pos]||0)+1; });
  const dups = Object.keys(counts).filter(k=>counts[k]>1).map(Number).sort((a,b)=>a-b);
  const entered = list.filter(d=>has(getE(d.id))).length, N = list.length;
  let check;
  if(dups.length) check = `<span class="check-bad">${L(`Pozice ${dups.join(', ')} ${dups.length>1?'jsou':'je'} zadaná víckrát`, `Position${dups.length>1?'s':''} ${dups.join(', ')} entered more than once`)}</span>`;
  else if(entered===N && N) check = `<span class="check-ok">${L(`Všech ${N} jezdců zadáno`, `All ${N} drivers entered`)}</span>`;
  else check = `<span class="muted">${L(`Zadáno ${entered} z ${N}`, `${entered} of ${N} entered`)}</span>`;
  return {counts, check};
}
function posOptions(N, cur){

  for(let p=1;p<=Math.max(N, cur||0);p++) o += `<option value="${p}"${cur===p?' selected':''}>${p}</option>`;

}

function raceBody(s, r, type){
  const S = r.s[type];

    const gk = d => { const g = gm.get(d.id); return g==null ? (prov.get(d.id)||0)/1000 : g==='PL' ? 800 : +g; };

      <td class="posc"><select data-f="pos" data-d="${d.id}" data-focus="pos-${d.id}" aria-label="${L('Pozice','Position')}: ${esc(d.name)}">${posOptions(N, e.pos)}</select></td>

      <td class="num"><b>${pts}</b></td>
      <td class="penc">${e.roadPos && e.pos && e.roadPos!==e.pos ? `<span class="muted" title="${L('Pozice na trati','Position on the road')}">P${e.roadPos}→P${e.pos}</span>` : ''}<button class="penbtn" data-act="penRace" data-d="${d.id}" data-focus="pr-${d.id}" title="${(e.pens||[]).length ? L('Upravit nebo přidat další penalizaci','Edit or add another penalty') : L('Přidat penalizaci','Add a penalty')}" aria-label="${L('Penalizace','Penalties')}: ${esc(d.name)}">${penChips(e.pens, RACE_REASONS)}<span class="plus">+</span></button></td>
      <td><button class="tog fl" data-act="setFL" data-id="${d.id}" data-focus="fl-${d.id}" aria-pressed="${isFL}" title="${L('Nejrychlejší kolo','Fastest lap')}">${L('NK','FL')}</button></td>
      ${type==='race' ? `<td><button class="tog pole" data-act="setPole" data-id="${d.id}" data-focus="pl-${d.id}" aria-pressed="${isPole}" title="Pole position">P</button></td>` : ''}
      ${strat ? `<td><input type="number" class="pits${mand && e.pits!=='' && e.pits!=null && !e.status && +e.pits < mand ? ' warn' : ''}" title="${mand && e.pits!=='' && e.pits!=null && +e.pits < mand ? L(`Méně pit stopů, než je povinné (${mand})`,`Fewer pit stops than mandatory (${mand})`) : ''}" min="0" max="9" data-f="pits" data-d="${d.id}" data-focus="pi-${d.id}" value="${esc(e.pits??'')}" aria-label="${L('Pit stopy','Pit stops')}: ${esc(d.name)}"></td>
      <td class="tyc${cIssue?' warn':''}"${cIssue ? ` title="${L('Na suchu musí jezdec v závodě použít alespoň dvě různé směsi (S, M, H)','In a dry race a driver must use at least two different compounds (S, M, H)')}"` : ''}><span class="tyres">${ty}<span class="tyre-add">${add}</span></span>${cIssue ? `<span class="tyre-warn">${L('jen jedna směs','only one compound')}</span>` : ''}</td>` : ''}
    </tr>`;
  }).join('');
  const al = autoLaps(s, r, type), ov = lapsOverride(r, type);
  const lapsHint = L(`Automaticky podle délky závodu (${distLabel(s)}) a tratě${fullLaps(trackById(r.trackId)) ? ` (celý závod ${fullLaps(trackById(r.trackId))} kol)` : ''}. Přepiš, pokud jsi jel jinak.`,
    `Automatic from the race distance (${distLabel(s)}) and the track${fullLaps(trackById(r.trackId)) ? ` (full race ${fullLaps(trackById(r.trackId))} laps)` : ''}. Overwrite it if you raced a different length.`);
  return `<div class="ed-meta">
      <label class="field" title="${esc(lapsHint)}">${type==='sprint' ? L('Počet kol sprintu','Sprint laps') : L('Počet kol','Laps')} <input type="number" min="1" max="200" data-f="rlaps" data-focus="rlaps" value="${esc(ov??'')}" placeholder="${al??''}" style="width:70px">${ov ? '' : (al ? `<span class="muted">${L('auto','auto')}</span>` : `<span class="muted">${L('zadej ručně','enter manually')}</span>`)}</label>
      <label class="field">${L('Čas nejrychlejšího kola','Fastest lap time')} <input type="text" data-f="flTime" data-focus="flTime" value="${esc(S.flTime||'')}" placeholder="1:29.456" style="width:110px"></label>
      ${weatherSel(S.weather)}
      ${strat ? `<label class="field" title="${L('Kolik pit stopů musí každý jezdec v tomto závodě povinně absolvovat','How many pit stops every driver must make in this race')}">${L('Povinné pit stopy v závodě','Mandatory pit stops in this race')} <input type="number" min="0" max="5" data-f="mand" data-focus="mand" value="${esc(S.mand??'')}" style="width:60px"></label>` : ''}
      ${pre ? '' : check}
      ${badC ? `<span class="check-bad">${L(`Povinnou výměnu směsí nesplnil${badC>1?'o':''} ${badC} ${P(badC,'jezdec','jezdci','jezdců','','')}`, `${badC} ${badC>1?'drivers':'driver'} didn't use two compounds`)}</span>` : ''}
      ${type==='race' && strat && (S.weather||'dry')==='wet' ? `<span class="muted">${L('Za deště neplatí povinnost použít dvě směsi','In the wet the two-compound rule doesn’t apply')}</span>` : ''}
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" data-f="uisort" data-focus="uisort"${ui.sortByPos?' checked':''}> ${L('Seřadit podle výsledku','Sort by result')}</label>
      <button class="btn sm ghost danger" data-act="clearSession">${type==='race' ? L('Vymazat závod','Clear race') : L('Vymazat sprint','Clear sprint')}</button>
    </div>
    ${incHTML(s, r, type, S)}
    ${pre ? `<div class="prefill"><span><b>${L('Pořadí je předvyplněné podle startovního roštu.','The order is pre-filled from the starting grid.')}</b> ${L('Body se započítají, až pořadí upravíš podle výsledku nebo ho potvrdíš.','Points count once you change it to the race result or confirm it.')}</span><span class="spacer"></span><button class="btn sm primary" data-act="preOk">${L('Potvrdit jako výsledek','Confirm as result')}</button><button class="btn sm ghost" data-act="preClear">${L('Vymazat předvyplnění','Clear pre-fill')}</button></div>` : ''}
    <div class="scroll" data-keep="entry"><table class="entry"><thead><tr><th>${L('Jezdec','Driver')}</th>${hasGrid?`<th class="num" title="${L('Startovní pozice z kvalifikace','Grid slot from qualifying')}">${L('Start','Grid')}</th>`:''}<th>${L('Pozice','Position')}</th><th>${L('Stav','Status')}</th><th class="num">${L('Body','Points')}</th><th>${L('Penalizace','Penalties')}</th><th>${L('NK','FL')}</th>${type==='race'?'<th>Pole</th>':''}${strat?`<th>${L('Pit stopy','Pit stops')}${mand ? `<span class="mandh">${L(`povinné: ${mand}`,`mandatory: ${mand}`)}</span>` : ''}</th><th title="${L('Kliknutím na barevné kolečko přidáš sadu, kliknutím na zapsanou sadu ji odebereš','Click a coloured tyre to add a set, click an entered set to remove it')}">${L('Pneumatiky','Tyres')}${type==='race' && (S.weather||'dry')!=='wet' ? `<span class="mandh">${L('min. 2 směsi','min. 2 compounds')}</span>` : ''}</th>`:''}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function qualiBody(s, r, kind){
  const Q = (r.q && r.q[kind]) || {res:{}};
  let list = entryDrivers(s, Q);
  const N = list.length;
  const segs = qSegs(s, kind, r), multi = segs.length > 1, fmt = qFmt(s, r);
  const qa0 = qAnalysis(s, Q, list, multi);
  if(ui.sortByPos){ const k = d => (Q.res[d.id]||{}).pos || qa0.prov.get(d.id) || 999; list = [...list].sort((a,b)=>k(a)-k(b)); }
  const {counts, check} = dupCheck(list, id=>Q.res[id], e=>!!(e && e.pos));
  const f1 = multi;
  const inQ2 = N > 10 ? 10 + Math.ceil((N-10)/2) : N;
  const gridOpts = (cur, au) => `<option value=""${cur===''||cur==null?' selected':''}>${au ? (au==='PL' ? L('auto: box','auto: pit') : L('auto: ','auto: ')+au) : L('auto','auto')}</option>`
    + Array.from({length:N}, (_,k)=>`<option value="${k+1}"${String(cur)===String(k+1)?' selected':''}>${k+1}</option>`).join('')
    + `<option value="PL"${cur==='PL'?' selected':''}>${L('Boxová ulička','Pit lane')}</option>`;
  const gmQ = gridFor(s, r, kind==='squali' ? 'sprint' : 'race');
  const qa = qAnalysis(s, Q, entryDrivers(s, Q), multi);
  const rows = list.map(d=>{
    const e = Q.res[d.id] || {};
    const autoG = gmQ.get(d.id);
    const t = teamOf(s, e.teamId || d.teamId);
    const cells = segs.map(([k,label],si)=>{
      const tk = 't'+(si+1);
      const outT = (k==='q2' && qa.out2.has(d.id)) || (k==='q3' && qa.out3.has(d.id));
      const out = outT || (f1 && e.pos && ((k==='q2' && e.pos > inQ2) || (k==='q3' && e.pos > 10)));
      const lock = out && !e[k] && !(e[tk]||[]).length;
      const chips = (e[tk]||[]).map((c,j)=>`<button class="tyre" style="--c:${TYRES[c].color}" data-act="qTyreDel" data-d="${d.id}" data-seg="${tk}" data-k="${j}" data-focus="qtd-${d.id}-${tk}-${j}" title="${L('Odebrat','Remove')}: ${esc(tyreName(c))}">${c}</button>`).join('');
      const adder = `<select class="tadd" data-f="qtyre" data-d="${d.id}" data-seg="${tk}" data-focus="qta-${d.id}-${tk}"${lock?' disabled':''} aria-label="${L('Přidat pneumatiku','Add tyre')} ${label}: ${esc(d.name)}"><option value="">+</option>${Object.keys(TYRES).map(c=>`<option value="${c}">${c} ${esc(tyreName(c))}</option>`).join('')}</select>`;
      return `<td class="segc${out?' out':''}"><div class="qseg"><input class="qt" data-f="qtime" data-d="${d.id}" data-seg="${k}" data-focus="qt-${d.id}-${k}" value="${esc(e[k]||'')}" placeholder="${lock ? L('vypadl','out') : L('čas','time')}"${lock?' disabled':''} aria-label="${label}: ${esc(d.name)}"><span class="tyres">${chips}</span>${adder}</div></td>`;
    }).join('');
    return `<tr class="${d.player?'is-player':''}${e.pos && counts[e.pos]>1?' dup':''}">
      <td class="name"><span class="ts" style="--tc:${t?t.color:'transparent'}"></span>${esc(d.name)}<small>${esc(t?t.name:L('bez angažmá','free agent'))}</small></td>
      <td class="posc"><select data-f="qpos" data-d="${d.id}" data-focus="qpos-${d.id}" aria-label="${L('Pozice v kvalifikaci','Qualifying position')}: ${esc(d.name)}">${posOptions(N, e.pos)}</select></td>
      ${cells}
      <td class="penc"><button class="penbtn" data-act="penGrid" data-d="${d.id}" data-focus="pg-${d.id}" title="${(e.gpens||[]).length ? L('Upravit nebo přidat další penalizaci','Edit or add another penalty') : L('Přidat penalizaci','Add a penalty')}" aria-label="${L('Penalizace na roštu','Grid penalties')}: ${esc(d.name)}">${penChips(e.gpens, GRID_REASONS)}<span class="plus">+</span></button></td>
      <td><select data-f="qgrid" data-d="${d.id}" data-focus="qg-${d.id}" aria-label="${L('Startovní pozice','Grid slot')}: ${esc(d.name)}">${gridOpts(e.grid, autoG)}</select></td>
    </tr>`;
  }).join('');
  const hint = (f1
    ? L(`${N} ${P(N,'jezdec','jezdci','jezdců','','')}: v ${segs[0][1]} ${P(N-qa.n2,'vypadne','vypadnou','vypadne','','')} ${N-qa.n2}, v ${segs[1][1]} ${qa.n2-qa.n3}, do ${segs[2][1]} postupuje ${qa.n3}. Po zadání časů všech jezdců v ${segs[0][1]} se pořadí vyřazených doplní samo a jejich další segmenty se zamknou, stejně po ${segs[1][1]}, a po ${segs[2][1]} se doplní první desítka. Jezdec bez času: napiš třeba „bez času“. `,
        `${N} drivers: ${N-qa.n2} out in ${segs[0][1]}, ${qa.n2-qa.n3} out in ${segs[1][1]}, ${qa.n3} reach ${segs[2][1]}. Once every driver has a ${segs[0][1]} time, the eliminated drivers get their positions and their next segments are locked, the same after ${segs[1][1]}, and after ${segs[2][1]} the top 10 is filled in. Driver with no time: type e.g. "no time". `)
    : fmt==='oneshot'
    ? L('One-shot: každý jezdec má jen jedno měřené kolo. Po zadání časů všech jezdců se pořadí doplní samo. ','One-shot: every driver gets a single timed lap. Once every driver has a time, the order is filled in automatically. ')
    : L('Krátká kvalifikace: jedna část, kdo kolik stihne kol, nikdo nevypadává. Po zadání časů všech jezdců se pořadí doplní samo. ','Short qualifying: one session, as many laps as you can fit in, nobody is knocked out. Once every driver has a time, the order is filled in automatically. '))
    + (kind==='quali'
    ? L('Kdo bude 1., dostane automaticky pole position. Startovní rošt se pak předvyplní i do závodu. Startovní pozice se počítá z kvalifikace a penalizací na roštu, ručně ji nastav, jen když chceš přesnou pozici.',
        'P1 automatically gets pole position. The starting grid is then pre-filled into the race. Grid slots are calculated from qualifying and grid penalties, set one manually only if you want an exact slot.')
    : L('Startovní rošt se pak předvyplní i do sprintu. Startovní pozice se počítá ze sprintové kvalifikace a penalizací na roštu, ručně ji nastav, jen když chceš přesnou pozici.','The grid is then pre-filled into the sprint. Grid slots are calculated from sprint qualifying and grid penalties, set one manually only if you want an exact slot.'));
  return `<div class="ed-meta">
      <label class="field">${L('Formát','Format')} <select data-f="rqfmt" data-focus="rqfmt"><option value=""${!r.qFormat?' selected':''}>${L('Podle sezóny','Season setting')}: ${esc(qFmtName(seasonQFmt(s)))}</option>${QFMTS().filter(([k])=>s.series!=='F2' || k!=='full').map(([k,l])=>`<option value="${k}"${r.qFormat===k?' selected':''}>${esc(l)}</option>`).join('')}</select></label>
      ${weatherSel(Q.weather)}
      ${check}
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" data-f="uisort" data-focus="uisort"${ui.sortByPos?' checked':''}> ${L('Seřadit podle výsledku','Sort by result')}</label>
      <button class="btn sm ghost danger" data-act="clearSession">${L('Vymazat kvalifikaci','Clear qualifying')}</button>
    </div>
    <p class="hint" style="margin:-4px 0 10px">${hint}</p>
    <div class="scroll" data-keep="entry"><table class="entry"><thead><tr><th>${L('Jezdec','Driver')}</th><th>${L('Pozice','Position')}</th>
      ${segs.map(([k,label])=>`<th class="segc" title="${L('Čas a pneumatiky, na kterých jel pokusy','Lap time and the tyres used for the runs')}">${label} <span class="muted">${L('čas a pneu','time & tyres')}</span></th>`).join('')}
      <th>${L('Penalizace na roštu','Grid penalties')}</th><th>${L('Startovní pozice','Grid slot')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function gridListHTML(s, gm){
  const items = [...gm].map(([id,g])=>({d:drvOf(s,id), g})).filter(x=>x.d);
  const nums = items.filter(x=>x.g!=='PL').sort((a,b)=>a.g-b.g);
  const pl = items.filter(x=>x.g==='PL');
  if(!items.length) return '';
  const slot = x=>{ const t = teamOf(s, x.d.teamId);
    return `<li class="${x.d.player?'is-player':''}" style="grid-row:${x.g} / span 2;grid-column:${x.g%2?1:2};--tc:${t?t.color:'var(--line)'}" title="${esc(x.d.name)}"><span class="gp">${x.g}</span><span class="gn">${esc(shortName(x.d.name))}</span></li>`; };
  return `<ol class="gridviz">${nums.map(slot).join('')}</ol>`
    + (pl.length ? `<p class="hint"><b>${L('Z boxové uličky','From the pit lane')}:</b> ${pl.map(x=>esc(x.d.name)).join(', ')}</p>` : '');
}
function gridPanelHTML(s, r, kind){
  const f2 = s.series==='F2';
  let html = '';
  if(kind==='squali'){
    const g = gridListHTML(s, gridFor(s, r, 'sprint'));
    html = `<h3>${L('Startovní rošt sprintu','Sprint grid')}</h3>${g || `<p class="muted">${L('Rošt se ukáže po zadání pořadí.','The grid shows up once positions are entered.')}</p>`}`;
  } else {
    const g = gridListHTML(s, gridFor(s, r, 'race'));
    html = `<h3>${f2 ? L('Rošt hlavního závodu','Feature race grid') : L('Startovní rošt','Starting grid')}</h3>${g || `<p class="muted">${L('Rošt se ukáže po zadání pořadí.','The grid shows up once positions are entered.')}</p>`}`;
    if(f2 && r.sprint){
      const gs = gridListHTML(s, gridFor(s, r, 'sprint'));
      if(gs) html += `<h3>${L('Rošt sprintu (obrácená první desítka)','Sprint grid (top 10 reversed)')}</h3>${gs}`;
    }
  }
  return `<aside class="live">${html}</aside>`;
}

function liveHTML(s, r){
  const idx = s.rounds.indexOf(r);
  const now = compute(s, idx);
  const before = idx > 0 ? compute(s, idx-1) : null;
  const hasNow = roundHasData(r);
  const prevD = new Map(), prevT = new Map();
  if(before){ before.drivers.filter(d=>d.has).forEach((d,i)=>prevD.set(d.id, i+1)); before.teams.filter(t=>t.has).forEach((t,i)=>prevT.set(t.id, i+1)); }
  const delta = (map, id, pos) => {
    if(!hasNow || !before) return '<span class="d"></span>';
    if(!map.has(id)) return `<span class="d muted">${L('nový','new')}</span>`;
    const dlt = map.get(id) - pos;
    if(dlt > 0) return `<span class="d up" title="${L('Posun o','Up')} ${dlt}">▲${dlt}</span>`;
    if(dlt < 0) return `<span class="d down" title="${L('Pokles o','Down')} ${-dlt}">▼${-dlt}</span>`;
    return '<span class="d muted">–</span>';
  };
  const ds = now.drivers.filter(d=>d.has);
  const ts = now.teams.filter(t=>t.has);
  if(!ds.length) return `<aside class="live"><h3>${L('Průběžné pořadí','Standings')}</h3><p class="muted">${L('Jakmile zadáš výsledek, tady se ukáže pořadí jezdců a týmů.','Once you enter a result, the driver and team standings show up here.')}</p></aside>`;
  return `<aside class="live"><h3>${L(`Pořadí po ${idx+1}. závodě`, `Standings after round ${idx+1}`)}</h3>
    <ol class="mini">${ds.map((d,i)=>`<li class="${d.player?'is-player':''}" style="--tc:${(teamOf(s,d.teamId)||{}).color||'transparent'}"><span class="p"><span class="pnum${i<3?' t'+(i+1):''}">${i+1}</span></span>${delta(prevD,d.id,i+1)}<span class="n">${esc(d.name)}</span><span class="b">${d.pts}</span></li>`).join('')}</ol>
    <h3>${L('Konstruktéři','Constructors')}</h3>
    <ol class="mini">${ts.map((t,i)=>`<li class="${t.player?'is-player':''}" style="--tc:${t.color}"><span class="p"><span class="pnum${i<3?' t'+(i+1):''}">${i+1}</span></span>${delta(prevT,t.id,i+1)}<span class="n"><span class="ts" style="--tc:${t.color}"></span>${esc(t.name)}</span><span class="b">${t.pts}</span></li>`).join('')}</ol>
  </aside>`;
}

/* ---------- soupiska ---------- */

  return `<select data-f="dteam" data-id="${d.id}" data-focus="dt-${d.id}" aria-label="${L('Tým jezdce','Team of')} ${esc(d.name)}">
    ${s.teams.map(t=>`<option value="${t.id}"${t.id===d.teamId?' selected':''}>${esc(t.name)}</option>`).join('')}
    <option value=""${!d.teamId?' selected':''}>${L('Bez angažmá','Free agent')}</option></select>`;
}
function driverRow(s, d){

}

  <div class="lineup">
