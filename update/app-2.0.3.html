      <div class="wr-row">${big(ch.pts, L('bodů','points'))}${big(ch.wins, P(ch.wins,'výhra','výhry','výher','win','wins'))}${big(second ? '+'+(ch.pts-second.pts) : '—', L('náskok','margin'))}</div>`}); }

      slides.push({cls:'g4', html:`<div class="wr-kick">${L('Tvůj nejlepší závod','Your best race')}</div><h2 class="wr-h">${t ? esc(gpName(t)) : ''}</h2><div class="wr-row">${big(best.pos+'.', L('v cíli','at the finish'))}${gain && gain.v > 0 ? big('+'+gain.v, L('nejvíc získaných pozic v jednom závodě','most places gained in one race')) : ''}</div>
        ${best.r.note ? `<p class="wr-q">„${esc(best.r.note)}“</p>` : ''}`}); }
    const mate = st.drivers.find(d=>d.id!==me.id && d.teamId===me.teamId);
    if(mate){ let qa = 0, qb = 0, ra = 0, rb = 0;
      s.rounds.forEach(r=>{ const Q = r.q && r.q.quali; if(Q && Q.res[me.id] && Q.res[mate.id] && Q.res[me.id].pos && Q.res[mate.id].pos){ if(Q.res[me.id].pos < Q.res[mate.id].pos) qa++; else qb++; }
        const a = r.s.race.res[me.id], b = r.s.race.res[mate.id]; if(a && b && hasRes(a) && hasRes(b)){ const pa = a.status ? 99 : a.pos, pb = b.status ? 99 : b.pos; if(pa < pb) ra++; else if(pb < pa) rb++; } });
      slides.push({cls:'g5', html:`<div class="wr-kick">${L('Týmový souboj','Teammate battle')}</div><h2 class="wr-h">${me.pts >= mate.pts ? L('Vyhráno!','You won it!') : L('Tentokrát prohra','Lost this time')}</h2><p class="wr-p">${L('proti','vs')} ${esc(mate.name)}</p>
        <div class="wr-row">${big(`${me.pts}:${mate.pts}`, L('body','points'))}${big(`${ra}:${rb}`, L('závody','races'))}${qa+qb ? big(`${qa}:${qb}`, L('kvalifikace','qualifying')) : ''}</div>`}); }

let wrapEl = null, wrapTimer = null;
function openWrapped(){

  const canCap = window.desktop && window.desktop.capture;
  const show = () => {
    clearTimeout(wrapTimer);
    wrapEl.innerHTML = `<div class="wr-bars">${slides.map((x,k)=>`<i class="${k<i?'done':k===i?'on':''}"></i>`).join('')}</div>
      <div class="wr-card ${slides[i].cls}" id="wrCard"><div class="wr-in">${slides[i].html}</div><div class="wr-brand">F1 Season Tracker · ${s.year}</div></div>
      <div class="wr-nav"><button type="button" data-w="prev" aria-label="${L('Předchozí','Previous')}"${i?'':' disabled'}>‹</button>
        ${canCap ? `<button type="button" data-w="save">${L('Uložit kartu','Save card')}</button>` : ''}<button type="button" data-w="close">${L('Zavřít','Close')}</button>
        <button type="button" data-w="next" aria-label="${L('Další','Next')}">${i < slides.length-1 ? '›' : '✓'}</button></div>`;
    wrapTimer = setTimeout(()=>{ if(i < slides.length-1){ i++; show(); } }, 6500);
  };
  wrapEl.onclick = async e => { const b = e.target.closest('[data-w]');
    if(!b){ if(e.target.closest('#wrCard')){ const r = e.target.closest('#wrCard').getBoundingClientRect(); if(e.clientX < r.left + r.width/3){ if(i){ i--; show(); } } else if(i < slides.length-1){ i++; show(); } } return; }
    const w = b.dataset.w;
    if(w==='prev' && i){ i--; show(); } else if(w==='next'){ if(i < slides.length-1){ i++; show(); } else wrapEl.close(); } else if(w==='close') wrapEl.close();
    else if(w==='save'){ clearTimeout(wrapTimer); const r = document.getElementById('wrCard').getBoundingClientRect();
      const url = await window.desktop.capture({x:Math.round(r.left), y:Math.round(r.top), width:Math.round(r.width), height:Math.round(r.height)});
      if(url) window.desktop.saveImage(url, `${s.year}-wrapped-${i+1}.png`, L('Uložit kartu','Save card')).then(ok=>{ if(ok) toast(L('Karta uložena','Card saved')); }); } };
  wrapEl.onkeydown = e => { if(e.key==='ArrowRight'){ if(i < slides.length-1){ i++; show(); } } else if(e.key==='ArrowLeft' && i){ i--; show(); } };
  show(); wrapEl.showModal();
  ui.wrapSeen = ui.wrapSeen || {}; if(s.rounds.every(roundHasData)){ ui.wrapSeen[s.id] = 1; persist(); }
}

  <header><h1>${e(c.name)}</h1><p>${e(modeName(c.mode))} · ${seasons.length ? (seasons[0].year===seasons[seasons.length-1].year ? seasons[0].year : `${seasons[0].year}–${seasons[seasons.length-1].year}`) : ''}</p></header>
  <main><section class="story"><h2>${L('Příběh kariéry','Career story')}</h2>${K.text.map(p=>`<p>${p}</p>`).join('')}
    <ul class="tl">${K.rows.map(r=>`<li><b>${r.s.year}</b> · ${r.me ? `${r.pos}. ${e(r.me.name)} (${r.me.pts} ${L('b.','pts')})` : r.myT ? `${e(r.myT.name)}: ${r.tPos}.` : ''} · ${r.fin ? '🏆' : L('vede','leading')} ${e(r.ch.name)}</li>`).join('')}</ul></section>
  ${sec}</main><footer>${L('Vytvořeno v aplikaci','Made with')} F1 Season Tracker ${APP_VERSION} · ${new Date().toLocaleDateString(isEN()?'en-GB':'cs-CZ')}</footer></body></html>`;
}
function exportCareerWeb(c){
  if(!c || !c.seasons.some(s=>s.rounds.some(roundHasData))){ toast(L('Kariéra zatím nemá žádné výsledky','This career has no results yet')); return; }
  const html = careerWebHTML(c), name = `${slug(c.name) || 'kariera'}.html`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], {type:'text/html'})); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast(L('Webová stránka kariéry je připravená, pošli ji komukoli','The career web page is ready, send it to anyone'));
}

/* ---------- záloha ---------- */
function exportData(){
  flush();
  const json = JSON.stringify(state, null, 2);
  const name = `f1-season-tracker-${L('zaloha','backup')}-${new Date().toISOString().slice(0,10)}.json`;
  if(window.desktop && window.desktop.saveBackup){
    window.desktop.saveBackup(json, name, L('Uložit zálohu','Save backup')).then(ok=>{ if(ok) toast(L('Záloha uložena','Backup saved')); });
    return;
  }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast(L('Záloha uložena do stažených souborů','Backup saved to Downloads'));
  }catch(err){
    openDialog(L('Záloha','Backup'), `<p class="hint">${L('Zkopíruj celý text a ulož si ho do souboru .json.','Copy all the text and save it as a .json file.')}</p><textarea readonly>${esc(json)}</textarea>`, null, '');
  }
}
$('#importFile').addEventListener('change', async e=>{
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  let data;
  try{ data = migrate(JSON.parse(await file.text())); if(!Array.isArray(data.careers)) throw new Error(); }
  catch{ toast(L('Soubor není platná záloha F1 Season Tracker','This file isn’t a valid F1 Season Tracker backup')); return; }
  const n = data.careers.length;
  openDialog(L('Načíst zálohu','Load backup'), `<p>${L(
      `Záloha obsahuje ${n} ${P(n,'kariéru','kariéry','kariér','','')}. Chceš je přidat k současným, nebo všechno nahradit?`,
      `The backup contains ${n} ${P(n,'','','','career','careers')}. Add them to your current ones, or replace everything?`)}</p>`,
    (fd, v)=>{
      if(v==='replace'){ const lang = ui.lang; state = data; ui.careerId = null; ui.seasonId = null; ui.lang = lang; }
      else {
        const ids = new Set(state.careers.map(c=>c.id));
        data.careers.forEach(c=>{ if(ids.has(c.id)) c.id = uid(); state.careers.push(c); });
        const tids = new Set(state.customTracks.map(t=>t.id));
        data.customTracks.forEach(t=>{ if(!tids.has(t.id)) state.customTracks.push(t); });
        const cids = new Set(calTemplates().map(t=>t.id)); (data.calTemplates||[]).forEach(t=>{ if(!cids.has(t.id)) calTemplates().push(t); });
      }
      upgradeFreeAgents(state);
      toast(L('Záloha načtena','Backup loaded'));
    }, L('Přidat kariéry','Add careers'), `<button type="submit" class="btn danger" value="replace">${L('Nahradit vše','Replace everything')}</button>`);
});

if(upgradeFreeAgents(state)) persist();
render();
/* ---------- aktualizace ---------- */
function updBar(r){
  let bar = document.getElementById('updbar'); if(bar) bar.remove();
  if(!r || (r.type!=='content' && r.type!=='installer')) return;
  const notes = (r.notes && (r.notes[ui.lang] || r.notes.en || r.notes.cs)) || '';
  bar = document.createElement('div'); bar.id = 'updbar'; bar.className = 'updbar'; bar.setAttribute('role','status');
  bar.innerHTML = `<div class="ub-text"><b>${r.type==='content' ? L(`Nová verze ${esc(r.version)} je připravená`, `Version ${esc(r.version)} is ready`) : L(`Vyšla nová verze ${esc(r.version)}`, `Version ${esc(r.version)} is out`)}</b>
      <span>${r.type==='content' ? L('Aktualizace trvá pár sekund, tvoje kariéry zůstanou.','It only takes a few seconds, your careers stay as they are.') : L('Tahle verze potřebuje novou instalaci. Stáhni ji a nainstaluj přes tu současnou.','This version needs a new install. Download it and install it over this one.')}</span>
      ${notes ? `<small>${esc(notes)}</small>` : ''}</div>
    <div class="ub-btns"><button class="btn primary" id="ubGo">${r.type==='content' ? L('Aktualizovat','Update now') : L('Stáhnout','Download')}</button><button class="btn ghost" id="ubLater">${L('Později','Later')}</button></div>`;
  document.body.appendChild(bar);
  bar.querySelector('#ubLater').onclick = ()=>{ ui.updSkip = r.version; persist(); bar.remove(); };
  bar.querySelector('#ubGo').onclick = async ()=>{
    if(r.type==='installer'){ window.desktop.openDownload(r.url); bar.remove(); return; }
    const b = bar.querySelector('#ubGo'); b.disabled = true; b.textContent = L('Stahuji…','Downloading…');
    const res = await window.desktop.applyUpdate();
    if(!res || !res.ok){ b.disabled = false; b.textContent = L('Aktualizovat','Update now'); toast(L('Aktualizace se nepovedla, zkus to později','The update failed, try again later')); }
  };
}
async function checkUpdates(manual){
  if(!window.desktop || !window.desktop.checkUpdate){ if(manual) toast(L('Aktualizace fungují jen v nainstalované aplikaci','Updates only work in the installed app')); return; }
  const r = await window.desktop.checkUpdate();
  if(r.type==='error'){ if(manual) toast(L('Nepodařilo se zjistit, jestli je nová verze. Jsi připojený k internetu?','Couldn’t check for updates. Are you online?')); return; }
  if(r.type==='none'){ if(manual) toast(L(`Máš nejnovější verzi (${r.version})`, `You have the latest version (${r.version})`)); return; }
  if(!manual && ui.updSkip===r.version) return;
  updBar(r);
}
setTimeout(()=>checkUpdates(false), 2500);

/* ---------- anonymní statistiky používání ---------- */
const STATS_KEY = 'phc_tuqZumez8Qt4Qk4ZeaRgBSdiXi4HxJxKkDf4fkDJPVeD';               // PostHog project API key (veřejný klíč projektu)
const STATS_URL = 'https://eu.i.posthog.com/i/v0/e/';
let statsSec = 0, statsLastInput = Date.now(), statsMarked = false, statsOn = false, statsSession = '';
function statsId(){ if(!ui.statsId){ ui.statsId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)+Date.now()); persist(); } return ui.statsId; }
function statsOS(){ const u = navigator.userAgent; return /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'macOS' : 'other'; }
function statsSend(event, props, beacon){
  if(!STATS_KEY || ui.stats===false || !window.desktop) return;
  const body = JSON.stringify({api_key:STATS_KEY, event, distinct_id:statsId(), timestamp:new Date().toISOString(),
    properties:Object.assign({app_version:APP_VERSION, os:statsOS(), lang:ui.lang, $session_id:statsSession, $process_person_profile:false}, props||{})});
  try{ fetch(STATS_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body, keepalive:!!beacon, credentials:'omit'}).catch(()=>{}); }catch(e){}
}
function statsFlush(beacon){ if(statsSec >= 5){ const sec = Math.round(statsSec); statsSec = 0; statsSend('active_time', {seconds:sec, minutes:Math.round(sec/6)/10}, beacon); } }
function statsMark(){ statsLastInput = Date.now(); if(statsOn && !statsMarked){ statsMarked = true; statsSend('data_entered'); } }
function statsStart(){
  if(statsOn || !STATS_KEY || ui.stats===false || !window.desktop) return;
  statsOn = true; statsSession = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  statsSend('app_opened', {first_open: !ui.statsSeen}); if(!ui.statsSeen){ ui.statsSeen = 1; persist(); }
  ['pointerdown','keydown','wheel'].forEach(ev=>window.addEventListener(ev, ()=>{ statsLastInput = Date.now(); }, {passive:true}));
  setInterval(()=>{ if(ui.stats!==false && document.visibilityState==='visible' && document.hasFocus() && Date.now()-statsLastInput < 120000) statsSec += 1; }, 1000);
  setInterval(()=>statsFlush(false), 300000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') statsFlush(true); });
  window.addEventListener('blur', ()=>statsFlush(true));
  window.addEventListener('beforeunload', ()=>statsFlush(true));
}
document.addEventListener('change', e=>{ const el = e.target.closest && e.target.closest('[data-f]'); if(el && el.dataset.f!=='lang' && !dlg.contains(el)) statsMark(); }, true);
setTimeout(statsStart, 1500);
document.addEventListener('input', e=>{ if(e.target.id!=='profSearch') return; ui.profQ = e.target.value; const q = slug(ui.profQ).replace(/-/g,' ');
  document.querySelectorAll('.prof-card[data-q]').forEach(b=>{ b.hidden = !!q && !b.dataset.q.includes(q); });
  document.querySelectorAll('.prof-group').forEach(g=>{ g.hidden = !g.querySelector('.prof-card:not([hidden])'); }); });
