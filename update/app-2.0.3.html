  <div class="lineup">
    ${s.teams.map(t=>{ const ds = s.drivers.filter(d=>d.teamId===t.id);
      return `<section class="team-block" style="--tc:${t.color}"><header class="tb-head">
        <button type="button" class="logo-btn" data-act="teamLogo" data-id="${t.id}" title="${L('Vybrat logo týmu (obrázek z počítače)','Choose a team logo (an image from your computer)')}">${teamLogo(t) ? `<img src="${teamLogo(t)}" alt="">` : `<span>+ ${L('Logo','Logo')}</span>`}</button>
        <input class="tname" data-f="tname" data-id="${t.id}" data-focus="tn-${t.id}" value="${esc(t.name)}" aria-label="${L('Název týmu','Team name')}">
        <div class="tb-ctrl">
          <input type="color" data-f="tcolor" data-id="${t.id}" data-focus="tc-${t.id}" value="${esc(t.color)}" aria-label="${L('Barva týmu','Team colour')}" title="${L('Barva týmu','Team colour')}">
          <label class="chk" title="${L('Tvůj tým, zvýrazní se v tabulkách','Your team, highlighted in the tables')}"><input type="checkbox" data-f="tplayer" data-id="${t.id}" data-focus="tp-${t.id}"${t.player?' checked':''}> ${L('Můj tým','My team')}</label>
          <button class="btn sm ghost danger" data-act="deleteTeam" data-id="${t.id}" aria-label="${L('Smazat tým','Delete team')} ${esc(t.name)}">${L('Smazat','Delete')}</button>
        </div></header>
        <ul>${ds.map(d=>driverRow(s,d)).join('') || `<li class="none">${L('Tým nemá žádné jezdce.','No drivers in this team.')}</li>`}</ul></section>`; }).join('')}
    <section class="team-block free"><header><b>${L('Bez angažmá','Free agents')}</b><span class="muted">${free.length} ${P(free.length,'jezdec','jezdci','jezdců','driver','drivers')}</span></header>
      ${free.length ? ['free','other','real','f2','game','legend','hist','retired'].map(g=>{ const ds = free.filter(d=>(d.fa||'other')===g).sort((a,b)=>a.name.localeCompare(b.name,'cs'));
        if(!ds.length) return '';
        return `<details class="fa-group${g==='retired'?' fa-retired':''}"${g==='other' || g==='free' || ui.faOpen===g ? ' open' : ''} data-g="${g}"><summary>${esc(FA_LABEL()[g])} <span class="muted">${ds.length}</span></summary><ul>${ds.map(d=>driverRow(s,d)).join('')}</ul></details>`; }).join('')
        : `<ul><li class="none">${L('Všichni jezdci mají tým.','Every driver has a team.')}</li></ul>`}</section>
  </div>`;
}

/* ---------- souboje týmových kolegů (H2H) ---------- */
function h2hData(s){
  const out = [];
  for(const t of s.teams){
    const per = new Map(); // did -> [{i, q, r:{pos,status}, pts}]
    const touch = (did,i)=>{ let a = per.get(did); if(!a){ a = new Map(); per.set(did, a); } let x = a.get(i); if(!x){ x = {}; a.set(i, x); } return x; };
    s.rounds.forEach((r,i)=>{
      const Q = r.q && r.q.quali;
      if(Q && Q.res) for(const [did,e] of Object.entries(Q.res)){ const tid = e.teamId || (drvOf(s,did)||{}).teamId; if(tid===t.id && e.pos) touch(did,i).q = e.pos; }
      for(const type of ['race','sprint']){
        if(type==='sprint' && !r.sprint) continue;
        const S = r.s[type];
        for(const [did,e] of Object.entries(S.res||{})){
          if(!hasRes(e)) continue;
          const tid = e.teamId || (drvOf(s,did)||{}).teamId; if(tid!==t.id) continue;
          const x = touch(did,i);
          const p = sessPts(s, type, e, S.fl===did, type==='race' && S.pole===did) + penPts(e);
          x.pts = (x.pts||0) + p;
          if(type==='race'){ x.pos = e.pos; x.status = e.status; }
        }
      }
    });
    const ids = [...per.keys()]; if(ids.length < 2) continue;
    const pairs = [];
    for(let a=0;a<ids.length;a++) for(let b=a+1;b<ids.length;b++){
      const A = per.get(ids[a]), B = per.get(ids[b]); const common = [...A.keys()].filter(i=>B.has(i)); if(!common.length) continue;
      const st = {q:[0,0], r:[0,0], pts:[0,0], best:[null,null], fin:[[0,0],[0,0]], dnf:[0,0], n:common.length};
      common.forEach(i=>{ const x = A.get(i), y = B.get(i);
        if(x.q && y.q){ if(x.q < y.q) st.q[0]++; else if(y.q < x.q) st.q[1]++; }
        const fx = !x.status && x.pos, fy = !y.status && y.pos;
        if(fx && fy){ if(x.pos < y.pos) st.r[0]++; else if(y.pos < x.pos) st.r[1]++; }
        else if(fx && y.status && y.status!=='DNS') st.r[0]++; else if(fy && x.status && x.status!=='DNS') st.r[1]++;
        [[x,0],[y,1]].forEach(([z,k])=>{ st.pts[k] += z.pts||0; if(!z.status && z.pos){ st.fin[k][0] += z.pos; st.fin[k][1]++; if(st.best[k]===null || z.pos < st.best[k]) st.best[k] = z.pos; } if(z.status==='DNF') st.dnf[k]++; });
      });
      pairs.push({a:drvOf(s,ids[a]), b:drvOf(s,ids[b]), st});
    }
    pairs.sort((x,y)=>y.st.n-x.st.n);
    if(pairs.length) out.push({t, pairs});
  }
  const mine = t => t.player || s.drivers.some(d=>d.player && d.teamId===t.id);
  return out.sort((x,y)=>mine(y.t)-mine(x.t));
}
function h2hPanel(s){
  const data = h2hData(s);
  const champ = new Map(compute(s).drivers.filter(d=>d.has).map((d,i)=>[d.id, i+1]));
  const row = (label, a, b, lowerBetter, fmt=v=>v) => {
    const na = typeof a==='number' ? a : null, nb = typeof b==='number' ? b : null;
    const wa = na!==null && nb!==null && (lowerBetter ? na<nb : na>nb), wb = na!==null && nb!==null && (lowerBetter ? nb<na : nb>na);
    const share = (!lowerBetter && na!==null && nb!==null && na+nb>0) ? Math.round(na/(na+nb)*100) : null;
    return `<div class="h2h-row"><span class="h2h-v${wa?' win':''}">${a===null||a===undefined?'—':fmt(a)}</span><span class="h2h-l">${label}${share!==null?`<span class="h2h-bar"><i style="width:${share}%"></i></span>`:''}</span><span class="h2h-v r${wb?' win':''}">${b===null||b===undefined?'—':fmt(b)}</span></div>`;
  };
  const avg = f => f[1] ? Math.round(f[0]/f[1]*10)/10 : null;
  const cards = data.map(({t,pairs})=>pairs.map(({a,b,st})=>`<article class="h2h" style="--tc:${t.color}">
    <header>${teamMark(t)}<b>${esc(t.name)}</b><span class="muted">${st.n} ${P(st.n,'společný závod','společné závody','společných závodů','race together','races together')}</span></header>
    <div class="h2h-names"><span class="${a.player?'is-player':''}">${esc(a.name)}</span><span class="${b.player?'is-player':''}">${esc(b.name)}</span></div>
    ${row(L('Šampionát','Championship'), champ.get(a.id) ?? null, champ.get(b.id) ?? null, true, v=>v+'.')}
    ${row(L('Kvalifikace','Qualifying'), st.q[0], st.q[1])}
    ${row(L('Závod','Race'), st.r[0], st.r[1])}
    ${row(L('Body','Points'), st.pts[0], st.pts[1], false, v=>ptsTxt(v))}
    ${row(L('Nejlepší výsledek','Best finish'), st.best[0], st.best[1], true, v=>'P'+v)}
    ${row(L('Průměrný výsledek','Average finish'), avg(st.fin[0]), avg(st.fin[1]), true, v=>'P'+String(v).replace('.', ui.lang==='cs'?',':'.'))}
    ${row('DNF', st.dnf[0], st.dnf[1], true)}
  </article>`).join('')).join('');
  return `<div class="panel"><h2>${L('Týmové souboje','Teammate head-to-head')}</h2>
    ${cards ? `<div class="h2h-grid">${cards}</div><p class="legend">${L('Počítají se jen závody, kde jeli oba za stejný tým. Kvalifikace podle konečného pořadí, závod podle cíle (kdo dojel, porazil toho, kdo odstoupil). Body zahrnují i sprinty. Šampionát je aktuální pozice v poháru jezdců za celou sezónu.','Only rounds where both drove for the same team count. Qualifying by final position, race by finishing position (a finisher beats a driver who retired). Points include sprints. Championship is the current position in the Drivers’ standings for the whole season.')}</p>`
      : `<p class="muted">${L('Jakmile zapíšeš výsledky, uvidíš tu srovnání jezdců v každém týmu.','Once you enter results, each team’s driver pairing is compared here.')}</p>`}</div>`;
}
/* ---------- statistiky ---------- */
function viewStats(s){
  if(!s.rounds.length) return noRounds();
  const st = compute(s);
  const rr = s.rounds.map((r,i)=>{
    const t = trackById(r.trackId), S = r.s.race;
    const w = Object.entries(S.res).find(([,e])=>e.pos===1 && !e.status);
    const wd = w ? drvOf(s, w[0]) : null, pd = S.pole ? drvOf(s, S.pole) : null, fd = S.fl ? drvOf(s, S.fl) : null;
    let sp = '';
    if(r.sprint){ const sw = Object.entries(r.s.sprint.res).find(([,e])=>e.pos===1 && !e.status); const sd = sw ? drvOf(s, sw[0]) : null; sp = sd ? esc(sd.name) : ''; }
    const pt = S.pole && r.q && r.q.quali && r.q.quali.res[S.pole] ? qBest(r.q.quali.res[S.pole]) : '';
    return `<tr><td class="num">${i+1}</td><td title="${esc(circuitName(t))}">${esc(t?gpName(t):'—')}</td><td class="num">${lapsFor(s, r, 'race') ?? ''}${r.sprint && lapsFor(s, r, 'sprint') ? ` <span class="muted">/ ${lapsFor(s, r, 'sprint')}</span>` : ''}</td><td>${pd?esc(pd.name):''}${pt?` <span class="muted">${esc(pt)}</span>`:''}</td><td>${wd?`<b>${esc(wd.name)}</b>`:''}</td><td>${sp}</td>
      <td>${fd?esc(fd.name):''}${S.flTime?` <span class="muted">${esc(S.flTime)}</span>`:''}</td><td>${w?stratHTML(w[1]):''}</td></tr>`;
  }).join('');
  const f1 = s.series!=='F2';
  const qs = new Map();
  s.rounds.forEach(r=>{ const Q = r.q && r.q.quali; if(!Q) return;
    for(const [id,e] of Object.entries(Q.res)){ if(!e.pos) continue; const x = qs.get(id) || {n:0, sum:0, q3:0, best:null};
      x.n++; x.sum += e.pos; if(e.pos<=10) x.q3++; if(x.best===null || e.pos<x.best) x.best = e.pos; qs.set(id, x); } });
  const hasQS = qs.size > 0;
  const ds = st.drivers.filter(d=>d.has || qs.has(d.id));
  const dr = ds.map((d,i)=>{ const t = teamOf(s, d.teamId); const q = qs.get(d.id);
    return `<tr class="${d.player?'is-player':''}"><td class="num">${i+1}</td><td class="name"><span class="ts" style="--tc:${t?t.color:'transparent'}"></span>${esc(d.name)}</td>
      <td class="num">${d.starts}</td><td class="num">${d.wins}</td><td class="num">${d.podiums}</td><td class="num">${d.poles}</td><td class="num">${d.fls}</td><td class="num">${d.dnfs}</td>
      <td class="num">${d.best??'–'}</td><td class="num">${d.finN ? dec(d.finSum/d.finN) : '–'}</td>
      ${hasQS ? `<td class="num">${q ? q.best : '–'}</td><td class="num">${q ? dec(q.sum/q.n) : '–'}</td>${f1?`<td class="num">${q ? q.q3 : 0}</td>`:''}` : ''}
      <td class="num"><b>${d.pts}</b></td></tr>`; }).join('');
  const qt = s.rounds.map((r,i)=>{
    const t = trackById(r.trackId);
    return ['squali','quali'].map(kind=>{
      const Q = r.q && r.q[kind]; if(!Q) return '';
      const segs = qSegs(s, kind, r);
      const list = Object.entries(Q.res).filter(([,e])=>(e.t1||[]).length || (e.t2||[]).length || (e.t3||[]).length)
        .map(([id,e])=>({d:drvOf(s,id), e})).filter(x=>x.d).sort((a,b)=>(a.e.pos||99)-(b.e.pos||99));
      if(!list.length) return '';
      return `<tr><th colspan="${2+segs.length}" style="padding-top:12px;color:var(--ink)">${i+1}. ${esc(t?gpName(t):'—')}, ${sessLabel(s,kind).toLowerCase()}</th></tr>` + list.map(x=>
        `<tr><td class="num">${x.e.pos||''}</td><td>${esc(x.d.name)}</td>${segs.map(([k,label],si)=>{ const ty = x.e['t'+(si+1)]||[];
          return `<td>${ty.length ? `<span class="tyres"><span class="muted" style="margin-right:4px">${label}</span>${ty.map(c=>tyreChip(c)).join('')}${x.e[k]?`<span class="muted" style="margin-left:6px">${esc(x.e[k])}</span>`:''}</span>` : ''}</td>`; }).join('')}</tr>`).join('');
    }).join('');
  }).join('');
  const strat = s.rounds.map((r,i)=>{
    const t = trackById(r.trackId);
    const list = Object.entries(r.s.race.res).filter(([,e])=>(e.tyres||[]).length || (e.pits!=='' && e.pits!=null))
      .map(([id,e])=>({d:drvOf(s,id), e})).filter(x=>x.d)
      .sort((a,b)=>((a.e.pos||99)+(a.e.status?100:0)) - ((b.e.pos||99)+(b.e.status?100:0)));
    if(!list.length) return '';
    return `<tr><th colspan="3" style="padding-top:12px;color:var(--ink)">${i+1}. ${esc(t?gpName(t):'—')}${+r.s.race.mand ? ` <span class="muted">${L('povinné pit stopy','mandatory pit stops')}: ${r.s.race.mand}</span>` : ''}</th></tr>` + list.map(x=>
      `<tr><td class="num">${x.e.status ? esc(x.e.status) : (x.e.pos||'')}</td><td>${esc(x.d.name)}</td><td>${stratHTML(x.e)}</td></tr>`).join('');
  }).join('');
  return `<div class="panel"><h2>${L('Závod po závodu','Race by race')}</h2><div class="scroll"><table><thead><tr><th class="num">${L('Závod','Rd')}</th><th>${L('Velká cena','Grand Prix')}</th><th class="num">${L('Kola','Laps')}</th><th>Pole</th><th>${L('Vítěz','Winner')}</th><th>${L('Vítěz sprintu','Sprint winner')}</th><th>${L('Nejrychlejší kolo','Fastest lap')}</th><th>${L('Strategie vítěze','Winner’s strategy')}</th></tr></thead><tbody>${rr}</tbody></table></div></div>
  <div class="panel"><h2>${L('Jezdci v sezóně','Drivers this season')}</h2>${ds.length ? `<div class="scroll"><table><thead><tr><th class="num">${L('Poz.','Pos')}</th><th>${L('Jezdec','Driver')}</th><th class="num">${L('Starty','Starts')}</th><th class="num">${L('Výhry','Wins')}</th><th class="num">${L('Pódia','Podiums')}</th><th class="num">Pole</th><th class="num">${L('NK','FL')}</th><th class="num">DNF</th><th class="num">${L('Nejlepší','Best')}</th><th class="num">${L('Ø dojezd','Avg finish')}</th>${hasQS ? `<th class="num">${L('Nejlepší kvali','Best quali')}</th><th class="num">${L('Ø kvali','Avg quali')}</th>${f1?'<th class="num" title="'+L('Počet postupů do Q3','Q3 appearances')+'">Q3</th>':''}` : ''}<th class="num">${L('Body','Points')}</th></tr></thead><tbody>${dr}</tbody></table></div>` : `<p class="muted">${L('Zatím bez výsledků.','No results yet.')}</p>`}</div>
  <div class="panel"><h2>${L('Strategie','Strategy')}</h2>${strat ? `<div class="scroll"><table><tbody>${strat}</tbody></table></div>` : `<p class="muted">${L('Zatím nejsou zapsané žádné zastávky ani pneumatiky. Zapisují se u výsledků závodu a jsou nepovinné.','No pit stops or tyres entered yet. They are optional and entered alongside race results.')}</p>`}</div>
  ${incPanel(s)}
  ${penPanel(s)}
  ${qt ? `<div class="panel"><h2>${L('Pneumatiky v kvalifikaci','Qualifying tyres')}</h2><div class="scroll"><table><tbody>${qt}</tbody></table></div></div>` : ''}`;
}

function penPanel(s){
  const rows = [];
  s.rounds.forEach((r,i)=>{
    const t = trackById(r.trackId);
    const gp = `${i+1}. ${esc(t?gpName(t):'—')}`;
    sessionsFor(s, r).forEach(k=>{
      if(isQ(k)){
        const Q = r.q && r.q[k]; if(!Q) return;
        for(const [id,e] of Object.entries(Q.res)) (e.gpens||[]).forEach(p=>{ const d = drvOf(s,id); if(d) rows.push(`<tr><td>${gp}</td><td>${L('Rošt','Grid')}: ${esc(sessLabel(s, k==='squali' ? 'sprint' : 'race').toLowerCase())}</td><td>${esc(d.name)}</td><td><span class="pen">${esc(penShort(p))}</span></td><td>${esc(reasonText(p, GRID_REASONS))}</td></tr>`); });
      } else {
        const S = r.s[k];
        for(const [id,e] of Object.entries(S.res)) (e.pens||[]).forEach(p=>{ const d = drvOf(s,id); if(d) rows.push(`<tr><td>${gp}</td><td>${esc(sessLabel(s,k))}</td><td>${esc(d.name)}</td><td><span class="pen">${esc(penShort(p))}</span>${e.roadPos && e.pos && e.roadPos!==e.pos ? ` <span class="muted">P${e.roadPos}→P${e.pos}</span>` : ''}</td><td>${esc(reasonText(p, RACE_REASONS))}</td></tr>`); });
      }
    });
  });
  if(!rows.length) return '';
  return `<div class="panel"><h2>${L('Penalizace','Penalties')}</h2><div class="scroll"><table><thead><tr><th>${L('Závod','Round')}</th><th>${L('Část','Session')}</th><th>${L('Jezdec','Driver')}</th><th>${L('Penalizace','Penalty')}</th><th>${L('Důvod','Reason')}</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
}

/* ---------- nastavení ---------- */
function scoringPanel(s){
  const sc = scoringOf(s);
  const pre = scoringPreset(sc);
  const n = Math.max(10, s.drivers.filter(d=>d.teamId).length, sc.race.length, sc.sprint.length);
  const grid = (key, arr) => `<div class="pts-grid">${Array.from({length:n}, (_,i)=>`<label>${i+1}. ${L('místo','place')}<input type="number" min="0" max="999" data-f="sc-${key}" data-i="${i}" data-focus="sc-${key}-${i}" value="${+arr[i]||0}"></label>`).join('')}</div>`;
  return `<div class="panel"><h2>${L('Bodování','Points system')}</h2>
    <div class="sc-head">
      <label>${L('Předvolba','Preset')} <select data-f="scPreset" data-focus="scPreset">${SC_NAMES().map(([k,l])=>`<option value="${k}"${pre===k?' selected':''}>${esc(l)}</option>`).join('')}</select></label>
      <label>${L('Bonus za pole position','Pole position bonus')} <input type="number" min="0" max="99" data-f="sc-pole" data-focus="sc-pole" value="${+sc.pole||0}" style="width:90px"></label>
      <label>${L('Bonus za nejrychlejší kolo','Fastest lap bonus')} <input type="number" min="0" max="99" data-f="sc-fl" data-focus="sc-fl" value="${+sc.fl||0}" style="width:90px"></label>
      <label class="chk"><input type="checkbox" data-f="sc-flTop" data-focus="sc-flTop"${sc.flTop?' checked':''}> ${L('Bonus za NK jen pro první desítku','FL bonus only for a top-10 finish')}</label>
      <label class="chk"><input type="checkbox" data-f="sc-flSprint" data-focus="sc-flSprint"${sc.flSprint?' checked':''}> ${L('Bonus za NK i ve sprintu','FL bonus in the sprint too')}</label>

/* ---------- graf vývoje šampionátu ---------- */
function champSeries(s, st, kind){
  const done = s.rounds.map(roundHasData);
  const last = done.lastIndexOf(true); if(last < 0) return null;
  const list = kind==='teams' ? st.teams.filter(t=>t.has) : st.drivers.filter(d=>d.has);
  return {last, lines: list.map((x,pos)=>{ let acc = 0; const pts = [];
    for(let k=0;k<=last;k++){ const c = x.cells[k]; acc += c ? c.pts : 0; pts.push(acc); }
    const t = kind==='teams' ? x : teamOf(s, x.teamId);
    return {id:x.id, name:x.name, player:x.player, color:(t && t.color) || '#888', teamId:kind==='teams' ? x.id : x.teamId, pts, total:x.pts, pos}; })};
}
function champChart(s, st, kind){
  const D = champSeries(s, st, kind); if(!D || D.last < 1) return '';
  const N = kind==='teams' ? 10 : 8;
  let lines = D.lines.filter((l,i)=>i < N || l.player);
  const seenTeam = {}; lines.forEach(l=>{ l.dash = !!seenTeam[l.teamId]; seenTeam[l.teamId] = true; });
  const W = 900, H = 340, pl = 42, pr = 150, pt = 14, pb = 34;
  const maxY = Math.max(10, ...lines.map(l=>l.total)), n = D.last + 1;
  const X = k => pl + (n===1 ? 0 : k*(W-pl-pr)/(n-1)), Y = v => pt + (H-pt-pb)*(1 - v/maxY);
  const step = maxY > 400 ? 100 : maxY > 200 ? 50 : maxY > 80 ? 20 : 10;
  let grid = '';
  for(let v=0; v<=maxY; v+=step) grid += `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" class="cg-grid"/><text x="${pl-6}" y="${Y(v)}" class="cg-y">${v}</text>`;
  const every = n > 16 ? 2 : 1;
  for(let k=0;k<n;k++) if(k % every === 0 || k===n-1){ const t = trackById(s.rounds[k].trackId); grid += `<text x="${X(k)}" y="${H-pb+16}" class="cg-x"><title>${esc(t?gpName(t):'')}</title>${k+1}</text>`; }
  // popisky na konci čar bez překrývání
  const ends = lines.map(l=>({l, y:Y(l.total)})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++) if(ends[i].y - ends[i-1].y < 13) ends[i].y = ends[i-1].y + 13;
  const paths = lines.map(l=>`<polyline class="cg-line${l.player?' me':''}" style="stroke:${l.color}"${l.dash?' stroke-dasharray="6 4"':''} points="${l.pts.map((v,k)=>`${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}"><title>${esc(l.name)}: ${l.total} ${L('b.','pts')}</title></polyline>`).join('');
  const labels = ends.map(({l,y})=>`<text x="${W-pr+8}" y="${y}" class="cg-lab${l.player?' me':''}"><tspan style="fill:${l.color}">●</tspan> ${esc(kind==='teams' ? l.name : shortName(l.name))} <tspan class="cg-pts">${l.total}</tspan></text>`).join('');
  return `<div class="panel chart-panel"><h2>${kind==='teams' ? L('Vývoj poháru konstruktérů','Constructors’ title race') : L('Vývoj šampionátu','Title race')}</h2>
    <svg class="champ-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Body po jednotlivých závodech','Points after each round')}">${grid}${paths}${labels}</svg>
    <p class="muted cg-note">${kind==='teams' ? '' : L(`Prvních ${N} jezdců${lines.some((l,i)=>l.player && l.pos>=N)?' a ty':''}. `, `Top ${N} drivers${lines.some((l,i)=>l.player && l.pos>=N)?' and you':''}. `)}${L('Přerušovaně je druhý jezdec stejného týmu. Osa X = číslo závodu.','A dashed line is the second car of the same team. X axis = round number.')}</p></div>`;
}

const IMG_FONT = '"Titillium Web","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif';
function loadImg(src){ return new Promise(res=>{ if(!src) return res(null); const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>res(null); i.src = src; }); }
async function drawCard(o){
  const W = 1200, rowH = 46, headH = 150, colsH = 34, footH = 64;
  const H = headH + colsH + o.rows.length*rowH + footH;
  const cv = document.createElement('canvas'); cv.width = W*2; cv.height = H*2; const g = cv.getContext('2d'); g.scale(2,2);
  try{ await document.fonts.ready; }catch{}
  const logo = await loadImg(LOGO);
  const imgs = await Promise.all(o.rows.map(r=>loadImg(r.logo)));
  g.fillStyle = '#0B0D12'; g.fillRect(0,0,W,H);
  g.fillStyle = '#E10600'; g.fillRect(0,0,W,6);
  g.fillStyle = '#E10600'; g.beginPath(); g.moveTo(48,58); g.lineTo(60,58); g.lineTo(52,96); g.lineTo(40,96); g.closePath(); g.fill();
  g.fillStyle = '#FFFFFF'; g.font = `italic 800 40px ${IMG_FONT}`; g.textBaseline = 'alphabetic'; g.fillText(o.title, 72, 92);
  g.fillStyle = '#9AA3B2'; g.font = `600 20px ${IMG_FONT}`; g.fillText(o.sub, 72, 124);

  cols.forEach(c=>{ g.textAlign = c.align || 'left'; g.fillText(c.label.toUpperCase(), c.x, headH + 22); });
  o.rows.forEach((r,i)=>{
    const y = headH + colsH + i*rowH;
    g.fillStyle = r.hl ? 'rgba(225,6,0,.16)' : (i%2 ? '#10131A' : '#0D1016'); g.fillRect(32, y, W-64, rowH-4);
    if(r.color){ g.fillStyle = r.color; g.fillRect(32, y, 6, rowH-4); }
    const cy = y + rowH/2 + 5;
    r.cells.forEach((v,k)=>{ const c = cols[k]; if(v==null || v==='') return;
      g.textAlign = c.align || 'left';
      const podium = !o.plain && k===0 && typeof v==='number' && v<=3;
      g.fillStyle = c.muted ? '#9AA3B2' : podium ? ['#FFC906','#D9DDE3','#E09A5B'][v-1] : '#F1F3F6';
      g.font = `${c.bold?800:600} ${c.size||20}px ${IMG_FONT}`;
      let x = c.x;
      if(c.logo && imgs[i]){ const im = imgs[i], s = 28, k2 = Math.min(s/im.naturalWidth, s/im.naturalHeight); g.drawImage(im, x, y + (rowH-4-im.naturalHeight*k2)/2, im.naturalWidth*k2, im.naturalHeight*k2); x += 38; }
      let txt = String(v); const maxW = c.w || 9999;
      while(g.measureText(txt).width > maxW && txt.length > 3) txt = txt.slice(0,-2) + '…';
      g.fillText(txt, x, cy);
    });
  });
  const fy = H - footH + 22;
  if(logo) g.drawImage(logo, 40, fy - 4, 30, 30);
  g.textAlign = 'left'; g.fillStyle = '#C9CED8'; g.font = `700 17px ${IMG_FONT}`; g.fillText('F1 Season Tracker', 80, fy + 17);
  g.textAlign = 'right'; g.fillStyle = '#6E7788'; g.font = `600 15px ${IMG_FONT}`; g.fillText(o.foot || '', W-40, fy + 17);
  return cv;
}

/* ---------- příběh sezóny ---------- */
function seasonStory(s){
  const c = getCareer(), sc = scoringOf(s);
  const key = d => slug(d.name);
  // historie z předchozích sezón kariéry
  const prior = {win:new Set(), pod:new Set(), pole:new Set()};
  const before = c.seasons.filter(x=>x.year < s.year);
  before.forEach(x=>x.rounds.forEach(r=>{ const S = r.s.race;
    Object.entries(S.res).forEach(([id,e])=>{ const d = drvOf(x,id); if(!d || !hasRes(e) || e.status) return; if(e.pos===1) prior.win.add(key(d)); if(e.pos<=3) prior.pod.add(key(d)); });
    if(S.pole){ const d = drvOf(x, S.pole); if(d) prior.pole.add(key(d)); } }));
  const real = (d, k) => { const p = PROFILES[profKey(d.name)]; return p && p.f1 && p.f1.b && (+p.f1.b[k] || 0) > 0; };
  const maxRound = r => (+sc.race[0]||0) + (+sc.pole||0) + (+sc.fl||0) + (r.sprint ? (+sc.sprint[0]||0) : 0);
  const out = []; let prevLead = null, prevTeamLead = null, clinched = false, tClinched = false; const streak = {}, winners = new Set(), winnersSeen = new Set(), myBest = {}, myPts = {};
  s.rounds.forEach((r,i)=>{
    const done = roundHasData(r); const t = trackById(r.trackId);
    const item = {i, r, t, done, ev:[], note:r.note||''};
    if(done){
      const S = r.s.race, res = Object.entries(S.res).filter(([,e])=>hasRes(e)).map(([id,e])=>({id, e, d:drvOf(s,id)})).filter(x=>x.d);
      const win = res.find(x=>x.e.pos===1 && !x.e.status);
      const Q = r.q && r.q.quali;
      if(win){
        const tm = teamOf(s, win.e.teamId || win.d.teamId);
        item.head = L(`${win.d.name} vyhrál${tm?` za ${tm.name}`:''}`, `${win.d.name} won${tm?` for ${tm.name}`:''}`);
        const k = key(win.d);
        if(!prior.win.has(k) && !real(win.d,'wins')) item.ev.push(['first', L(`První výhra v kariéře: ${win.d.name}`, `First career win for ${win.d.name}`)]);
        prior.win.add(k);
        if(S.pole===win.id && S.fl===win.id) item.ev.push(['star', L(`Hattrick: pole, výhra i nejrychlejší kolo (${win.d.name})`, `Hat-trick: pole, win and fastest lap (${win.d.name})`)]);
        const g = Q && Q.res[win.id] && Q.res[win.id].pos;
        if(g && g >= 8) item.ev.push(['up', L(`${win.d.name} vyhrál z ${g}. místa na startu`, `${win.d.name} won from ${g}th on the grid`)]);
        const second = res.find(x=>x.e.pos===2 && !x.e.status);
        if(second && tm && (second.e.teamId || second.d.teamId) === (win.e.teamId || win.d.teamId)) item.ev.push(['double', L(`Double týmu ${tm.name}: ${win.d.name} před ${second.d.name}`, `One-two for ${tm.name}: ${win.d.name} ahead of ${second.d.name}`)]);
        winners.add(k); if(winners.size >= 3 && !winnersSeen.has(k)) item.ev.push(['first', L(`${winners.size}. různý vítěz sezóny`, `${winners.size} different winners this season`)]);
        winnersSeen.add(k);
      } else item.head = L('Výsledky zadány','Results entered');
      if(S.pole){ const pr = res.find(x=>x.id===S.pole); if(pr && pr.e.status==='DNF') item.ev.push(['dnf', L(`${pr.d.name} startoval z pole position, ale nedokončil`, `${pr.d.name} started from pole but retired`)]); }
      res.filter(x=>x.d.player && !x.e.status && x.e.pos).forEach(x=>{ const k = 'me:'+key(x.d), b = myBest[k];
        if(b && x.e.pos < b) item.ev.push(['me', L(`Tvůj nejlepší výsledek sezóny (${x.e.pos}.)`, `Your best result of the season (P${x.e.pos})`)]);
        const p = sessPts(s, 'race', x.e, S.fl===x.id, S.pole===x.id);
        if(p > 0 && !myPts[k]){ myPts[k] = 1; if(i > 0) item.ev.push(['me', L('První body sezóny','First points of the season')]); } else if(p > 0) myPts[k] = 1;
        myBest[k] = Math.min(b || 99, x.e.pos); });
      // série výher
      Object.keys(streak).forEach(k=>{ if(!win || key(win.d)!==k) streak[k] = 0; });
      if(win){ const k = key(win.d); streak[k] = (streak[k]||0) + 1; if(streak[k] >= 3) item.ev.push(['fire', L(`${win.d.name}: ${streak[k]}. výhra v řadě`, `${win.d.name}: ${streak[k]} wins in a row`)]); }
      res.filter(x=>!x.e.status && x.e.pos<=3).forEach(x=>{ const k = key(x.d);
        if(x.e.pos>1 && !prior.pod.has(k) && !real(x.d,'pod')) item.ev.push(['first', L(`První pódium v kariéře: ${x.d.name} (${x.e.pos}.)`, `First career podium for ${x.d.name} (P${x.e.pos})`)]);
        prior.pod.add(k);
        const g = Q && Q.res[x.id] && Q.res[x.id].pos;
        if(x.e.pos>1 && g && g >= 10) item.ev.push(['up', L(`${x.d.name} dojel na pódiu z ${g}. místa na startu`, `${x.d.name} reached the podium from ${g}th on the grid`)]); });
      if(S.pole){ const d = drvOf(s, S.pole); if(d){ const k = key(d); if(!prior.pole.has(k) && !real(d,'poles')) item.ev.push(['first', L(`První pole position v kariéře: ${d.name}`, `First career pole for ${d.name}`)]); prior.pole.add(k); } }
      res.filter(x=>x.d.player).forEach(x=>{ if(!win || win.id!==x.id) item.ev.push(['me', x.e.status ? L(`Ty: ${x.e.status}`, `You: ${x.e.status}`) : L(`Ty: ${x.e.pos}. místo`, `You: P${x.e.pos}`)]); else item.ev.push(['me', L('Vyhrál jsi!','You won!')]); });
      if((S.inc||[]).some(x=>x.t==='red')) item.ev.push(['flag', L('Závod přerušila červená vlajka','The race was red-flagged')]);
      else { const n = (S.inc||[]).filter(x=>x.t==='sc').length; if(n >= 2) item.ev.push(['flag', L(`${n}× safety car`, `${n} safety cars`)]); }
      if(S.weather==='wet') item.ev.push(['rain', L('Mokrý závod','Wet race')]); else if(S.weather==='mixed') item.ev.push(['rain', L('Proměnlivé počasí','Changing conditions')]);
      if(r.sprint){ const sw = Object.entries(r.s.sprint.res).find(([,e])=>e.pos===1 && !e.status); const sd = sw ? drvOf(s, sw[0]) : null; if(sd) item.ev.push(['sprint', L(`Sprint vyhrál ${sd.name}`, `${sd.name} won the sprint`)]); }
      // šampionát
      const st = compute(s, i), ld = st.drivers[0], nd = st.drivers[1];
      const leaderDnf = prevLead && res.find(x=>x.id===prevLead && x.e.status==='DNF');
      if(leaderDnf) item.ev.push(['dnf', L(`Lídr šampionátu ${leaderDnf.d.name} nedokončil`, `Championship leader ${leaderDnf.d.name} retired`)]);
      if(ld && ld.pts > 0 && prevLead && prevLead !== ld.id) item.ev.push(['lead', L(`${ld.name} se dostal do čela šampionátu`, `${ld.name} takes the championship lead`)]);
      const tl = st.teams[0]; if(tl && tl.pts > 0 && prevTeamLead && prevTeamLead !== tl.id) item.ev.push(['lead', L(`${tl.name} vede pohár konstruktérů`, `${tl.name} lead the Constructors’ championship`)]);
      const remain = s.rounds.slice(i+1).reduce((a,x)=>a + maxRound(x), 0);
      if(!clinched && ld && nd && ld.pts - nd.pts > remain){ clinched = true; item.ev.push(['crown', remain ? L(`${ld.name} má titul mistra jistý (náskok ${ld.pts-nd.pts} b.)`, `${ld.name} clinches the title (${ld.pts-nd.pts} pts clear)`) : L(`${ld.name} je mistr světa ${s.year}!`, `${ld.name} is the ${s.year} champion!`)]); }

function hallData(careers){
  careers = careers || state.careers;
  const A = new Map(), TM = new Map(), champs = [], rec = {wins:null, pts:null, poles:null, margin:null, podiums:null};
  const me = {titles:0, wins:0, podiums:0, poles:0, starts:0, pts:0, seasons:0, best:null};
  careers.forEach(c=>c.seasons.forEach(s=>{
    if(!s.rounds.some(roundHasData)) return;
    const st = compute(s), fin = s.rounds.every(roundHasData);
    const ch = st.drivers[0], tc = st.teams[0];
    if(ch) champs.push({c, s, d:ch, t:tc, fin, gap: st.drivers[1] ? ch.pts - st.drivers[1].pts : ch.pts, dt:teamOf(s, ch.teamId)});
    st.teams.forEach((t,i)=>{ if(!t.has) return; const k = slug(t.name);
      const a = TM.get(k) || {name:t.name, color:t.color, titles:0, wins:0, pts:0}; a.pts += t.pts; if(i===0 && fin) a.titles++; TM.set(k, a); });
    st.drivers.forEach((d,i)=>{ if(!d.has) return; const k = slug(d.name);
      const a = A.get(k) || {name:d.name, titles:0, wins:0, podiums:0, poles:0, starts:0, pts:0, seasons:0, careers:new Set(), player:false};
      a.wins += d.wins; a.podiums += d.podiums; a.poles += d.poles; a.starts += d.starts; a.pts += d.pts; a.seasons++; a.careers.add(c.id); if(d.player) a.player = true;
      if(i===0 && fin) a.titles++;
      A.set(k, a);
      const t = teamOf(s, d.teamId); if(t && d.wins){ const tk = TM.get(slug(t.name)); if(tk) tk.wins += d.wins; }
      const R = {name:d.name, c, s, t};
      ['wins','pts','poles','podiums'].forEach(f=>{ if(!rec[f] || d[f] > rec[f].v) rec[f] = {...R, v:d[f]}; });
      if(d.player){ me.wins += d.wins; me.podiums += d.podiums; me.poles += d.poles; me.starts += d.starts; me.pts += d.pts; me.seasons++; if(i===0 && fin) me.titles++;
        if(!me.best || i+1 < me.best.pos) me.best = {pos:i+1, c, s}; }
    });
    if(ch && fin && st.drivers[1]){ const g = ch.pts - st.drivers[1].pts; if(!rec.margin || g > rec.margin.v) rec.margin = {name:ch.name, c, s, v:g}; }
  }));
  const all = [...A.values()].sort((a,b)=>b.titles-a.titles || b.wins-a.wins || b.podiums-a.podiums || b.pts-a.pts);
  const teams = [...TM.values()].sort((a,b)=>b.titles-a.titles || b.wins-a.wins || b.pts-a.pts);
  return {all, teams, champs, rec, me};
}

function bumpChart(s){
  const done = s.rounds.map(roundHasData), last = done.lastIndexOf(true); if(last < 1) return '';
  const fin = compute(s), top = fin.drivers.filter(d=>d.has).slice(0, 10).map(d=>d.id);
  fin.drivers.filter(d=>d.player && !top.includes(d.id)).forEach(d=>top.push(d.id));
  const ranks = {}; top.forEach(id=>ranks[id] = []);
  for(let k=0;k<=last;k++){ const st = compute(s, k); st.drivers.forEach((d,i)=>{ if(ranks[d.id]) ranks[d.id].push(i+1); }); }
  const nPos = Math.max(10, ...Object.values(ranks).flat());
  const W = 900, H = 330, pl = 34, pr = 150, pt = 12, pb = 30, n = last + 1;
  const X = k => pl + k*(W-pl-pr)/(n-1), Y = p => pt + (p-1)*(H-pt-pb)/(nPos-1);
  let g = '';
  for(let p=1;p<=nPos;p++) if(p===1 || p%5===0 || p===nPos) g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(p)}" y2="${Y(p)}" class="cg-grid"/><text x="${pl-6}" y="${Y(p)}" class="cg-y">${p}.</text>`;
  for(let k=0;k<n;k++) if(n<=16 || k%2===0 || k===n-1) g += `<text x="${X(k)}" y="${H-pb+16}" class="cg-x">${k+1}</text>`;
  const seen = {};
  const lines = top.map(id=>{ const d = fin.drivers.find(x=>x.id===id), t = teamOf(s, d.teamId), dash = seen[d.teamId]; seen[d.teamId] = 1; const R = ranks[id];
    return `<polyline class="cg-line${d.player?' me':''}" style="stroke:${t?t.color:'#888'}"${dash?' stroke-dasharray="6 4"':''} points="${R.map((p,k)=>`${X(k).toFixed(1)},${Y(p).toFixed(1)}`).join(' ')}"><title>${esc(d.name)}</title></polyline>
      <text x="${W-pr+8}" y="${Y(R[R.length-1])}" class="cg-lab${d.player?' me':''}"><tspan style="fill:${t?t.color:'#888'}">●</tspan> ${R[R.length-1]}. ${esc(shortName(d.name))}</text>`; }).join('');
  return `<div class="panel chart-panel"><h2>${L('Pozice v šampionátu po závodech','Championship position after each round')}</h2><svg class="champ-chart" viewBox="0 0 ${W} ${H}" role="img">${g}${lines}</svg>

}

  const sc = scoringOf(s), fin = done === n, out = [];

  if(fin) out.push(L(`Mistrem světa ${s.year} se stal <b>${esc(d1.name)}</b> s ${d1.pts} body${d2?`, druhý ${esc(d2.name)} ztratil ${d1.pts-d2.pts} b.`:'.'}`, `<b>${esc(d1.name)}</b> is the ${s.year} champion with ${d1.pts} points${d2?`, ${d1.pts-d2.pts} ahead of ${esc(d2.name)}`:''}.`));

  if(winners.length) out.push(L(`${winners.length===1 ? 'Vyhrál zatím jen jeden jezdec' : winners.length<=4 ? `Vyhráli ${winners.length} různí jezdci` : `Vyhrálo ${winners.length} různých jezdců`}, nejvíc výher má ${esc(winners[0].name)} (${winners[0].wins}).`, `${winners.length===1 ? 'Only one driver has won so far' : `${winners.length} different drivers have won`}; ${esc(winners[0].name)} has the most wins (${winners[0].wins}).`));
  const poles = st.drivers.filter(d=>d.poles).sort((a,b)=>b.poles-a.poles);
  if(poles.length) out.push(L(`Nejvíc pole position: ${esc(poles[0].name)} (${poles[0].poles}).`, `Most poles: ${esc(poles[0].name)} (${poles[0].poles}).`));
  if(t1 && t1.pts) out.push(fin ? L(`Pohár konstruktérů získal ${esc(t1.name)}${t2?`, druhý skončil ${esc(t2.name)}`:''}.`, `${esc(t1.name)} won the Constructors’ title${t2?` ahead of ${esc(t2.name)}`:''}.`)
    : L(`V poháru konstruktérů vede ${esc(t1.name)}${t2?`, druhý ${esc(t2.name)} ztrácí ${t1.pts-t2.pts} b.`:'.'}`, `${esc(t1.name)} lead the Constructors’ championship${t2?`, ${t1.pts-t2.pts} pts ahead of ${esc(t2.name)}`:''}.`));
  const myT = st.teams.find(t=>t.player && t.has);
  if(myT){ const tp = st.teams.indexOf(myT) + 1; out.push(L(`Tvůj tým ${esc(myT.name)} je ${fin?'na konci':'aktuálně'} <b>${tp}.</b> v poháru konstruktérů s ${myT.pts} body.`, `Your team ${esc(myT.name)} ${fin?'finished':'is'} <b>P${tp}</b> in the Constructors’ championship with ${myT.pts} points.`)); }

    let ptsR = 0, bestR = null; s.rounds.forEach((r,k)=>{ const c = me.cells[k]; if(c && c.pts > 0) ptsR++; if(c && c.pos && !c.status && (!bestR || c.pos < bestR.pos)) bestR = {pos:c.pos, r}; });
    const bt = bestR && trackById(bestR.r.trackId);
    let txt = L(`Ty jsi ${fin?'skončil':'aktuálně'} <b>${pos}.</b> s ${me.pts} body`, `You ${fin?'finished':'are'} <b>P${pos}</b> with ${me.pts} points`);
    if(bestR) txt += L(`, nejlepší výsledek ${bestR.pos}. místo${bt?` (${esc(gpName(bt))})`:''}`, `, best result P${bestR.pos}${bt?` (${esc(gpName(bt))})`:''}`);
    txt += L(`. Body jsi bral v ${ptsR} z ${done} závodů.`, `. You scored in ${ptsR} of ${done} races.`);
    const mate = st.drivers.find(d=>d.id!==me.id && d.teamId && d.teamId===me.teamId);
    if(mate) txt += ' ' + L(`Souboj s týmovým kolegou (${esc(mate.name)}) je zatím ${me.pts}:${mate.pts} ${me.pts>=mate.pts?'pro tebe':'pro něj'}.`, `Against your teammate ${esc(mate.name)} it’s ${me.pts}–${mate.pts}.`);
    out.push(txt); }
  if(!fin){ const left = s.rounds.slice(done).filter(r=>!roundHasData(r));
    const max = left.reduce((a,r)=>a + (+sc.race[0]||0) + (+sc.pole||0) + (+sc.fl||0) + (r.sprint ? (+sc.sprint[0]||0) : 0), 0);
    if(left.length) out.push(L(`Zbývá ${left.length} ${P(left.length,'závod','závody','závodů','','')} a ve hře je ještě až ${max} bodů.`, `${left.length} ${P(left.length,'','','','race','races')} to go, with up to ${max} points still available.`)); }
  return out;
}

function playerKey(s){ const d = s.drivers.find(x=>x.player); return d ? slug(d.name) : null; }

    const row = {s, fin, ch:st.drivers[0], cc:st.teams[0], me, pos: me ? st.drivers.indexOf(me)+1 : 0, team: me ? teamOf(s, me.teamId) : myT, myT, tPos};
    rows.push(row);
    if(me){ tot.wins += me.wins; tot.podiums += me.podiums; tot.poles += me.poles; tot.starts += me.starts; tot.pts += me.pts; if(fin && row.pos===1) tot.titles++;
      if(row.team){ const last = teams[teams.length-1]; if(last && last.name===row.team.name) last.to = s.year; else teams.push({name:row.team.name, from:s.year, to:s.year}); }
      s.rounds.forEach(r=>{ const S = r.s.race, e = S.res[me.id]; const t = trackById(r.trackId);
        if(e && hasRes(e) && !e.status){ if(e.pos===1 && !firsts.win) firsts.win = {y:s.year, t}; if(e.pos<=3 && !firsts.pod) firsts.pod = {y:s.year, t}; if(e.pos<=10 && (+scoringOf(s).race[e.pos-1]||0) && !firsts.pts) firsts.pts = {y:s.year, t}; }
        if(S.pole===me.id && !firsts.pole) firsts.pole = {y:s.year, t}; }); }
    if(myT && c.mode==='myteam' && fin && tPos===1) tot.tTitles++;
    if(myT){ const tst = st.teams.find(t=>t.id===myT.id); tt.seasons++; tt.name = myT.name; if(tst) tt.pts += tst.pts; if(fin && tPos===1) tt.titles++;
      if(tPos && (!tt.best || tPos < tt.best.pos)) tt.best = {pos:tPos, y:s.year};
      s.rounds.forEach(r=>{ if(!roundHasData(r)) return; const S = r.s.race; const tOf = id=>{ const e = S.res[id], d = drvOf(s, id); return (e && e.teamId) || (d && d.teamId); };
        const fins = Object.entries(S.res).filter(([,e])=>hasRes(e) && !e.status && e.pos);

  const P1 = [];

  if(c.mode==='myteam' && rows[0].myT){ const T = tt, dn = [...new Set(rows.flatMap(r=>r.s.drivers.filter(d=>d.teamId===r.myT.id).map(d=>d.name)))];
    P1.push(L(`Tým <b>${esc(T.name)}</b> vstoupil do šampionátu v roce ${y0}${dn.length?` (jezdci: ${dn.map(esc).join(', ')})`:''}. Za ${nS} ${P(nS,'sezónu','sezóny','sezón','','')} získal ${T.wins} ${P(T.wins,'výhru','výhry','výher','','')}, ${T.podiums} ${P(T.podiums,'pódium','pódia','pódií','','')} a ${fmtNum(T.pts)} bodů${T.oneTwo?`, z toho ${T.oneTwo}× double`:''}.`,

  const fl = [ff(firsts.pts,'První body','First points','přišly'), ff(firsts.pod,'První pódium','First podium','přišlo'), ff(firsts.win,'První výhra','First win','přišla'), ff(firsts.pole,'První pole position','First pole','přišla')].filter(Boolean);

  if(c.mode==='myteam' && rows[0].myT){ const bestT = rows.filter(r=>r.tPos).sort((a,b)=>a.tPos-b.tPos)[0];
    if(bestT) P1.push(tot.tTitles ? L(`Tým má ${tot.tTitles}× pohár konstruktérů.`, `The team has ${tot.tTitles} Constructors’ ${tot.tTitles===1?'title':'titles'}.`) : L(`Nejlepší umístění týmu v poháru konstruktérů: ${bestT.tPos}. místo (${bestT.s.year}).`, `The team’s best Constructors’ finish: P${bestT.tPos} (${bestT.s.year}).`)); }
  if(rows.some(r=>!r.fin)) P1.push(L(`Sezóna ${y1} pořád probíhá.`, `The ${y1} season is still under way.`));

}

function calFromChoice(v, n, prev){
  if(v === 'copy' && prev && prev.rounds.length) return sample(prev.rounds.map(r=>({trackId:r.trackId, sprint:r.sprint})), n);

/* ---------- přehled kariéry ---------- */
function viewOverview(c){
  const seasons = [...c.seasons].sort((a,b)=>a.year-b.year);
  if(!seasons.length) return `<div class="panel"><h3>${L('Kariéra nemá žádnou sezónu','This career has no seasons')}</h3><button class="btn primary" data-act="newSeason">${L('Přidat sezónu','Add season')}</button></div>`;
  const hof = new Map();
  const place = (i, pts) => L(`${i}. místo, ${ptsTxt(pts)}`, `P${i}, ${ptsTxt(pts)}`);
  const rows = seasons.map(s=>{
    const st = compute(s);
    const done = s.rounds.filter(roundHasData).length, total = s.rounds.length, fin = total && done===total;
    const ch = st.drivers[0], tc = st.teams[0];
    st.drivers.filter(d=>d.has).forEach((d,i)=>{
      const h = hof.get(d.id) || {name:d.name, seasons:0, starts:0, wins:0, podiums:0, poles:0, fls:0, pts:0, titles:0, player:false};
      h.name = d.name; h.seasons++; h.starts += d.starts; h.wins += d.wins; h.podiums += d.podiums; h.poles += d.poles; h.fls += d.fls; h.pts += d.pts;
      if(d.player) h.player = true;
      if(i===0 && fin && d.pts) h.titles++;
      hof.set(d.id, h);
    });
    const me = [...st.drivers.map((d,i)=>d.player && d.has ? `${esc(d.name)}: ${place(i+1, d.pts)}` : null),
                ...st.teams.map((t,i)=>t.player && t.has ? `${esc(t.name)}: ${place(i+1, t.pts)}` : null)].filter(Boolean).join('<br>');
    return `<tr><td><button class="link" data-act="openSeason" data-id="${s.id}">${s.year}</button></td><td>${s.series}</td><td class="num">${done} / ${total}</td>
      <td>${ch && ch.pts ? esc(ch.name) + ` <span class="muted">${ptsTxt(ch.pts)}${fin?'':L(', vede',', leading')}</span>` : '—'}</td>
      <td>${tc && tc.pts ? `<span class="ts" style="--tc:${tc.color}"></span>${esc(tc.name)} <span class="muted">${ptsTxt(tc.pts)}</span>` : '—'}</td>
      <td>${me || '<span class="muted">—</span>'}</td></tr>`;
  }).join('');
  const hl = [...hof.values()].sort((a,b)=>b.titles-a.titles || b.wins-a.wins || b.pts-a.pts).slice(0, 30);
  return `<div class="panel"><h2>${L('Sezóny','Seasons')}</h2><div class="scroll"><table><thead><tr><th>${L('Rok','Year')}</th><th>${L('Série','Series')}</th><th class="num">${L('Závody','Races')}</th><th>${L('Mistr světa','Champion')}</th><th>${L('Pohár konstruktérů','Constructors’ title')}</th><th>${L('Já / můj tým','Me / my team')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="panel"><h2>${L('Síň slávy kariéry','Career hall of fame')}</h2>${hl.length ? `<div class="scroll"><table><thead><tr><th>${L('Jezdec','Driver')}</th><th class="num">${L('Tituly','Titles')}</th><th class="num">${L('Sezóny','Seasons')}</th><th class="num">${L('Starty','Starts')}</th><th class="num">${L('Výhry','Wins')}</th><th class="num">${L('Pódia','Podiums')}</th><th class="num">Pole</th><th class="num">${L('NK','FL')}</th><th class="num">${L('Body celkem','Total points')}</th></tr></thead>
    <tbody>${hl.map(h=>`<tr class="${h.player?'is-player':''}"><td class="name">${esc(h.name)}</td><td class="num"><b>${h.titles}</b></td><td class="num">${h.seasons}</td><td class="num">${h.starts}</td><td class="num">${h.wins}</td><td class="num">${h.podiums}</td><td class="num">${h.poles}</td><td class="num">${h.fls}</td><td class="num">${h.pts}</td></tr>`).join('')}</tbody></table></div>`
      : `<p class="muted">${L('Statistiky se objeví po prvních zadaných závodech.','Stats appear once the first races are entered.')}</p>`}</div>`;
}

const dlg = $('#dlg'), dlgForm = $('#dlgForm');
let dlgHandler = null;
function openDialog(title, body, onOk, okLabel, extra=''){

  dlgHandler = onOk; dlgForm.onchange = null; dlg.classList.remove('wide');
  dlg.showModal();
  const f = dlgForm.querySelector('.dlg-body input:not([type=radio]):not([type=checkbox]), .dlg-body select, .dlg-body textarea'); if(f) f.focus();
}
function dlgError(msg){ const e = $('#dlgErr'); e.textContent = msg; e.hidden = false; return false; }
dlgForm.addEventListener('submit', e=>{

function dlgTrack(id){
  const t0 = id ? state.customTracks.find(t=>t.id===id) : null; if(id && !t0) return;
  const v = k => esc(t0 && t0[k] != null ? String(t0[k]) : '');
  const lenKm = t0 && t0.len ? (t0.len/1000).toLocaleString(isEN()?'en-GB':'cs-CZ',{minimumFractionDigits:3, maximumFractionDigits:3}) : '';

    <label>${L('Velká cena','Grand Prix')} <input name="name" required value="${v('name')}" placeholder="${L('Např. Velká cena Toskánska','e.g. Tuscan GP')}"></label>

  fd=>{ const n = String(fd.get('name')||'').trim(); if(!n) return dlgError(L('Zadej název velké ceny.','Enter the Grand Prix name.'));

    if(lenS && !(km > 0.3 && km < 30)) return dlgError(L('Délku zadej v km, třeba 5,245.','Enter the length in km, e.g. 5.245.'));
    const t = t0 || {id:'c-'+uid(), g:'custom'};
    t.name = n; t.c = String(fd.get('c')||'').trim(); t.city = String(fd.get('city')||'').trim(); t.cc = String(fd.get('cc')||'');
    t.code = (String(fd.get('code')||'').trim() || (t.city || t.c || n).replace(/[^\p{L}]/gu,'').slice(0,3)).toUpperCase();
    if(km) t.len = Math.round(km*1000); else delete t.len;
    const lp = parseInt(fd.get('laps'),10); if(lp > 0) t.laps = lp; else delete t.laps;
    const im = String(fd.get('img')||''); if(im === 'del') delete t.img; else if(im) t.img = im;
    ['c','city','cc'].forEach(k=>{ if(!t[k]) delete t[k]; });
    if(!t0){ state.customTracks.push(t);
      const s = getSeason(); const r = s && s.rounds.find(x=>x.id===ui.roundId);
      if(r && ui.view==='races' && !r.trackId) r.trackId = t.id; }
    toast(t0 ? L('Trať uložena','Track saved') : L('Trať přidána','Track added'));
  }, t0 ? L('Uložit','Save') : L('Přidat trať','Add track'));
  dlgForm.querySelector('[data-trimg="pick"]').onclick = ()=> pickTrackImage(src=>{ dlgForm.querySelector('[name=img]').value = src; dlgForm.querySelector('.trimg-prev').innerHTML = prev(src); bindDel(); });
  const bindDel = ()=>{ const b = dlgForm.querySelector('[data-trimg="del"]'); if(b) b.onclick = ()=>{ dlgForm.querySelector('[name=img]').value = 'del'; dlgForm.querySelector('.trimg-prev').innerHTML = prev(''); }; };
  bindDel();
}
function pickTrackImage(done){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png,image/jpeg,image/webp';
  inp.onchange = ()=>{ const f = inp.files && inp.files[0]; if(!f) return;
    if(f.size > 15*1024*1024){ toast(L('Obrázek je moc velký (max. 15 MB)','The image is too big (max 15 MB)')); return; }
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = ()=>{ const k = Math.min(1000/img.naturalWidth, 700/img.naturalHeight, 1) || 1;
      const w = Math.max(1, Math.round(img.naturalWidth*k)), h = Math.max(1, Math.round(img.naturalHeight*k));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      done(f.type==='image/png' ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.88)); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); toast(L('Tenhle obrázek se nepodařilo načíst','Couldn’t read this image')); };
    img.src = url; };
  inp.click();
}

function curSession(){ const s = getSeason(); const r = s && s.rounds.find(x=>x.id===ui.roundId); if(!r) return null; return r.s[ui.session==='sprint' && r.sprint ? 'sprint' : 'race']; }
function entry(did, create=true){
  const S = curSession(); if(!S) return null;
  let e = S.res[did];
  if(!e && create){ const d = drvOf(getSeason(), did); e = S.res[did] = {pos:null, status:'', pits:'', tyres:[], teamId: d ? d.teamId : null}; }
  if(e){ e.tyres = e.tyres || []; if(!e.teamId){ const d = drvOf(getSeason(), did); if(d) e.teamId = d.teamId; } }
  return e;
}
function cleanEntry(did){ const S = curSession(); const e = S && S.res[did]; if(e && !e.pos && !e.status && (e.pits==='' || e.pits==null) && !(e.tyres||[]).length && !(e.pens||[]).length && !e.roadPos) delete S.res[did]; }
function qEntry(did){
  const r = curRound(); if(!r || !isQ(ui.session)) return null;
  const Q = getQ(r, ui.session);
  let e = Q.res[did];
  if(!e){ const d = drvOf(getSeason(), did); e = Q.res[did] = {pos:null, q1:'', q2:'', q3:'', t1:[], t2:[], t3:[], grid:'', teamId: d ? d.teamId : null}; }
  ['t1','t2','t3'].forEach(k=>{ e[k] = e[k] || []; });
  return e;
}
function qClean(did){ const r = curRound(); const Q = r && r.q && r.q[ui.session]; if(Q && Q.res[did] && !qHas(Q.res[did])) delete Q.res[did]; }
function autoPits(e){ if(e.pitsManual) return; e.pits = e.tyres.length > 1 ? String(e.tyres.length-1) : ''; }

  if(['openCareer','overview','openSeason','tab','newCareer','newSeason'].includes(el.dataset.act)){ ui.page = null; ui.cprof = null; }

document.addEventListener('toggle', e=>{ const d = e.target; if(d.classList && d.classList.contains('fa-group')){ if(d.open) ui.faOpen = d.dataset.g; else if(ui.faOpen===d.dataset.g) ui.faOpen = null; } }, true);
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-f]');
  if(!el || dlg.contains(el)) return;
  const f = el.dataset.f, s = getSeason();
  const val = el.type==='checkbox' ? el.checked : el.value;
  switch(f){
    case 'lang': ui.lang = val==='en' ? 'en' : 'cs'; break;
    case 'pos': { const S = curSession(); if(S) confirmPrefill(S); const e2 = entry(el.dataset.d); e2.pos = val ? parseInt(val,10) : null; cleanEntry(el.dataset.d); break; }
    case 'status': { const S = curSession(); if(S) confirmPrefill(S); const e2 = entry(el.dataset.d); e2.status = val; cleanEntry(el.dataset.d); break; }
    case 'weather': { const r = curRound(); if(!r) break; const T = isQ(ui.session) ? getQ(r, ui.session) : curSession(); if(T){ if(val==='dry') delete T.weather; else T.weather = val; } break; }
    case 'pits': { const e2 = entry(el.dataset.d); const n = val==='' ? '' : String(Math.max(0, Math.min(9, parseInt(val,10)||0))); e2.pits = n; e2.pitsManual = n !== ''; cleanEntry(el.dataset.d); break; }
    case 'qpos': { const r = curRound(); const e2 = qEntry(el.dataset.d); if(!e2) break; const old = e2.pos; e2.pos = val ? parseInt(val,10) : null;
      if(ui.session==='quali'){ const R = r.s.race; if(e2.pos===1) R.pole = el.dataset.d; else if(old===1 && R.pole===el.dataset.d) R.pole = null; }
      qClean(el.dataset.d); qSync(s, r, ui.session); break; }
    case 'qtime': { const e2 = qEntry(el.dataset.d); if(!e2) break; e2[el.dataset.seg] = String(val).trim(); qClean(el.dataset.d); qAutoFill(s, curRound(), ui.session); break; }
    case 'qtyre': { if(!val) return; const e2 = qEntry(el.dataset.d); if(!e2) break; if(qFmt(s, curRound())==='oneshot'){ e2[el.dataset.seg] = [val]; break; } if(e2[el.dataset.seg].length >= 6){ toast(L('Maximálně 6 sad','6 sets at most')); break; } e2[el.dataset.seg].push(val); break; }
    case 'qgrid': { const e2 = qEntry(el.dataset.d); if(!e2) break; e2.grid = val; qClean(el.dataset.d); qSync(s, curRound(), ui.session); break; }
    case 'sdist': s.dist = val; break;
    case 'sqfmt': s.qFormat = val; break;
    case 'rqfmt': { const r = curRound(); if(!r) break; if(val) r.qFormat = val; else delete r.qFormat; ['quali','squali'].forEach(k=>{ if(r.q && r.q[k]) qAutoFill(s, r, k); }); break; }
    case 'sdistlaps': { const n = parseInt(val,10); s.distLaps = n > 0 ? Math.min(200, n) : ''; break; }
    case 'rlaps': { const r = s.rounds.find(x=>x.id===ui.roundId); if(!r) break; const n = parseInt(val,10); const k = ui.session==='sprint' ? 'sLaps' : 'laps'; if(n > 0) r[k] = Math.min(200, n); else delete r[k]; break; }
    case 'mand': { const S = curSession(); if(S){ const n = parseInt(val,10); S.mand = val==='' || isNaN(n) ? '' : String(Math.max(0, Math.min(5, n))); } break; }
    case 'flTime': { const S = curSession(); if(S) S.flTime = String(val).trim(); break; }
    case 'rtrack': { const r = s.rounds.find(x=>x.id===ui.roundId); if(r) r.trackId = val || null; break; }
    case 'rsprint': { const r = s.rounds.find(x=>x.id===ui.roundId); if(r){ r.sprint = val; if(!val) ui.session = 'race'; } break; }
    case 'uisort': ui.sortByPos = val; break;
    case 'rnote': { const r = s && s.rounds.find(x=>x.id===el.dataset.id); if(r){ const v = String(val).trim(); if(v) r.note = v.slice(0, 2000); else delete r.note; } break; }
    case 'calPreset': { if(!val || s.rounds.some(r=>roundHasData(r) || roundHasQ(r))) break; applyCal(s, calFromChoice(val, s.rounds.length || 24)); toast(L('Kalendář nahrazen','Calendar replaced')); break; }
    case 'dname': { const d = drvOf(s, el.dataset.id); if(d && String(val).trim()) d.name = String(val).trim(); break; }
    case 'dteam': { const d = drvOf(s, el.dataset.id); const ret = val==='__retired'; const tv = ret ? '' : val;
      if(d && teamFull(s, tv, d.id)){ toast(fullMsg(s, tv)); break; }
      if(d){ const wasTeam = !!d.teamId; d.teamId = tv || null;
        if(ret) d.fa = 'retired'; else if(!tv && (wasTeam || d.fa==='retired' || !d.fa)) d.fa = 'free';
        toast(tv ? L(`${d.name} jede za ${teamOf(s,tv).name}`, `${d.name} now drives for ${teamOf(s,tv).name}`) : ret ? L(`${d.name} ukončil kariéru`, `${d.name} has retired`) : L(`${d.name} je volný jezdec`, `${d.name} is now a free agent`)); } break; }
    case 'dplayer': { const d = drvOf(s, el.dataset.id); if(d) d.player = val; break; }
    case 'tname': { const t = teamOf(s, el.dataset.id); if(t && String(val).trim()) t.name = String(val).trim(); break; }
    case 'tcolor': { const t = teamOf(s, el.dataset.id); if(t) t.color = val; break; }
    case 'tplayer': { const t = teamOf(s, el.dataset.id); if(t) t.player = val; break; }
    case 'syear': { const y = parseInt(val,10); const c = getCareer();
      if(!y) break; if(c.seasons.some(x=>x.id!==s.id && x.year===y)){ toast(L(`Sezóna ${y} už existuje`, `Season ${y} already exists`)); break; } s.year = y; break; }
    case 'sseries': s.series = val; break;
    case 'scPreset': if(val !== 'custom') s.scoring = presetScoring(val); break;
    case 'sc-race': case 'sc-sprint': { const sc = scoringOf(s); const k = f==='sc-race' ? 'race' : 'sprint'; const i = parseInt(el.dataset.i,10);
      sc[k] = [...sc[k]]; while(sc[k].length <= i) sc[k].push(0); sc[k][i] = Math.max(0, parseInt(val,10)||0);
      while(sc[k].length && !sc[k][sc[k].length-1]) sc[k].pop(); break; }
    case 'sc-pole': scoringOf(s).pole = Math.max(0, parseInt(val,10)||0); break;
    case 'sc-fl': scoringOf(s).fl = Math.max(0, parseInt(val,10)||0); break;
    case 'sc-flTop': scoringOf(s).flTop = val ? 10 : 0; break;
    case 'sc-flSprint': scoringOf(s).flSprint = val; break;
    case 'sstrat': s.showStrategy = val; break;
    default: return;
  }
  persist(); render();
});

/* ---------- 2.0: zpět / znovu ---------- */
const UNDO_MAX = 40;
let undoStack = [], redoStack = [], lastSnap = null;
const snapOf = () => { const u = state.ui; delete state.ui; const j = JSON.stringify(state); state.ui = u; return j; };
function undoTrack(){ const cur = snapOf(); if(lastSnap !== null && cur !== lastSnap){ undoStack.push(lastSnap); if(undoStack.length > UNDO_MAX) undoStack.shift(); redoStack = []; } lastSnap = cur; }
function undoApply(from, to, msg){
  if(saveTimer) flush();
  if(!from.length){ toast(msg[1]); return; }
  to.push(lastSnap); const prev = from.pop();
  const keep = {...ui}; state = migrate(JSON.parse(prev)); state.ui = keep; lastSnap = prev;
  if(!getCareer()) ui.careerId = null;
  const c = getCareer(); if(c && ui.seasonId && !c.seasons.some(x=>x.id===ui.seasonId)) ui.seasonId = null;
  saveRaw(); render(); toast(msg[0]);
}
const undo = () => undoApply(undoStack, redoStack, [L('Vráceno zpět','Undone'), L('Není co vrátit','Nothing to undo')]);
const redo = () => undoApply(redoStack, undoStack, [L('Znovu provedeno','Redone'), L('Není co zopakovat','Nothing to redo')]);
function saveRaw(){ state.ui = {...ui}; const json = JSON.stringify(state); try{ if(window.desktop) window.desktop.save(json); else localStorage.setItem(STORE_KEY, json); }catch(e){} }

let palEl = null;
function openPalette(){
  if(dlg.open) return;
  if(!palEl){ palEl = document.createElement('dialog'); palEl.className = 'palette'; document.body.appendChild(palEl);
    palEl.addEventListener('click', e=>{ if(e.target===palEl) palEl.close(); }); }
  const items = paletteItems(); let sel = 0, shown = [];
  palEl.innerHTML = `<input class="pal-in" placeholder="${L('Hledej kariéru, sezónu, závod, jezdce nebo akci…','Search careers, seasons, races, drivers or actions…')}" autocomplete="off" spellcheck="false"><div class="pal-list" role="listbox"></div>
    <div class="pal-foot"><span>↑↓ ${L('výběr','move')}</span><span>Enter ${L('otevřít','open')}</span><span>Esc ${L('zavřít','close')}</span></div>`;
  const inp = palEl.querySelector('.pal-in'), box = palEl.querySelector('.pal-list');
  const draw = () => {
    const q = norm(inp.value).split(/\s+/).filter(Boolean);
    shown = items.filter(x=>{ if(!q.length) return !x.low; const h = norm(x.t+' '+(x.sub||'')+' '+x.g); return q.every(w=>h.includes(w)); }).slice(0, 40);
    if(sel >= shown.length) sel = Math.max(0, shown.length-1);
    let g = '';
    box.innerHTML = shown.length ? shown.map((x,i)=>{ const head = x.g!==g ? `<div class="pal-g">${esc(x.g)}</div>` : ''; g = x.g;
      return `${head}<button type="button" class="pal-it" data-i="${i}" aria-selected="${i===sel}"><span class="pal-ic">${x.ic}</span><span class="pal-t">${esc(x.t)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</span>${x.k?`<kbd>${x.k}</kbd>`:''}</button>`; }).join('')
      : `<p class="muted pal-none">${L('Nic nenalezeno','Nothing found')}</p>`;
    const a = box.querySelector('[aria-selected=true]'); if(a) a.scrollIntoView({block:'nearest'});
  };
  const run = i => { const x = shown[i]; if(!x) return; palEl.close(); x.run(); };
  inp.oninput = () => { sel = 0; draw(); };
  inp.onkeydown = e => { if(e.key==='ArrowDown'){ sel = Math.min(shown.length-1, sel+1); draw(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ sel = Math.max(0, sel-1); draw(); e.preventDefault(); }
    else if(e.key==='Enter'){ run(sel); e.preventDefault(); } };
  box.onclick = e => { const b = e.target.closest('.pal-it'); if(b) run(+b.dataset.i); };
  draw(); palEl.showModal(); inp.focus();
}

const SHORTCUTS = () => [['⌘/Ctrl + K', L('Hledání a příkazy','Search & commands')], ['⌘/Ctrl + Z', L('Vrátit změnu','Undo')], ['⌘/Ctrl + Shift + Z', L('Znovu','Redo')],

/* ---------- 2.0: rychlé zadání výsledků ---------- */
function dlgQuick(preset, note){
  const s = getSeason(), r = curRound(); if(!s || !r) return;
  const q = isQ(ui.session), type = ui.session==='sprint' ? 'sprint' : 'race';
  const S = q ? getQ(r, ui.session) : r.s[type];
  const list = entryDrivers(s, S);
  const order = preset ? preset.filter(x=>list.some(d=>d.id===x.id)) : list.filter(d=>S.res[d.id] && S.res[d.id].pos).sort((a,b)=>S.res[a.id].pos - S.res[b.id].pos).map(d=>({id:d.id, st: q ? '' : (S.res[d.id].status||'')}));
  if(!preset) list.filter(d=>!q && S.res[d.id] && !S.res[d.id].pos && S.res[d.id].status).forEach(d=>order.push({id:d.id, st:S.res[d.id].status}));
  let mode = '';
  const t = trackById(r.trackId);
  const chip = (d, extra='') => { const tm = teamOf(s, d.teamId); return `<span class="ts" style="--tc:${tm?tm.color:'transparent'}"></span><span class="qe-n">${esc(d.name)}${tm?`<small>${esc(tm.name)}</small>`:''}</span>${extra}`; };
  const draw = () => {
    const used = new Set(order.map(x=>x.id)); let pos = 0;
    box.innerHTML = `${q ? '' : `<div class="qe-modes" role="group">${[['',L('Dojel','Finished')],['DNF','DNF'],['DNS','DNS'],['DSQ','DSQ']].map(([k,l])=>`<button type="button" class="subtab" data-qm="${k}" aria-selected="${mode===k}">${l}</button>`).join('')}<span class="muted">${L('Klikáním na jezdce přidáváš do výsledků jako:','Clicking a driver adds them as:')} <b>${mode || L('dojel','finished')}</b></span></div>`}
      <div class="qe-cols"><div><h3>${L('Výsledek','Result')} <span class="muted">${order.length}/${list.length}</span></h3><ol class="qe-ord">${order.map((x,i)=>{ const d = drvOf(s, x.id); pos++;
        return `<li><button type="button" class="qe-it" data-qr="${i}" title="${L('Odebrat','Remove')}"><b class="qe-p">${x.st ? x.st : pos+'.'}</b>${chip(d)}<span class="qe-x" aria-hidden="true">✕</span></button></li>`; }).join('') || `<li class="muted">${L('Klikni na jezdce vpravo v pořadí, v jakém dojeli.','Click the drivers on the right in finishing order.')}</li>`}</ol></div>
      <div><h3>${L('Zbývající jezdci','Remaining drivers')}</h3><div class="qe-pool">${list.filter(d=>!used.has(d.id)).map(d=>`<button type="button" class="qe-it" data-qa="${d.id}">${chip(d)}</button>`).join('') || `<p class="muted">${L('Všichni jezdci jsou zařazení.','All drivers are placed.')}</p>`}</div>
        <div class="qe-tools"><button type="button" class="btn sm" data-qt="undo"${order.length?'':' disabled'}>${L('Vrátit posledního','Undo last')}</button><button type="button" class="btn sm ghost danger" data-qt="clear"${order.length?'':' disabled'}>${L('Vyčistit','Clear')}</button>
        ${!q && order.length < list.length ? `<button type="button" class="btn sm ghost" data-qt="rest">${L('Zbytek jako DNF','Rest as DNF')}</button>` : ''}</div></div></div>`;
  };
  openDialog(`${L('Rychlé zadání','Quick entry')}: ${t ? gpName(t) : ''} · ${sessLabel(s, ui.session)}`, `${note ? `<p class="qe-note">📷 ${esc(note)}</p>` : ''}<div id="qe"></div><p class="hint">${L('Pořadí se uloží až tlačítkem Uložit. Penalizace, pneumatiky a časy zůstanou, jak byly.','The order is saved only when you press Save. Penalties, tyres and times stay as they were.')}</p>`,
    ()=>{
      if(q){ const R = r.s.race;
        list.forEach(d=>{ const i = order.findIndex(x=>x.id===d.id); const e = i>=0 ? qEntry(d.id) : S.res[d.id];
          if(!e) return; const old = e.pos; e.pos = i>=0 ? i+1 : null;
          if(ui.session==='quali'){ if(e.pos===1) R.pole = d.id; else if(old===1 && R.pole===d.id) R.pole = null; }
          qClean(d.id); });
        qSync(s, r, ui.session);
      } else {
        confirmPrefill(S);
        list.forEach(d=>{ const i = order.findIndex(x=>x.id===d.id);
          if(i>=0){ const e = entry(d.id); e.pos = i+1; e.status = order[i].st; }
          else if(S.res[d.id]){ S.res[d.id].pos = null; S.res[d.id].status = ''; cleanEntry(d.id); } });
      }
      toast(L('Výsledky uloženy','Results saved'));
    }, L('Uložit','Save'));
  dlg.classList.add('wide');
  const box = dlgForm.querySelector('#qe');
  box.onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.qm !== undefined){ mode = b.dataset.qm; }
    else if(b.dataset.qa){ order.push({id:b.dataset.qa, st:mode}); }
    else if(b.dataset.qr !== undefined){ order.splice(+b.dataset.qr, 1); }
    else if(b.dataset.qt==='undo') order.pop();
    else if(b.dataset.qt==='clear') order.length = 0;
    else if(b.dataset.qt==='rest'){ const used = new Set(order.map(x=>x.id)); list.filter(d=>!used.has(d.id)).forEach(d=>order.push({id:d.id, st:'DNF'})); }
    draw(); };
  draw();
}

/* ---------- 2.0: ocenění sezóny ---------- */
function seasonAwards(s){
  const st = compute(s), out = []; if(!s.rounds.some(roundHasData)) return out;
  const fin = s.rounds.every(roundHasData);
  const D = new Map(st.drivers.map(d=>[d.id, {d, q:[], gain:0, ptsR:0, dnf:d.dnfs, fin:0}]));
  s.rounds.forEach((r,k)=>{ const Q = r.q && r.q.quali;
    if(Q) Object.entries(Q.res).forEach(([id,e])=>{ const x = D.get(id); if(x && e.pos) x.q.push(e.pos); });
    Object.entries(r.s.race.res).forEach(([id,e])=>{ const x = D.get(id); if(!x || !hasRes(e)) return;
      if(!e.status && e.pos){ x.fin++; const g = Q && Q.res[id] && Q.res[id].pos; if(g) x.gain += g - e.pos; }
      const c = x.d.cells[k]; if(c && c.pts > 0) x.ptsR++; }); });
  const A = [...D.values()].filter(x=>x.d.has);
  const best = (f, min) => A.filter(x=>min ? min(x) : true).sort(f)[0];
  const ch = st.drivers[0];
  if(ch) out.push(['🏆', fin ? L('Mistr světa','World champion') : L('Lídr šampionátu','Championship leader'), ch.name, `${ch.pts} ${L('b.','pts')}`]);
  const w = best((a,b)=>b.d.wins-a.d.wins || b.d.podiums-a.d.podiums); if(w && w.d.wins) out.push(['🥇', L('Nejvíc výher','Most wins'), w.d.name, `${w.d.wins}×`]);
  const qk = best((a,b)=>a.q.reduce((s,v)=>s+v,0)/a.q.length - b.q.reduce((s,v)=>s+v,0)/b.q.length, x=>x.q.length >= Math.min(3, s.rounds.filter(r=>r.q&&r.q.quali).length || 3));
  if(qk) out.push(['⏱️', L('Král kvalifikace','Qualifying king'), qk.d.name, L(`průměr ${dec(qk.q.reduce((s,v)=>s+v,0)/qk.q.length)}`, `avg P${dec(qk.q.reduce((s,v)=>s+v,0)/qk.q.length)}`)]);
  const gn = best((a,b)=>b.gain-a.gain); if(gn && gn.gain > 0) out.push(['📈', L('Nejvíc získaných pozic','Most places gained'), gn.d.name, `+${gn.gain}`]);
  const cs = best((a,b)=>b.ptsR-a.ptsR || b.d.pts-a.d.pts); if(cs && cs.ptsR) out.push(['🎯', L('Nejvíc bodovaných závodů','Most points finishes'), cs.d.name, `${cs.ptsR}×`]);
  const un = best((a,b)=>b.dnf-a.dnf); if(un && un.dnf >= 2) out.push(['💥', L('Smolař sezóny','Unluckiest driver'), un.d.name, `${un.dnf}× DNF`]);
  const me = A.find(x=>x.d.player); if(me){ const mate = A.find(x=>x.d.id!==me.d.id && x.d.teamId===me.d.teamId);
    if(mate) out.push(['🤝', L('Týmový souboj','Teammate battle'), me.d.pts >= mate.d.pts ? me.d.name : mate.d.name, `${Math.max(me.d.pts,mate.d.pts)}:${Math.min(me.d.pts,mate.d.pts)}`]); }
  const tc = st.teams[0]; if(tc && tc.pts) out.push(['🏭', fin ? L('Pohár konstruktérů','Constructors’ champion') : L('Vede pohár konstruktérů','Leading Constructors'), tc.name, `${tc.pts} ${L('b.','pts')}`]);
  return out;
}
function awardsHTML(s){
  const A = seasonAwards(s); if(!A.length) return '';
  const fin = s.rounds.every(roundHasData);
  return `<div class="awards"><h3>${fin ? L('Ocenění sezóny','Season awards') : L('Ocenění sezóny (průběžně)','Season awards (so far)')}</h3><div class="aw-grid">${A.map(([ic,l,n,v])=>`<div class="aw"><span class="aw-ic">${ic}</span><span class="aw-l">${l}</span><b>${esc(n)}</b><small>${esc(v)}</small></div>`).join('')}</div></div>`;
}

/* ---------- 2.0: výsledky ze screenshotu (OCR systému) ---------- */
const ocrNorm = t => norm(t).toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
function lev(a, b){ const m = a.length, n = b.length; if(!m) return n; if(!n) return m; let p = Array.from({length:n+1}, (_,j)=>j);
  for(let i=1;i<=m;i++){ const c = [i]; for(let j=1;j<=n;j++) c[j] = Math.min(p[j]+1, c[j-1]+1, p[j-1] + (a[i-1]===b[j-1]?0:1)); p = c; } return p[n]; }
const simil = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length, 1);
function ocrMatch(items, drivers){
  // items: [{t, x, y, w, h}] souřadnice 0–1 od levého horního rohu
  const D = drivers.map(d=>{ const parts = ocrNorm(d.name).split(' ').filter(Boolean); const sur = parts[parts.length-1] || ''; const sur2 = parts.length > 2 ? parts.slice(-2).join(' ') : sur;
    return {d, full:parts.join(' '), sur, sur2, first:parts[0]||''}; });
  const hits = [];
  items.forEach(it=>{ const T = ocrNorm(it.t); if(T.length < 3) return;
    const toks = T.split(' ');
    let best = null;
    D.forEach(x=>{ let sc = 0;
      if(T.includes(x.full)) sc = 1.2;
      else if(x.sur.length >= 3 && toks.includes(x.sur)) sc = 1.05;
      else if(x.sur2 !== x.sur && T.includes(x.sur2)) sc = 1.05;
      else { toks.forEach(tk=>{ if(tk.length >= 3) sc = Math.max(sc, simil(tk, x.sur) - (Math.abs(tk.length - x.sur.length) > 2 ? .15 : 0)); });
        if(toks.length > 1) sc = Math.max(sc, simil(T, x.full) - .02); }
      if(x.first.length > 1 && toks.some(tk=>tk===x.first || (tk.length===1 && tk===x.first[0]))) sc += .03;
      if(!best || sc > best.sc) best = {x, sc}; });
    if(best && best.sc >= .78) hits.push({d:best.x.d, sc:best.sc, it});
  });
  // jeden jezdec = nejlepší výskyt; seřazení shora dolů (u dvou sloupců zleva doprava)
  const byD = new Map(); hits.forEach(h=>{ const o = byD.get(h.d.id); if(!o || h.sc > o.sc) byD.set(h.d.id, h); });
  let rows = [...byD.values()];
  const xs = rows.map(h=>h.it.x).sort((a,b)=>a-b);
  const split = xs.length > 6 && xs[xs.length-1] - xs[0] > .3 ? (xs[0] + xs[xs.length-1]) / 2 : null;
  rows.sort((a,b)=>{ if(split!=null){ const ca = a.it.x > split, cb = b.it.x > split; if(ca!==cb) return ca - cb; } return (a.it.y + a.it.h/2) - (b.it.y + b.it.h/2); });
  return rows.map(h=>{ const yc = h.it.y + h.it.h/2, tol = Math.max(h.it.h * .7, .006);
    const same = items.filter(o=>o!==h.it && Math.abs((o.y + o.h/2) - yc) < tol && (split==null || (o.x > split) === (h.it.x > split)));
    const txt = [h.it, ...same].map(o=>ocrNorm(o.t)).join(' ');
    const st = /\bDSQ\b|\bDISQ/.test(txt) ? 'DSQ' : /\bDNS\b/.test(txt) ? 'DNS' : /\bDNF\b|\bRET\b|\bRETIRED\b/.test(txt) ? 'DNF' : '';
    return {id:h.d.id, st, sc:h.sc}; });
}
async function prepOcrImage(file){
  const url = URL.createObjectURL(file); const img = new Image();
  await new Promise((res, rej)=>{ img.onload = res; img.onerror = rej; img.src = url; });
  const k = Math.min(1, 3000 / img.naturalWidth) * (img.naturalWidth < 1600 ? 2 : 1);
  const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth*k); cv.height = Math.round(img.naturalHeight*k);
  const g = cv.getContext('2d'); g.drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
  return cv.toDataURL('image/png');
}

/* ---------- 2.0: predikce šampionátu ---------- */
function maxPerRound(s, r){ const sc = scoringOf(s); return (+sc.race[0]||0) + (+sc.pole||0) + (+sc.fl||0) + (r.sprint ? (+sc.sprint[0]||0) : 0); }
function predictSeason(s, N=4000){
  const st = compute(s), sc = scoringOf(s);
  const done = s.rounds.map(roundHasData), left = s.rounds.filter((r,i)=>!done[i]);
  const ds = st.drivers.filter(d=>d.teamId);
  // forma: výsledky jezdce, novější závody mají větší váhu; doplněno průměrem týmu a obecným rozptylem
  const form = new Map(ds.map(d=>[d.id, []]));
  s.rounds.forEach((r,i)=>{ if(!done[i]) return; const w = 1 + i / s.rounds.length;
    Object.entries(r.s.race.res).forEach(([id,e])=>{ if(!form.has(id) || !hasRes(e)) return; form.get(id).push({p: e.status ? null : e.pos, w}); }); });
  const teamAvg = new Map(); ds.forEach(d=>{ const f = form.get(d.id).filter(x=>x.p); const a = teamAvg.get(d.teamId) || []; f.forEach(x=>a.push(x.p)); teamAvg.set(d.teamId, a); });
  const model = ds.map(d=>{ const f = form.get(d.id), fin = f.filter(x=>x.p);
    const tw = fin.reduce((a,x)=>a+x.w,0), mean = tw ? fin.reduce((a,x)=>a+x.p*x.w,0)/tw : null;
    const ta = teamAvg.get(d.teamId) || [], tm = ta.length ? ta.reduce((a,b)=>a+b,0)/ta.length : ds.length*.6;
    const n = fin.length, mu = mean==null ? tm : (mean*n + tm*2) / (n + 2);
    const sd = n > 1 ? Math.sqrt(fin.reduce((a,x)=>a+(x.p-mean)**2,0)/(n-1)) : 4;
    const dnf = (f.filter(x=>!x.p).length + .6) / (f.length + 6);
    return {d, mu, sd:Math.max(2.4, Math.min(6, (sd*n + 4*2)/(n+2))), dnf}; });
  const gauss = () => { let u = 0, v = 0; while(!u) u = Math.random(); while(!v) v = Math.random(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); };
  const base = new Map(ds.map(d=>[d.id, d.pts])), tBase = new Map(st.teams.map(t=>[t.id, t.pts]));
  const titles = new Map(ds.map(d=>[d.id, 0])), tTitles = new Map(st.teams.map(t=>[t.id,0])), top3 = new Map(ds.map(d=>[d.id,0]));
  const finals = new Map(ds.map(d=>[d.id, []]));
  for(let k=0;k<N;k++){
    const P = new Map(base), TP = new Map(tBase); const drift = new Map(model.map(m=>[m.d.id, gauss()*1.6]));
    left.forEach(r=>{ [['race', sc.race], ...(r.sprint ? [['sprint', sc.sprint]] : [])].forEach(([type, tbl])=>{
      const run = model.map(m=>({m, v: Math.random() < m.dnf*(type==='sprint'?.6:1) ? 999 + Math.random() : m.mu + drift.get(m.d.id) + gauss()*m.sd})).sort((a,b)=>a.v-b.v);
      run.forEach((x,i)=>{ if(x.v >= 999) return; const p = +tbl[i] || 0; if(!p) return; P.set(x.m.d.id, P.get(x.m.d.id) + p); TP.set(x.m.d.teamId, (TP.get(x.m.d.teamId)||0) + p); }); }); });
    const order = ds.map(d=>d.id).sort((a,b)=>P.get(b)-P.get(a) || Math.random()-.5);
    titles.set(order[0], titles.get(order[0]) + 1); order.slice(0,3).forEach(id=>top3.set(id, top3.get(id)+1));
    ds.forEach(d=>finals.get(d.id).push(P.get(d.id)));
    const to = [...TP.entries()].sort((a,b)=>b[1]-a[1] || Math.random()-.5); if(to[0]) tTitles.set(to[0][0], (tTitles.get(to[0][0])||0) + 1);
  }
  const q = (arr, p) => { const a = [...arr].sort((x,y)=>x-y); return a[Math.min(a.length-1, Math.floor(p*a.length))]; };
  const rows = ds.map(d=>({d, pts:d.pts, title:titles.get(d.id)/N, top3:top3.get(d.id)/N, lo:q(finals.get(d.id), .1), mid:q(finals.get(d.id), .5), hi:q(finals.get(d.id), .9)}))
    .sort((a,b)=>b.title-a.title || b.mid-a.mid);
  const teams = st.teams.map(t=>({t, pts:t.pts, title:tTitles.get(t.id)/N})).sort((a,b)=>b.title-a.title || b.pts-a.pts);
  // matematika titulu
  const remain = left.reduce((a,r)=>a + maxPerRound(s, r), 0);
  const lead = st.drivers[0] ? st.drivers[0].pts : 0;
  const alive = st.drivers.filter(d=>d.has && d.pts + remain >= lead);
  const next = left[0], nextMax = next ? maxPerRound(s, next) : 0;
  return {rows, teams, remain, alive, left, next, nextMax, st};
}
function viewPredict(s){

    else facts.push(L(`Titul se v příštím závodě rozhodnout nemůže, ${esc(ld.name)} vede o ${gap} b.`, `The title can’t be decided in the next race; ${esc(ld.name)} leads by ${gap} pts.`)); }
  const me = st.drivers.find(d=>d.player && d.has);

      : L(`Tvoje šance na titul: <b>${pct(mr ? mr.title : 0)}</b>, na top 3: <b>${pct(mr ? mr.top3 : 0)}</b>. Odhad konečných bodů ${mr ? `${mr.lo}–${mr.hi}` : ''}.`, `Your title chances: <b>${pct(mr ? mr.title : 0)}</b>, top 3: <b>${pct(mr ? mr.top3 : 0)}</b>. Expected final points ${mr ? `${mr.lo}–${mr.hi}` : ''}.`)); }
  const top = R.rows.filter(x=>x.title >= .005 || x.top3 >= .02).slice(0, 10);
  const bars = top.map(x=>{ const t = teamOf(s, x.d.teamId); return `<div class="pr-row${x.d.player?' me':''}"><span class="pr-n"><span class="ts" style="--tc:${t?t.color:'#888'}"></span>${esc(x.d.name)}<small>${x.pts} ${L('b.','pts')}</small></span>

/* ---------- 2.0: model formy (sdílí predikce a brífink) ---------- */
function formModel(s){
  const st = compute(s), done = s.rounds.map(roundHasData);
  const ds = st.drivers.filter(d=>d.teamId);
  if(!done.some(Boolean)){
    const c = getCareer(), prev = c && [...c.seasons].filter(x=>x.year < s.year && x.rounds.some(roundHasData)).sort((a,b)=>b.year-a.year)[0];
    const P = new Map(); if(prev) compute(prev).drivers.forEach(d=>{ if(d.finN) P.set(slug(d.name), {mu:d.finSum/d.finN, dnf:(d.dnfs+.6)/(d.starts+6)}); });
    const ti = new Map(s.teams.map((t,i)=>[t.id,i])), seen = {};
    return {st, ds, basis: prev && P.size ? 'prev' : 'lineup', prevYear: prev && prev.year, model: ds.map(d=>{ const p = P.get(slug(d.name)); const k = seen[d.teamId] = (seen[d.teamId]||0) + 1;
      return {d, mu: p ? p.mu : 2 + (ti.has(d.teamId) ? ti.get(d.teamId) : 10) * 1.8 + k * .6, sd: p ? 3.2 : 4, dnf: p ? p.dnf : .1}; })};
  }
  const form = new Map(ds.map(d=>[d.id, []]));
  s.rounds.forEach((r,i)=>{ if(!done[i]) return; const w = 1 + i / s.rounds.length;
    Object.entries(r.s.race.res).forEach(([id,e])=>{ if(!form.has(id) || !hasRes(e)) return; form.get(id).push({p: e.status ? null : e.pos, w}); }); });
  const teamAvg = new Map(); ds.forEach(d=>{ const a = teamAvg.get(d.teamId) || []; form.get(d.id).filter(x=>x.p).forEach(x=>a.push(x.p)); teamAvg.set(d.teamId, a); });
  return {st, ds, model: ds.map(d=>{ const f = form.get(d.id), fin = f.filter(x=>x.p);
    const tw = fin.reduce((a,x)=>a+x.w,0), mean = tw ? fin.reduce((a,x)=>a+x.p*x.w,0)/tw : null;
    const ta = teamAvg.get(d.teamId) || [], tm = ta.length ? ta.reduce((a,b)=>a+b,0)/ta.length : ds.length*.6;
    const n = fin.length, mu = mean==null ? tm : (mean*n + tm*2) / (n + 2);
    const sd = n > 1 ? Math.sqrt(fin.reduce((a,x)=>a+(x.p-mean)**2,0)/(n-1)) : 4;
    return {d, mu, sd:Math.max(2.4, Math.min(6, (sd*n + 8)/(n+2))), dnf:(f.filter(x=>!x.p).length + .6) / (f.length + 6)}; })};
}
const gaussR = () => { let u = 0, v = 0; while(!u) u = Math.random(); while(!v) v = Math.random(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); };

/* ---------- 2.0: brífink před závodem ---------- */
function briefingHTML(s, r){
  if(roundHasData(r)) return '';
  const {st, model, basis, prevYear} = formModel(s), N = 3000, wins = new Map(), pods = new Map(), fins = new Map();
  model.forEach(m=>{ wins.set(m.d.id, 0); pods.set(m.d.id, 0); fins.set(m.d.id, []); });
  for(let k=0;k<N;k++){ const run = model.map(m=>({m, v: Math.random() < m.dnf ? 999 + Math.random() : m.mu + gaussR()*m.sd})).sort((a,b)=>a.v-b.v);
    run.forEach((x,i)=>{ if(x.v >= 999){ fins.get(x.m.d.id).push(99); return; } if(i===0) wins.set(x.m.d.id, wins.get(x.m.d.id)+1); if(i<3) pods.set(x.m.d.id, pods.get(x.m.d.id)+1); fins.get(x.m.d.id).push(i+1); }); }
  const top = model.map(m=>({m, w:wins.get(m.d.id)/N})).sort((a,b)=>b.w-a.w).slice(0, 5);
  const pct = x => x > 0 && x < .01 ? '<1 %' : `${Math.round(x*100)} %`;
  const me = model.find(m=>m.d.player);
  let meTxt = '';
  if(me){ const a = fins.get(me.d.id).filter(p=>p<99).sort((x,y)=>x-y); if(a.length){ const q = p => a[Math.floor(p*(a.length-1))];
    meTxt = `<p class="brf-me">${L(`Tvůj odhad: nejspíš <b>${q(.5)}. místo</b> (většinou ${q(.2)}.–${q(.8)}.), šance na pódium ${pct(pods.get(me.d.id)/N)}.`, `Your forecast: most likely <b>P${q(.5)}</b> (usually P${q(.2)}–P${q(.8)}), podium chance ${pct(pods.get(me.d.id)/N)}.`)}</p>`; } }
  // historie tratě v kariéře
  const c = getCareer(), hist = [];
  [...c.seasons].sort((a,b)=>a.year-b.year).forEach(se=>se.rounds.forEach(x=>{ if(x===r || x.trackId!==r.trackId || !roundHasData(x)) return;
    const w = Object.entries(x.s.race.res).find(([,e])=>e.pos===1 && !e.status); const wd = w ? drvOf(se, w[0]) : null;
    const pd = se.drivers.find(d=>d.player); const pe = pd && x.s.race.res[pd.id];
    hist.push({y:se.year, w:wd ? wd.name : '—', me: pe && hasRes(pe) ? (pe.status || pe.pos+'.') : null}); }));
  // forma: poslední 3 výsledky prvních šesti
  const doneR = s.rounds.filter(roundHasData).slice(-3);
  const formRows = st.drivers.filter(d=>d.has).slice(0, 6).map(d=>{ const t = teamOf(s, d.teamId);
    return `<div class="brf-f"><span class="ts" style="--tc:${t?t.color:'#888'}"></span><span>${esc(shortName(d.name))}</span>${doneR.map(x=>{ const e = x.s.race.res[d.id]; const v = !e || !hasRes(e) ? '–' : e.status ? e.status : e.pos;
      return `<i class="fp${typeof v==='number' && v<=3 ? ' p'+v : ''}${typeof v==='number' && v<=10 ? ' pts' : ''}">${v}</i>`; }).join('')}</div>`; }).join('');
  return `<section class="tcard brief"><h3>🎙️ ${L('Před závodem','Race preview')}</h3>
    <div class="brf-l">${L('Šance na výhru','Win chances')}</div>
    ${top.map(x=>{ const t = teamOf(s, x.m.d.teamId); return `<div class="pr-row brf-row"><span class="pr-n"><span class="ts" style="--tc:${t?t.color:'#888'}"></span>${esc(shortName(x.m.d.name))}</span><span class="pr-bar"><i style="width:${Math.max(1, x.w*100)}%;background:${t?t.color:'var(--accent)'}"></i></span><b class="pr-v">${pct(x.w)}</b></div>`; }).join('')}
    ${meTxt}
    ${basis ? `<p class="muted brf-basis">${basis==='prev' ? L(`Před prvním závodem: odhad podle výsledků sezóny ${prevYear}.`, `Before the first race: based on the ${prevYear} season.`) : L('Před prvním závodem: odhad podle pořadí týmů v Soupisce.','Before the first race: based on the team order in Line-ups.')}</p>` : `<div class="brf-l">${L('Forma (poslední 3 závody)','Form (last 3 races)')}</div><div class="brf-form">${formRows}</div>`}
    ${hist.length ? `<div class="brf-l">${L('Tady v kariéře','Here in this career')}</div><ul class="brf-h">${hist.map(h=>`<li><b>${h.y}</b> ${L('vyhrál','won by')} ${esc(h.w)}${h.me ? ` · ${L('ty','you')}: ${esc(String(h.me))}` : ''}</li>`).join('')}</ul>` : ''}
  </section>`;
}
